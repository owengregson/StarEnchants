scroll.randomizer.not-book: "&cThe randomizer only works on an enchant book."
scroll.randomizer.single-book: "&cApply to a single book — split the stack first."
scroll.transmog.success: "&aReordered the enchant display."
scroll.transmog.no-enchants: "&cThat item has no enchants to transmog."
scroll.holy.applied: "&6Holy protection applied — this item will survive your death once."
scroll.holy.apply-target: "&cApply the holy white scroll onto an item."
scroll.holy.already: "&7That item is already holy-protected."
scroll.holy.occupied: "&cThat item already has another applied item — only one fits."
scroll.holy.fail: "&eThe holy scroll failed — the item is not protected."
scroll.holy.kept: "&6Your holy-protected item(s) survived your death — &f{AMOUNT}&6 kept."
# Refused apply: the item has spent its whole holy-protection allowance ({AMOUNT} of {MAX}) and is corrupted.
scroll.holy.corrupted: "&cThat item is corrupted — it has spent all &f{AMOUNT}&c of its &f{MAX}&c holy protections."
scroll.nametag.prompt: "&7Type the new item name in chat (or 'cancel')."
scroll.nametag.gui-title: "&8Rename — & colours work"
scroll.nametag.renamed: "&aRenamed your item."
scroll.nametag.blacklisted: "&cThat name contains a blacklisted word."
scroll.nametag.cancelled: "&7Rename cancelled."
trak.applied: "&aTrak applied — this item now shows its lifetime count."
trak.apply-target: "&cApply the trak gem onto an item."
trak.wrong-kind: "&cThat gem only applies to: &f{KINDS}&c."
trak.already: "&7That item already has this trak."
trak.occupied: "&cThat item already has another applied item — only one fits."
book.unopened.open: "&aYou revealed &f{ENCHANT} {LEVEL}&a (&f{PERCENT}%&a success)!"
book.unopened.empty-tier: "&cThere are no enchants in that tier to reveal."

# ── Use-items (§3.6) — the UNIVERSAL feedback for every right-click use-item, sent WITHOUT the message prefix. ─
# {NAME} = the use-item's display name (colours intact); {TIME_FORMATTED} = the remaining cooldown (h/m/s);
# {CONDITION} = the authored condition source that failed (may be empty). A success set to "" is silent.
use-item.success: ""
use-item.cooldown: "&c&l(!) {NAME}&r&c&l is on cooldown for another &f&n{TIME_FORMATTED}&r&c&l!"
use-item.fail: "&c&l(!) You cannot use {NAME}&r&c&l right now!"

# ── Universal action feedback (ADR-0061) — plugin-wide one-liners ANY feature can reuse, sent WITHOUT the
# message prefix (the use-item send shape). out-of-range: the actor is too far from an action's anchor
# (first consumer: the Mole pet's recall — beyond the recall radius or in another world).
feedback.out-of-range: "&c&l(!) You are too far away!"

# ── Pets (ADR-0052) — the Pet Food gesture feedback. The universal ability-activated / ended / on-cooldown
# messages are CONFIG templates (config.yml pets:), not lang keys, because they carry the pack's likeness.
pet.food-applied: "&aYour pet gained &f+{AMOUNT}&a levels!"
pet.food-max: "&cThat pet is already at its maximum level."
pet.food-stacked: "&cUnstack that pet first — food feeds one pet at a time."
# The 2s shared pet-use gate (ADR-0070 rider): sent when a pet active is used while ANOTHER pet's shared
# gate is still open. Prefix-free (the fragment idiom).
pet.shared-cooldown: "&c&l(!) Your pets&r&c&l are on a shared cooldown for another &f&n{TIME_FORMATTED}&r&c&l!"

# ── Carrier apply outcomes (enchant books, success dust, white scroll — the drag-onto-gear economy) ──────
# The carrier is a book/dust/white-scroll dragged onto gear. A failed roll spends the carrier; the enchant
# book's failure branch depends on the book likeness (protection saved it / it shattered / it survived).
carrier.not-carrier: "&cThat is not an enchant carrier."
carrier.apply-target: "&cApply the carrier onto an item."
carrier.single-item: "&cApply the carrier to a single item — split the stack first."
carrier.grants-nothing: "&cThis carrier grants nothing applicable."
carrier.fail-protected: "&eThe enchant failed — but your protection saved the item."
carrier.fail-shattered: "&cThe enchant failed — the item shattered."
carrier.fail-unharmed: "&eThe enchant failed — the item is unharmed."
# Success dust boosts a book's apply chance. {PERCENT} = the book's new success; {MAX} = the books.max-success ceiling.
carrier.success-now: "&aThe book's success chance is now &f{PERCENT}%&a."
carrier.dust.only-book: "&cDust can only boost an enchant book."
carrier.dust.ceiling: "&7That book is already at the &f{MAX}%&7 success ceiling."
carrier.dust.no-bonus: "&cThis dust confers no success bonus."
# Sent just before an apply roll that spends a BOOK_RATE_MODIFIER apply charge (Enchanter pet).
# {RATE} = the book's own success; {BONUS} = the one-shot charge added on top of it.
carrier.applying-book: "&7Applying enchantment book... &e{RATE}&6(+{BONUS})&e% success chance..."
# White scroll — a one-shot protect against a failed enchant (its own apply-success roll gates the guard).
white-scroll.already: "&7That item is already protected."
white-scroll.fail: "&eThe White Scroll failed — the item is not protected."
white-scroll.applied: "&aProtected — a failed enchant will spare this item once."
