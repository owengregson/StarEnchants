scroll.nametag.target-gone: "&cThe item to rename is no longer there — your nametag was returned."
scroll.nametag.cannot-rename: "&cThat item cannot be renamed — your nametag was returned."

# ── Item result messages (soul mode, crystal/heroic/slot apply, scroll/book outcomes) ──────────────────
# Soul-mode feedback is multi-line (sent via lines(), not format()). soul.empty shows when soul mode is
# toggled with no gem (or a zero-soul gem right-clicked); keep these as YAML lists so each line is its own
# chat line.
soul.activate:
  - " "
  - "&a&l** SOUL MODE: &nON&r&a&l **"
  - "&7Your soul enchantments will now drain souls."
  - " "
soul.deactivate:
  - " "
  - "&c&l** SOUL MODE: &nOFF&r&c&l **"
  - "&7Your soul enchantments will no longer drain souls."
  - " "
soul.empty:
  - " "
  - "&c&l** SOUL MODE: &nOFF&r&c&l **"
  - "&7You have no soul gems left!"
  - " "
soul.soul-use: "&7Souls remaining: &a{AMOUNT}"
# Rage stacks (§3) — the Rage enchant's action bar lines (the service owns rage audio/feedback now).
# {STACKS} = the attacker's current rage stacks (min(combo streak, rage level)). Both sent prefix-free to the action bar.
rage.stacks-actionbar: "&f&k|&e&k| &r&6Rage Stacks: &r&f&n{STACKS}x&r &e&k|&f&k|&r"
rage.stacks-broken-actionbar: "&f&k|&e&k| &r&6Rage Stacks: &r&c&nBROKEN&r &e&k|&f&k|&r"
crystal.apply-success: "&aApplied &f{CRYSTAL}&a to your item."
crystal.no-slots: "&cThis item has no free crystal slots ({MAX} max)."
crystal.merge: "&dMerged into a multi-crystal: &f{CRYSTAL}&d."
crystal.extract-success: "&aExtracted &f{CRYSTAL}&a back into a crystal."
mask.apply-success: "&aApplied &f{MASK}&a to your helmet."
mask.remove-success: "&aRemoved &f{MASK}&a from your helmet."
# ── Weapon reforges (ADR-0070) ─────────────────────────────────────────────────────────────────────────
reforge.no-such: "&cNo such reforge: &f{KEY}"
reforge.no-compile: "&c{KEY} &cdid not compile."
reforge.on-item: "&cApply the reforge onto a weapon."
reforge.single-item: "&cApply the reforge to a single weapon — split the stack first."
reforge.not-weapon: "&f{DISPLAY} &conly applies to a weapon."
reforge.occupied: "&cThat weapon already holds a reforge — extract it with an Item Extractor first."
reforge.none: "&cThat weapon carries no reforge to extract."
reforge.apply-success: "&aApplied &f{REFORGE}&a to your weapon."
reforge.extract-success: "&aExtracted &f{REFORGE}&a back into a reforge."
# The universal SHIFT+right-click feedback (activated/ended/on-cooldown/fail) lives in config.yml
# `reforges:` templates — the pets convention 1:1 (identity rework), not lang keys.
# Per-reforge cues (ADR-0071). Singularity/Castling name a target; Supernova Core banks/discharges; The
# Unhanding shuffles; the Grappler speaks its whiff. All prefix-free.
reforge.grapple.whiff: "&c&l(!) &cYour hook finds nothing within {RANGE} blocks."
reforge.castling.no-target: "&c&l(!) &cNo enemy in your crosshair within {RANGE} blocks."
reforge.castling.countdown: "&e&lCastling… &f{SECONDS}"
reforge.castling.countdown-victim: "&c&lCastling bears down… &f{SECONDS}"
reforge.castling.warned: "&c&l(!) &cA castling bears down on you — break line of sight!"
reforge.castling.aborted: "&c&l(!) &cThe castling fizzles — you lost sight of your target."
reforge.castling.swapped: "&e&lCastled! &fYou traded places with &e{TARGET}&f."
reforge.castling.swapped-victim: "&c&l(!) &cYou were castled by &e{PLAYER}&c!"
reforge.battery.banked-actionbar: "&6Core charged: &e{STORED}&6 stored ({HITS} left)"
reforge.battery.discharged: "&6Supernova! &e{AMOUNT}&6 bonus damage unloaded."
reforge.battery.spent-empty: "&7The core discharges... nothing was banked."
reforge.unhanding.shuffled-victim: "&fYour weapon hand is unhanded — your hotbar shuffles!"
reforge.unhanding.struck: "&fYou unhand your foe — their held item is shuffled away."
heroic.success: "&6Heroic upgrade succeeded! &7Your gear is now &6heroic&7."
heroic.fail: "&cThe heroic upgrade failed — the upgrade was consumed."
slot.apply: "&aSlots increased — this item now has &f{SLOTS}&a total."
slot.at-cap: "&cThat item is already at the maximum slots."
slot.fail: "&eThe orb failed — no slots were added."
scroll.black.success: "&aExtracted &f{ENCHANT}&a into a book."
scroll.black.fail: "&cThe black scroll crumbled — nothing was extracted."
scroll.black.no-enchants: "&cThat item has no enchants to extract."
