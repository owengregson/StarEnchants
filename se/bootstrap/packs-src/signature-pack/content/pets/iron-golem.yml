# Iron Golem Pet — an ACTIVE pet (ADR-0052): right-click for temporary absorption hearts. Each absorption
# level is two hearts (II=+4, III=+6, IV=+8, V=+10); both the hearts and how long they can last scale with
# level. `duration` mirrors the potion so the universal ENDED message lands as the hearts fade.
display: "Golem"
color: "{#ccc5c1}"
type: ACTIVE
head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGE2ZTA0MjljY2FhYmI2ZjVmMGM1ZDUxM2M3OTViZWQ2ZDgwZmNlNzJmNTdmNGJjM2E2MTZhZWUyM2UxMjU3MiJ9fX0="
descriptor: "&eA hulking protector with a heart of iron. Lends you its hide when the blows rain down."
description:
  - "{#ccc5c1}* Grants temporary absorption health"
levels:
  # +4 hearts / 10s → +6 / 15s → +8 / 20s → +10 / 25s; the cooldown holds at 2m.
  1:
    cooldown: 2400
    duration: 200
    effects:
      - { SOUND: { sound: "ENTITY_IRON_GOLEM_REPAIR", volume: 1.0, pitch: 1.0 } }
      - { POTION: { effect: "ABSORPTION", level: 2, duration: 200, who: "@Self" } }
  25:
    cooldown: 2400
    duration: 300
    effects:
      - { SOUND: { sound: "ENTITY_IRON_GOLEM_REPAIR", volume: 1.0, pitch: 1.0 } }
      - { POTION: { effect: "ABSORPTION", level: 3, duration: 300, who: "@Self" } }
  50:
    cooldown: 2400
    duration: 400
    effects:
      - { SOUND: { sound: "ENTITY_IRON_GOLEM_REPAIR", volume: 1.0, pitch: 1.0 } }
      - { POTION: { effect: "ABSORPTION", level: 4, duration: 400, who: "@Self" } }
  100:
    cooldown: 2400
    duration: 500
    effects:
      - { SOUND: { sound: "ENTITY_IRON_GOLEM_REPAIR", volume: 1.0, pitch: 1.0 } }
      - { POTION: { effect: "ABSORPTION", level: 5, duration: 500, who: "@Self" } }
