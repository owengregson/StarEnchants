# Eagle Pet — an ACTIVE pet (ADR-0052): right-click for a 10s window of bonus damage while you fight from
# BELOW — the armed ATTACK rider is gated on %actor.belowvictim% (how many blocks your feet sit below the
# victim's) exceeding 1.5. Only the bonus scales with level; the cooldown holds at 2m30s.
display: "Eagle"
color: "{#eea500}"
type: ACTIVE
head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNGMyN2UzY2I1MmE2NDk2OGU2MGM4NjFlZjFhYjg0ZTBhMGNiNWYwN2JlMTAzYWM3OGRhNjc3NjE3MzFmMDBjOCJ9fX0="
descriptor: "&eA sky hunter that strikes hardest from beneath its prey. Keep your quarry above you."
description:
  - "{#eea500}* Temporarily deal more damage while below your opponent"
levels:
  # +20% → +25% → +30% → +35%, each in a 10s window.
  # CALIBRATION: amounts are EFFECTIVE under combat.attack-scale 5.0 (4/5/6/7 land as +20/25/30/35%
  # final, ADR-0050 R2); retune if you change the knob.
  1:
    cooldown: 3000
    duration: 200
    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_ENDER_DRAGON_FLAP", volume: 1.0, pitch: 1.4 } } ] }
      - { trigger: ATTACK, condition: "%actor.belowvictim% > 1.5", effects: [ { DAMAGE_MOD: { side: attack, mode: add, amount: 4 } } ] }
  25:
    cooldown: 3000
    duration: 200
    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_ENDER_DRAGON_FLAP", volume: 1.0, pitch: 1.4 } } ] }
      - { trigger: ATTACK, condition: "%actor.belowvictim% > 1.5", effects: [ { DAMAGE_MOD: { side: attack, mode: add, amount: 5 } } ] }
  50:
    cooldown: 3000
    duration: 200
    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_ENDER_DRAGON_FLAP", volume: 1.0, pitch: 1.4 } } ] }
      - { trigger: ATTACK, condition: "%actor.belowvictim% > 1.5", effects: [ { DAMAGE_MOD: { side: attack, mode: add, amount: 6 } } ] }
  100:
    cooldown: 3000
    duration: 200
    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_ENDER_DRAGON_FLAP", volume: 1.0, pitch: 1.4 } } ] }
      - { trigger: ATTACK, condition: "%actor.belowvictim% > 1.5", effects: [ { DAMAGE_MOD: { side: attack, mode: add, amount: 7 } } ] }
