# Owl Pet — an ACTIVE pet (ADR-0061): right-click sweeps every OTHER player within the bracket radius —
# their Invisibility is stripped AND locked out for the bracket window (POTION_LOCK: the modern potion-event
# guard cancels any re-application; the per-tick re-strip is the sole enforcer on 1.8.9 — full fidelity on
# every version). duration mirrors the lock ticks so the universal ENDED message lands exactly when enemies
# may vanish again. Deliberately NO condition gate: an empty sweep still burns the cooldown — scouting for
# hidden players is the point, and a free re-roll would make the reveal spammable.
