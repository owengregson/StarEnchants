# Mole Pet — an ACTIVE pet (ADR-0061): SNEAK + right-click DIGS a temporary home (marks your spot, arms the
# cooldown, opens a 30s recall window); a plain right-click DURING the window instantly teleports you home if
# you are within 50 blocks (out of range / cross-world / an active teleblock keeps the window alive for a
# retry). The window expiring unused still spends the cooldown. The %sneaking% condition gates the DIG only —
# it fails a non-sneaking fresh click BEFORE the cooldown arms (that click answers with message-on-no-home);
# the recall interception happens before the gate walk entirely, so the armed cooldown never blocks the
# return trip. Use-XP is granted on the successful RECALL, not the dig. The 30s window and 50-block range are
# bracket-invariant (owner-pinned); only the cooldown scales with level. While the window is live the plugin
# draws a pulsating ring on the home block and, while you are within recall range, a dust tracer line
# home→player in the pet's colour (everyone nearby sees them — finding the home is the counterplay). ALL mole
# sound cues — dig, teleport-home, leaving/re-entering the recall range, and the window expiring unused — are
# layered code-side tables (PetHomeVisuals, ADR-0067), not authored here: several layers name sounds absent on
# older servers, and a content token that does not resolve is a BLOCKING diagnostic while code-side layers
# skip silently.
