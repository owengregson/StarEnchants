# Imported from EliteEnchantments (id: overload). Review before shipping.
display: "Overload"
description:
  - "&eIncreases your maximum health"
  - "&ewhile worn."
trigger: PASSIVE
applies-to: [ARMOR]
group: "legendary"
tier: legendary
# R-QC63: on the codex's 14-name stacking whitelist (`02-enchants-armor-m-z.md` §0.3) — every worn piece
# fires with its OWN level. Everything else in this pack takes the engine default, one contribution per
# wearer at the highest worn level.
stacks: true
suppress-immune: true  # permanent worn buff — unsilenceable (Silence/Solitude/Perfect-Solitude can't disable THIS enchant; other enchants still get silenced)
levels:
  1:
    effects:
      - { POTION: { effect: "HEALTH_BOOST", level: 1, duration: 200, who: "@Self" } }  # from POTION:HEALTH_BOOST:1:PLAYER — EE omitted duration — defaulted to 200t (10s); review for held buffs
  2:
    effects:
      - { POTION: { effect: "HEALTH_BOOST", level: 2, duration: 200, who: "@Self" } }
  3:
    effects:
      - { POTION: { effect: "HEALTH_BOOST", level: 3, duration: 200, who: "@Self" } }
