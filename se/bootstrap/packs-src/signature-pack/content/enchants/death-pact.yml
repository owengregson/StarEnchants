# Imported from EliteEnchantments (id: death-pact). Review before shipping.
display: "Death Pact"
description:
  - "&eThe more health you are missing, the"
  - "&eless damage you take, and the less"
  - "&eyou deal."
trigger: [ATTACK, DEFENSE]
applies-to: [ARMOR]
group: "godly"
tier: godly
levels:
  1:
    chance: 100
    effects:
      - { PARTICLE: { particle: "SOUL", count: 12 } }
      # Two-way by design: on incoming hits a defense-side reduction blunts the damage taken;
      # on your own hits the same defense contribution shrinks your outgoing damage.
      - { DAMAGE_MOD: { side: "defense", mode: "add", amount: "(100 - %actor.healthpercent%) / 25" } }
  2:
    chance: 100
    effects:
      - { PARTICLE: { particle: "SOUL", count: 12 } }
      - { DAMAGE_MOD: { side: "defense", mode: "add", amount: "(100 - %actor.healthpercent%) / 18" } }
  3:
    chance: 100
    effects:
      - { PARTICLE: { particle: "SOUL", count: 12 } }
      - { DAMAGE_MOD: { side: "defense", mode: "add", amount: "(100 - %actor.healthpercent%) / 12" } }
