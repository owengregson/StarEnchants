# King of the Hill — victory-spoils set: take less, deal more.
display: "&c&lK&6&l.&e&lO&2&l.&b&lT&5&l.&d&lH"
description: "&fRise to supremacy with the &c&lK&6&l.&e&lO&2&l.&b&lT&5&l.&d&lH &fset, clad in victory and the spoils of war."
complete: 4
# Announce on a completion transition (Cosmic Pack default; set name + colour authored verbatim).
announce: true
equip-message: "\n&f&l** &c&lK&6&l.&e&lO&2&l.&b&lT&5&l.&d&lH &f&lSET EQUIPPED &f&l**\n"
remove-message: "\n&7&l** K.O.T.H SET REMOVED **\n"
armor:
  enchants:
    PROTECTION: 4
    UNBREAKING: 3
  lore:
    - "&fRise to supremacy with the &c&lK&6&l.&e&lO&2&l.&b&lT&5&l.&d&lH &fset, clad in victory and the spoils of war."
    - ""
    - "&c&lK&6&l.&e&lO&2&l.&b&lT&5&l.&d&lH &f&lSET BONUS"
    - "&f* Deal 20% more damage to all enemies"
    - "&f* Enemies deal 12% less damage to you"
    - "&f* Victorious Ability"
    - ""
    - "&f&lVICTORIOUS"
    - "&f* Deal 5% more damage for each player within 7 blocks, up to +40% damage"
    - "&7&o(Requires all four K.O.T.H set items.)"
  pieces:
    helmet:     { material: DIAMOND_HELMET,     name: "&c&lK&6&l.&e&lO&2&l.&b&lT&5&l.&d&lH &f&lHelmet&r" }
    chestplate: { material: DIAMOND_CHESTPLATE, name: "&c&lK&6&l.&e&lO&2&l.&b&lT&5&l.&d&lH &f&lChestplate&r" }
    leggings:   { material: DIAMOND_LEGGINGS,   name: "&c&lK&6&l.&e&lO&2&l.&b&lT&5&l.&d&lH &f&lLeggings&r" }
    boots:      { material: DIAMOND_BOOTS,      name: "&c&lK&6&l.&e&lO&2&l.&b&lT&5&l.&d&lH &f&lBoots&r" }
weapon:
  enchants:
    SHARPNESS: 5
    UNBREAKING: 3
  material: DIAMOND_SWORD
  name: "&c&lK&6&l.&e&lO&2&l.&b&lT&5&l.&d&lH &f&lSword&r"
  lore:
    - "&fClaim victory with the &c&lK&6&l.&e&lO&2&l.&b&lT&5&l.&d&lH &r&fSword, a weapon that symbolizes dominance and superior strength."
    - ""
    - "&c&lK&6&l.&e&lO&2&l.&b&lT&5&l.&d&lH &f&lWEAPON BONUS"
    - "&f* Deal 5% more damage to all enemies"
    - "&7&o(Requires all four K.O.T.H set items.)"
# Behaviours: on:armor fires while the set is complete; on:weapon also requires the set weapon held.
bonuses:
  - on: armor
    trigger: DEFENSE
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: defense, mode: add, amount: 12 } }
  - on: weapon
    trigger: ATTACK
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: attack, mode: add, amount: 25 } }
  # Victorious — scale outgoing damage with the crowd: +5% per nearby player (friend OR foe) within 7 blocks,
  # capped at +40% (the Victorious contribution alone; folds additively with the set's other buffs).
  - on: weapon
    trigger: ATTACK
    chance: 100
    effects:
      - { DAMAGE_SCALE: { side: attack, mode: add, per: 5, cap: 40, who: "@AllPlayers{r=7}" } }
      - { PARTICLE: { particle: FIREWORKS_SPARK, count: 8 } }
  # Victorious crown aura (cosmetic, redrawn every 0.5s): a white redstone-dust ring just above the floor (≈feet
  # level) the size of the radius, plus a dust tether from each nearby player to the wearer at the same height.
  # REPEATING has no victim, so the AoE centres on the wearer.
  - on: armor
    trigger: REPEATING
    repeat: 10
    chance: 100
    effects:
      - { PARTICLE_RING: { particle: REDSTONE, r: 255, g: 255, b: 255, radius: 7, count: 60, height: 0.1 } }
      - { PARTICLE_LINE: { particle: REDSTONE, r: 255, g: 255, b: 255, density: 2, height: 0.1, who: "@AllPlayers{r=7}" } }
