# Cupid — love-themed diamond set: damage boost, defensive reduction, bow resistance.
display: "{#f472b1}&lCupid"
description: "{#f472b1}Move with the grace of a lover with the Cupid Set, infused with the power of passion."
complete: 4
# Announce on a completion transition (Cosmic Pack default; set name + colour authored verbatim).
announce: true
equip-message: "\n{#f472b1}&l** Cupid SET EQUIPPED {#f472b1}&l**\n"
remove-message: "\n&7&l** Cupid SET REMOVED **\n"
armor:
  enchants:
    PROTECTION: 4
    UNBREAKING: 3
  lore:
    - "{#f472b1}Move with the grace of a lover with the Cupid Set, infused with the power of passion."
    - ""
    - "{#f472b1}&lCUPID SET BONUS"
    - "{#f472b1}* Deal 20% more damage to all enemies"
    - "{#f472b1}* Enemies deal 12% less damage to you"
    - "{#f472b1}* Bow attacks deal 15% less damage to you"
    - "{#f472b1}* Lovestruck Ability"
    - ""
    - "{#f472b1}&lLOVESTRUCK"
    - "{#f472b1}* Permanent Regeneration I"
    - "{#f472b1}* Chance to remove half of your victim's overhealth for 3 seconds"
    - "&7&o(Requires all four Cupid set items.)"
  pieces:
    helmet:     { material: DIAMOND_HELMET,     name: "{#f472b1}&lCherubic Crown&r" }
    chestplate: { material: DIAMOND_CHESTPLATE, name: "{#f472b1}&lHeartfelt Armor&r" }
    leggings:   { material: DIAMOND_LEGGINGS,   name: "{#f472b1}&lPassionate Greaves&r" }
    boots:      { material: DIAMOND_BOOTS,      name: "{#f472b1}&lAmorous Sandals&r" }
weapon:
  enchants:
    SHARPNESS: 5
    UNBREAKING: 3
  material: DIAMOND_SWORD
  name: "{#f472b1}&lCupid's Dagger&r"
  lore:
    - "{#f472b1}Wield Cupid's Dagger, a blade forged from the essence of love, capable of piercing hearts with its power."
    - ""
    - "{#f472b1}&lCUPID WEAPON BONUS"
    - "{#f472b1}* Deal 5% more damage to all enemies."
    - "&7&o(Requires all four Cupid set items.)"
# Behaviours: on:armor fires while the set is complete; on:weapon also requires the set weapon held.
bonuses:
  - on: armor
    trigger: DEFENSE
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: defense, mode: add, amount: 12 } }
  # Bow resistance — the "Bow attacks deal 15% less damage to you" lore line.
  - on: armor
    trigger: DEFENSE
    chance: 100
    condition: '%victim.helditem% contains "BOW"'
    effects:
      - { DAMAGE_MOD: { side: defense, mode: add, amount: 15 } }
  # Lovestruck (permanent) — Regeneration I while the full set is worn.
  - on: armor
    trigger: [PASSIVE]
    chance: 100
    effects:
      - { POTION: { effect: REGENERATION, level: 1, duration: 200, who: "@Self" } }
  # Lovestruck — 15% on hit (30s cd): strip HALF the victim's overhealth (max health above 20) for 3s.
  # The condition gate runs before the cooldown arms, so a no-overhealth hit never burns the 30s.
  - on: armor
    trigger: ATTACK
    chance: 15
    cooldown: 600
    condition: "%victim.maxhealth% > 20"
    effects:
      - { SOUND: { sound: "ENTITY_ALLAY_DEATH|ENTITY_VEX_DEATH", volume: 1.0, pitch: 1.5 } }
      - { MAX_HEALTH_DRAIN: { fraction: 0.5, baseline: 20, amount: 0, duration: 60, who: "@Victim" } }
      - { PARTICLE: { particle: HEART, count: 10 } }
      - { MESSAGE: { channel: title, text: "{#f472b1}&l** LOVESTRUCK **", subtitle: "&7from &c{ATTACKER}", who: "@Victim" } }
      - { MESSAGE: { text: "{#f472b1}&l** LOVESTRUCK &r&7[&f{VICTIM}&7] &r{#f472b1}&l**" } }
  - on: weapon
    trigger: ATTACK
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: attack, mode: add, amount: 25 } }
