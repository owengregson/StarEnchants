# Stellar — cosmic diamond set; absorption shield on defense, Rift Blade weapon.
display: "{#c94dd8}&lStellar"
description: "{#c94dd8}Harness the power of the cosmos with the Stellar Set, transcending space and time to outmaneuver any foe."
complete: 4
# Announce on a completion transition (Cosmic Pack default; set name + colour authored verbatim).
announce: true
equip-message: "\n{#c94dd8}&l** Stellar SET EQUIPPED {#c94dd8}&l**\n"
remove-message: "\n&7&l** Stellar SET REMOVED **\n"
armor:
  enchants:
    PROTECTION: 4
    UNBREAKING: 3
  lore:
    - "{#c94dd8}Harness the power of the cosmos with the Stellar Set, transcending space and time to outmaneuver any foe."
    - ""
    - "{#c94dd8}&lSTELLAR SET BONUS"
    - "{#c94dd8}* Deal 20% more damage to all enemies"
    - "{#c94dd8}* Dimensional Shift Passive Ability"
    - ""
    - "{#c94dd8}&lDIMENSIONAL SHIFT"
    - "{#c94dd8}* Chance to teleport behind your enemy and gain Invisibility & Speed IV for 5 seconds"
    - "&7&o(Requires all four Stellar set items.)"
  pieces:
    helmet:     { material: DIAMOND_HELMET,     name: "{#c94dd8}&lQuantum Hood&r" }
    chestplate: { material: DIAMOND_CHESTPLATE, name: "{#c94dd8}&lPhase Plate&r" }
    leggings:   { material: DIAMOND_LEGGINGS,   name: "{#c94dd8}&lWarp Leggings&r" }
    boots:      { material: DIAMOND_BOOTS,      name: "{#c94dd8}&lBlink Boots&r" }
weapon:
  enchants:
    SHARPNESS: 5
    UNBREAKING: 3
  material: DIAMOND_SWORD
  name: "{#c94dd8}&lRift Blade&r"
  lore:
    - "{#c94dd8}Wield the Rift Blade, a sword that tears through dimensions, striking with unpredictable swiftness."
    - ""
    - "{#c94dd8}&lSTELLAR WEAPON BONUS"
    - "{#c94dd8}* Deal 5% more damage to all enemies"
    - "&7&o(Requires all four Stellar set items.)"
# Behaviours: on:armor fires while the set is complete; on:weapon also requires the set weapon held.
bonuses:
  - on: armor
    trigger: DEFENSE
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: defense, mode: add, amount: 5 } }
  - on: armor
    trigger: DEFENSE
    chance: 20
    cooldown: 200
    effects:
      - { POTION: { effect: ABSORPTION, level: 2, duration: 100, who: "@Self" } }
  - on: weapon
    trigger: ATTACK
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: attack, mode: add, amount: 25 } }
  # Dimensional Shift — 15% on being hit (30s cd): vanish + Speed IV for 5s and blink 1 block behind the
  # attacker (the VICTIM slot on DEFENSE is the attacker); on top of them if there's no safe spot.
  - on: armor
    trigger: DEFENSE
    chance: 15
    cooldown: 600
    effects:
      - { SOUND: { sound: "ENTITY_ILLUSIONER_MIRROR_MOVE", volume: 1.0, pitch: 1.0 } }
      - { POTION: { effect: INVISIBILITY, level: 1, duration: 100, who: "@Self" } }
      - { POTION: { effect: SPEED, level: 4, duration: 100, who: "@Self" } }
      - { TELEPORT_BEHIND: { of: VICTIM, distance: 1, onFail: ONTOP, who: "@Self" } }
      - { PARTICLE: { particle: PORTAL, count: 40 } }
      - { MESSAGE: { channel: title, text: "{#c94dd8}&l** DIMENSIONAL SHIFT **", subtitle: "&7from &c{ATTACKER}", who: "@Victim" } }
      - { MESSAGE: { text: "{#c94dd8}&l** DIMENSIONAL SHIFT &r&7[&f{VICTIM}&7] &r{#c94dd8}&l**" } }
