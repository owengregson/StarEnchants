# Randomizer Dust (docs/v3-directives.md §I) — drag onto an enchant book to REROLL its success chance to
# a random value in [min-percent, max-percent]. Failure is always 100 − success, so rerolling success
# randomizes both — the "success and failure chances" lore below is truthful. The `type` stays
# `randomizer-scroll` (PDC/type keys are stable and NEVER renamed); only the display likeness changed to
# "Randomizer Dust". One physical item per file; reload with /se reload. Messages: lang.yml scroll.randomizer.*.
type: randomizer-scroll

material: REDSTONE
name: "{#c11101}&lRandomizer Dust"
lore:
  - "&eRandomizes the success and failure chances of an enchantment book."
  - "&7Drag n' Drop on an item to apply."
# The book's new success chance is rolled uniformly in [min-percent, max-percent] (each 0–100).
min-percent: 25
max-percent: 100
