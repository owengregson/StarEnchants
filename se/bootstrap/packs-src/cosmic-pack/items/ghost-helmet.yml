# Matrix: 10-armor-sets.md § Ghost — the HELMET likeness.
# WHY THIS FILE EXISTS: a set def shares `armor.lore` / `armor.enchants` across all four pieces and its
# `pieces:` members carry material + name only, so this piece's flavour lore, its dye, its halved M-Kit
# armour value, its durability, its per-piece heroic reduction rung and its roster probabilities have nowhere
# to live on content/sets/ghost.yml. Recorded here until a set-piece surface exists (deferred-content.md);
# ItemsLoader does not yet claim `type: set-piece`.
# IDENTITY (ability set): the jar tags each piece with a per-set NBT key and matches on THAT, never on lore —
# the port carries it as the engine's set PDC component, so identity is data on both sides.
type: set-piece
set: sets/ghost
slot: helmet
material: LEATHER_HELMET
name: "§3§lGhostly Hood"
lore:
  - "§7§oA tattered hood haunted by"
  - "§7§othe echoes of all lost souls."
color: "#808080"   # Bukkit GRAY; `pieces:` has no colour knob
enchants:
  PROTECTION: 4
  UNBREAKING: 3
# M-KIT TIER. Armour value 2 — HALVED by the M-Kit rule (a non-M-Kit set carries 20 across four pieces, this
# one 11) — durability 810, and an 8 % per-piece incoming reduction. The reduction is the set's whole
# behaviour and is authored on content/sets/ghost.yml as the full-set 45 % (16 chest + 13 legs + 8 boots +
# 8 helm), because completion is all-or-nothing and the engine has no per-slot heroic ladder. The armour
# value beyond the leather base needs the engine's defence mods on 1.8.9 (no armour attribute pre-1.9).
armor-value: 2
durability: 810
heroic: true              # M-Kit tier, minted heroic out of the box
defense-reduction: 8      # percent, this piece's share of the set's 45 %
heroic-lore:
  - ""
  - "§7+2 Armor Value"
  - "§7810 Durability"
  - "§4This armor is stronger than diamond."
# THE MINT (recorded, no authoring surface): 8 base roster entries, each rolled NEARLY MAXED under the family
# formula, plus the piece's probability rolls. The pool draw is the set's, not this piece's alone.
roll-formula: "min(M, max(1, M - 2) + rand(3))"
roster-size: 8
rolls:
  - "60% Valor"
  - "60% Angelic"
  - "60% Tank"
  - "17.5% Paladin Armored"
  - "17.5% Alien Implants"
mastery-pool:
  draw: "2 without replacement, 50% each"
  entries: ["Horrify", "Feign Death", "Poltergeist", "Mark of the Beast"]
# Only `enchants/poltergeist` exists in this pack today; Horrify, Feign Death and Mark of the Beast are
# batch-07 stops. A piece also refuses ordinary enchant books unless the book carries a matching Mastery
# Shard (support-item rule, §C.9) — an item-flow rule, owned by the support batch.
