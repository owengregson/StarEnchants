# Matrix: 10-armor-sets.md § KOTH — the BOOTS likeness.
# WHY THIS FILE EXISTS: the per-piece roster, the leather dye, the out-of-the-box heroic stamp and the
# per-slot armour/durability values have no surface on a set def (`armor.*` is shared; `pieces:` carries
# material + name only). Recorded here until a set-piece surface exists (deferred-content.md); ItemsLoader
# does not yet claim `type: set-piece`.
# IDENTITY: engine PDC set stamp (the jar matched plain-set pieces by forgeable lore).
type: set-piece
set: sets/koth
slot: boots
material: LEATHER_BOOTS
name: "§f§l§k!§r §c§lK§6§l.§e§lO§a§l.§b§lT§5§l.§d§lH §f§l§k!§r §f§l§nBoots§r"
