# Matrix: 10-armor-sets.md § Ghost — the CHESTPLATE likeness.
# WHY THIS FILE EXISTS: this piece's flavour lore, dye, halved M-Kit armour value, durability, per-piece
# heroic reduction rung and roster probabilities have no surface on a set def (`armor.*` is shared across all
# four pieces; `pieces:` carries material + name only). Recorded here until a set-piece surface exists
# (deferred-content.md); ItemsLoader does not yet claim `type: set-piece`.
# IDENTITY (ability set): a per-set NBT tag in the jar, the engine's set PDC component here — never lore.
type: set-piece
set: sets/ghost
slot: chestplate
material: LEATHER_CHESTPLATE
name: "§3§lGhostly Shroud"
lore:
  - "§7§oA thin, sheer shroud that seems"
  - "§7§oto defy gravity in its movements."
color: "#808080"   # Bukkit GRAY; `pieces:` has no colour knob
enchants:
  PROTECTION: 4
  UNBREAKING: 3
# M-Kit tier: armour 4 (halved), durability 1000, and the largest rung of the set's reduction — 16 % of the
# full-set 45 %, authored as one row on content/sets/ghost.yml (no per-slot heroic ladder exists).
armor-value: 4
durability: 1000
heroic: true
defense-reduction: 16
heroic-lore:
  - ""
  - "§7+4 Armor Value"
  - "§71000 Durability"
  - "§4This armor is stronger than diamond."
# THE MINT (recorded, no authoring surface): 9 base roster entries rolled nearly maxed, plus the piece's
# probability rolls — the richest of the four.
roll-formula: "min(M, max(1, M - 2) + rand(3))"
roster-size: 9
rolls:
  - "60% Valor"
  - "60% Angelic"
  - "60% Tank"
  - "20% Paladin Armored"
  - "17.5% Godly Overload"
  - "20% Planetary Deathbringer"
  - "20% Divine Enlighted"
  - "15% Vengeful Diminish"
mastery-pool:
  draw: "2 without replacement, 50% each"
  entries: ["Horrify", "Feign Death", "Poltergeist", "Mark of the Beast"]
# Only `enchants/poltergeist` is in this pack today; the other three are batch-07 stops. Ordinary enchant
# books are refused unless the book carries a matching Mastery Shard (support-item rule, §C.9).
