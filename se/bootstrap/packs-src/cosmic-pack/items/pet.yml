# Matrix: 12-pets.md § Family-level facts — the ONE pet likeness (ADR-0052) every one of the 17 heads in
# content/pets/ is minted and re-rendered from. There is no per-pet item file: a pet's colour, display name,
# flavour block and ability body live in its own content file, and this template holds only what the whole
# family shares — the name and the Level/EXP tail.
# Tokens: {COLOR} the pet's colour codes, {NAME} its display, {DESCRIPTOR} its flavour line(s),
# {DESCRIPTION} its ability body (which carries the family's own `§7§f§lAbility` / `§7§f§lCooldown` headers
# and cooldown value line — those are per-pet here, not template text), {LEVEL} / {MAX_LEVEL} / {EXP} /
# {EXP_NEXT} the stored progress, {EXP_BAR} the progress meter, {TIME_FORMATTED} the live bracket's cooldown.
# `{MAX_LEVEL}` is the one supplied token this template deliberately does NOT bind — the source printed a
# pet's cap nowhere, and a `/ {MAX_LEVEL}` on the recorded tail would be an invented line (spec §6 R2). The
# engine default and signature-pack bind it; here the cap shows in the EXP pair instead, which pins full at
# the cap under a solid bar rather than climbing past its own denominator.
# HEAD TEXTURES (R-QC56) — the family reading every pet file cites rather than repeats. All 17 profiles are
# recoverable: the `skinBlob` constructor argument of each enum constant carries the complete base64 blob,
# cross-checked byte-for-byte against the bytecode constant pool and against the codex's decoded profile
# table (12-pets.md:352-369), and each of the 13 shipped pets authors its own `head:` verbatim.
# The blob IS the whole identity. The jar built its GameProfile with `UUID.randomUUID()` and the lower-cased
# enum name, so there is no player-name skull and no stable source UUID to port; the `profileId` inside a blob
# belongs to the skin's AUTHOR (16 of 17 share one), and nothing reads it.
# Two source data bugs travel with the set. `world-destroyer`'s blob is 313 characters ending `===` — one
# padding character past legal base64, which a strict decoder throws on — so its file ships the corrected
# 312-char form; the decoded payload is identical. `alchemist`'s texture hash is 63 hex characters rather than
# 64 and the missing character is in neither source, bytecode nor codex; that pet is on the R-QC54 cut list,
# so nothing here carries it.
# era: a `head:` IS the textured seam — `SKULL_ITEM:3` on 1.8.9 against modern `PLAYER_HEAD` — so both lanes
# now mint a textured player head instead of the untextured data-0 skeleton skull that `PetDefReader`'s
# default `PLAYER_HEAD` token degraded to on the legacy fork.
type: pet

# The name is the source's, verbatim: `§e§lLava Elemental Pet§7 [LVL 1]`. `{COLOR}` is the pet's `&e` and the
# `&l` here is the bold the source's `§e§l` carried, which is why no pet file authors its own bold. `{NAME}`
# holds the FULL source name, "Pet" included, so the template adds no literal text of its own.
name: "{COLOR}&l{NAME}&7 [LVL {LEVEL}]"
# The recorded tail, verbatim, after the flavour block and the ability body:
#   `§7` / `§f§lLevel` / `§7 {level}` / `§7` / `§f§lEXP` / `{bar}` / `§7 ({exp}/{needed})`
# THE BAR IS FIFTY SEGMENTS (R-QC65, closing ledger D-12-2). The jar drew 50 through an integer division that
# rendered it always EMPTY below the cap and overflowing past 50 segments AT it (codex §A.5) — never the
# proportional meter it was written to be. `{EXP_BAR}` is that meter: 50 segments, `§a|` filled and `§c|`
# empty, proportional and clamped full at the cap. The count is not a styling choice — fifty is the jar's own
# number, and only the arithmetic that made it unreadable is corrected.
# `{EXP}` / `{EXP_NEXT}` are comma-grouped (the recorded `#,###.##`), so a 56 250-point curve reads as one.
lore-active:
  - "{DESCRIPTOR}"
  - "{DESCRIPTION}"
  - "§7"
  - "§f§lLevel"
  - "§7 {LEVEL}"
  - "§7"
  - "§f§lEXP"
  - "{EXP_BAR}"
  - "§7 ({EXP}/{EXP_NEXT})"
# All 17 cosmic pets are ACTIVE (the jar's 1 Hz hotbar ticker is a no-op for every one of them, so nothing
# passive is ported). The passive template is the same tail rather than absent, so that a passive pet added
# later renders in THIS family's likeness instead of falling back to the engine's own default block.
lore-passive:
  - "{DESCRIPTOR}"
  - "{DESCRIPTION}"
  - "§7"
  - "§f§lLevel"
  - "§7 {LEVEL}"
  - "§7"
  - "§f§lEXP"
  - "{EXP_BAR}"
  - "§7 ({EXP}/{EXP_NEXT})"
