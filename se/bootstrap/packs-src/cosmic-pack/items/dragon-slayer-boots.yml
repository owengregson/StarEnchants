# Matrix: 10-armor-sets.md § Dragon Slayer — the BOOTS likeness.
# WHY THIS FILE EXISTS: per-piece flavour lore, per-piece enchant rosters and the mint's roll rules have no
# surface on a set def (`armor.lore` / `armor.enchants` are shared by all four pieces; `pieces:` carries
# material + name only). Recorded here until a set-piece surface exists (deferred-content.md); ItemsLoader
# does not yet claim `type: set-piece`.
# IDENTITY: engine PDC set stamp, not the jar's forgeable lore match (infrastructure-class fix).
type: set-piece
set: sets/dragon-slayer
slot: boots
material: DIAMOND_BOOTS
name: "§e§lDragon Slayer Battle Boots§r"   # trailing §r verbatim
lore:
  - "§e§oThe mythical boots of a Slayer of Dragons."
enchants:
  PROTECTION: 5
  UNBREAKING: 3
# THE MINT (recorded, no authoring surface):
#   - heroic-enchant roster gate: 40 % per heroic entry;
#   - boots bonus roll: 7.5 % Phoenix (`enchants/phoenix`);
#   - Guardians (`enchants/guardians`) — LEDGER D-10-7: the jar's boots roster spells it `Gaurdians`, so that
#     entry silently never applies. The typo's intent is unambiguous (codex-flagged), so the port rolls
#     Guardians on the boots as intended.
# Base roster entries roll nearly maxed under the family formula (matrix §A / § Phantom).
rolls:
  - "40% per heroic roster entry"
  - "7.5% Phoenix"
  - "Guardians (D-10-7: measured roster misspells it `Gaurdians` and never applies; ships as intended)"
roll-formula: "min(M, max(1, M - 2) + rand(3))"
