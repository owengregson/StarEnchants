      # authored SOUND rows here would double the launch.
      - { GRAVITY_WELL: { range: 12, radius: 6, rise: 2.5, duration: 60, period: 2, pull: 0.28, damage: 8.0, falloff-floor: 0.25, self-pull: true, self-damage: true, r: 190, g: 120, b: 255 } }
