# skyline aim anchors it mid-air at ray's end); it drags everything nearby inward, then implodes.
# Pulls and hurts the caster too (the authored downside).
display: "The Singularity"
color: "{#be95d4}"
icon: END_CRYSTAL
type: ACTIVE
description:
  - "{#be95d4}* Launch a collapsing star up to twelve blocks in the direction you are facing, pulling in all nearby enemies and dealing implosion damage"
abilities:
