# Spell Grappler — GRAPPLE (ADR-0071). Throw a grappling line along your facing: an enemy in
# sight is reeled in; open terrain zips YOU to it. The hook is a flying dust-line sim (no real
# FishHook exists across the range — ADR-0071 evidence); both rays resolve in GrappleService and
# the closer wins. Open air draws the empty throw and speaks (the whiff cue).
display: "Spell Grappler"
color: "{#6fe4e8}"
icon: SOUL_CAMPFIRE
type: ACTIVE
description:
  - "{#6fe4e8}* Throw a grappling hook up to twelve blocks in the direction you are facing, pulling you towards the open space; any enemies hit by the grappler are pulled in"
abilities:
  - cooldown: 1200
    effects:
      - { SOUND: { sound: "ENTITY_FISHING_BOBBER_THROW", volume: 1.0, pitch: 0.8 } }
      - { SOUND: { sound: "BLOCK_CHAIN_PLACE", volume: 0.6, pitch: 1.4 } }
      - { SOUND: { sound: "ENTITY_ARROW_SHOOT", volume: 0.4, pitch: 0.7 } }
      - { GRAPPLE: { range: 12, hook-speed: 2.0, reel-distance: 2.0, slow-effect: "SLOW", slow-level: 2, slow-duration: 60, zip-strength: 0.34, zip-cap: 3.2, zip-rise: 0.25, particle: REDSTONE, r: 200, g: 220, b: 255, size: 1.0, density: 3 } }
