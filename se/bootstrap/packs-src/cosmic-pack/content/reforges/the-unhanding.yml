cooldown: 400          # 20s
chance: 100
condition: ""
effects:
  - { SOUND: { sound: "ENTITY_SHEEP_SHEAR", volume: 1.0, pitch: 1.3 } }
  - { DISARM_SHUFFLE: { duration: 80, damage-malus: 20, who: "@Self" } }
