# Quantum Blink — BLINK (ADR-0071). Instantly teleport up to five blocks along your facing
# (yaw-only — a grounded look-down must not ray into the floor; single rises read as steps).
# Walls stop it short; a point-blank wall still spends the use (the authored downside). The
# arrival cue plays POST-teleport on the player (they are not at the origin to hear one).
display: "Quantum Blink"
color: "{#62baa2}"
icon: ENDER_PEARL
type: ACTIVE
description:
  - "{#62baa2}* Instantly teleport up to five blocks in the direction you are facing, but does not pass through walls"
abilities:
  - cooldown: 600
    effects:
      - { SOUND: { sound: "ENTITY_ENDERMAN_TELEPORT", volume: 0.7, pitch: 1.6 } }
      - { SOUND: { sound: "BLOCK_AMETHYST_BLOCK_CHIME", volume: 0.5, pitch: 1.2 } }
      - { BLINK: { distance: 5, particle: REDSTONE, r: 98, g: 186, b: 162, size: 1.0, count: 10 } }
