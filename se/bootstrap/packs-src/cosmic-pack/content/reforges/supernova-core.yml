# Supernova Core — BATTERY (ADR-0071). Arm the core; your next 3 landed hits TAKEN each bank 20%
# of their final damage; your next landed hit unloads the whole bank on top of that hit (a
# same-hit rider — one hurt, one immunity window). OWNER-RULED: the next hit discharges whatever
# is banked, even nothing (the core is spent regardless). No time limit; cleared on death.
display: "Supernova Core"
color: "&6"
icon: FIRE_CHARGE
description:
  - "&eArm the core: the next 3 hits you take each"
  - "&echarge it with 20% of their damage."
  - "&eYour next landed hit unloads everything."
  - "&cDischarges on your next hit no matter how"
  - "&cmuch was banked."
cooldown: 900          # 45s
chance: 100
condition: ""
effects:
  - { SOUND: { sound: "ITEM_FIRECHARGE_USE", volume: 0.8, pitch: 0.7 } }
  - { BATTERY: { bank-percent: 20, hits: 3, who: "@Self" } }
