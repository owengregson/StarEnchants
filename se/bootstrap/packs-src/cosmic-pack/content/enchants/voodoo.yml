# Matrix: 02-enchants-armor-m-z.md § Voodoo
display: "Voodoo"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA melee hit can leave"
  - "&eyour attacker weakened."
trigger: DEFENSE
applies-to: [ARMOR]
group: "rare"
tier: rare
condition: '%damagecause% == "ENTITY_ATTACK"'
# Non-stacking; the potion is not forced, so a stronger existing Weakness shadows it (potion-priority rule).
# Durations are the original's truncated (int)(1.5 x level) seconds plus a 25-tick tail — the quarter-second
# ends and the uneven +1s/+2s steps are the real values, shipped as measured.
# Weakness I through L3, II from L4 (POTION level is 1-based: level 1 = the I tier).
# era: SPELL_MOB is the 1.8 EnumParticle constant (MOB_SPELL is the jar's name). The matrix records the swirl at the
# attacker's eye height; the engine centres an entity-targeted particle on the body.
