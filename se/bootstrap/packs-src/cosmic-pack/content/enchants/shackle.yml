# Cosmic codex source: 03-enchants-swords.md — weapons/Shackle.java
display: Shackle
description: One tick after a hit, zeroes knockback on eligible mobs spawned from a mob spawner; Blaze requires II and Magma Cube requires III.
trigger: [ATTACK, BOW]
applies-to: [SWORD, AXE, BOW]
group: elite
tier: elite
stacking: HIGHEST
levels:
  1: { condition: '%victim.frommobspawner% && %victim.type% != "BLAZE" && %victim.type% != "MAGMA_CUBE"', effects: &stop [{ WAIT: 1 }, { VELOCITY: { mode: set, x: 0, y: 0, z: 0, who: '@Victim' } }] }
  2: { condition: '%victim.frommobspawner% && %victim.type% != "MAGMA_CUBE"', effects: *stop }
  3: { condition: '%victim.frommobspawner%', effects: *stop }
