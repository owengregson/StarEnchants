# Matrix: 01-enchants-armor-a-l.md § Heavy
display: "Heavy"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eReduces damage taken from"
  - "&eenemies holding a bow."
trigger: DEFENSE
applies-to: [ARMOR]
group: "epic"
tier: epic
# The bow check reads the attacker's held item at damage resolution, so a swap mid-flight evades it (verbatim).
# Each level's %damage% floor is 1 / (1 - reduction) — the measured skip-below-1.0 guard, as Armored.
# Per-piece stacking is granted by the original's whitelist and lives in the interaction layer: four L5 pieces
# compound 0.90^4 = 34.39% total bow reduction, above Armored's despite the lower tier (verbatim).
# era: emerald blocks exist on 1.8.9 (1.3+); the stone-break cue maps to the legacy `dig.stone` family as Armored.
levels:
  1:
    condition: '%victim.helditem% == "BOW" && %damage% > 1.0204'
    effects:
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "EMERALD_BLOCK", count: 8, who: "@Self" } }
      - { SOUND: { sound: "BLOCK_STONE_BREAK", volume: 1, pitch: 1 } }
      - { DAMAGE_MOD: { side: "defense", mode: "add", amount: 2 } }
