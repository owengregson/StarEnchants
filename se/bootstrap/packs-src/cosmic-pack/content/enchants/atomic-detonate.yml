# Matrix: 06-enchants-tools-heroic.md § Atomic Detonate
display: "Atomic Detonate"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eThe heroic grade of Detonate: no roll, no"
  - "&eslab — a whole cube of wall goes at once."
trigger: MINE
# The 21-material `tools` set, exactly as the counterpart carries it (the item-set ruling's canonical
# spelling: the four TOOL families plus the fishing rod the composite would drop).
applies-to: [TOOL, FISHING_ROD]
group: "heroic"
tier: heroic
# THE HEROIC APPLICATION CONTRACT (matrix 06 § Heroic application rules) — the full reading lives in
# reinforced-tank.yml. `requires:` is the APPLY-GATE, `removes-required:` is REPLACE + SLOT-EXEMPT; the gate
# settles for `partner >= the heroic level applied` rather than the partner's MAX (never exact here —
# Detonate runs to IX and this grade stops at IV, so Atomic Detonate IV demands Detonate IV, not Detonate
# IX), and REVERSE-BLOCK is unexpressible (`blacklist:` is checked bidirectionally and would veto the very
# apply `requires:` demands). Tier 7 = the `heroic` rung (&d, weight 70); table weight 6 is a book-roll
# number the surface does not carry, and END-SUPPRESS is the tier world rule. Max 4; base 10.0,
# interval 10.0. The jar's separate face cache per grade is moot — the engine orients from the mined face.
requires: ["enchants/detonate"]
removes-required: true
# Origin-block deny as Detonate: mining a comparator or a sponge runs no explosion at all, and `contains`
# spans the 1.8 REDSTONE_COMPARATOR_ON / _OFF split and the flattened COMPARATOR in one clause.
condition: "%block.type% != \"SPONGE\" && !(%block.type% contains \"COMPARATOR\")"
# ALL FOUR RUNGS CARRY THEIR RECORDED CUBE (R-QC5). The cube is a face-oriented box with ASYMMETRIC
# half-extents — L1 `(1,2,1,2)` is a 4x4 cross-section and L3 `(2,3,2,3)` a 6x6 — and a `-half..+half` loop
# spans an ODD number of blocks at any half value, so `half-width`/`half-height` alone reach 3x3, 5x5 and 7x7
# and nothing else. L2 `(2,2,2,2)` and L4 `(3,3,3,3)` are those odd sections and stay on the half params
# (5x5x5 = 125 and 7x7x7 = 343, block for block); L1 and L3 author `@Bore`'s per-side `left/right/up/down`
# extents (wave 2d), the only spelling of an even cross-section — 4x4x4 = 64 and 6x6x6 = 216, the recorded
# volumes exactly. A per-side extent overrides its axis's `half-*`, so the two params are not authored
# together on those rungs.
# THE PER-BLOCK DENY LIST is the jar's 21-entry blacklist — Detonate's 22 minus its duplicated BEDROCK —
# and it is authored identically to `detonate.yml`, including the era fallback chains (`1.8|modern`; the
# compiler takes the first name that exists on the running version) and the same three dead 1.8 ITEM ids
# dropped for cause (SIGN, WOOD_DOOR, REDSTONE_COMPARATOR). The reading lives in `detonate.yml`; it is
# repeated here rather than shared because a selector body is a literal.
# THE VOID-DROPS LIST (R-QC7). Seven bulk materials are destroyed WITHOUT drops inside the cube while
# everything else drops normally — `BREAK_BLOCK.void-materials` (wave 2d) is that per-block exception to
# `drops`, so a 343-block blast no longer buries the miner in cobble. The jar voided them only when they did
# NOT sell, and Auto Sell is out by owner ruling R9, so the unsellable arm is the only one that ever runs and
# the list is unconditional here. `GRASS_BLOCK|GRASS` is written modern-first, against this file's usual
# `1.8|modern` order: 1.8's `GRASS` IS the grass block, but the modern `GRASS` is the plant (aliased to
# SHORT_GRASS), so a 1.8-first chain would void tall grass on every modern server.
# THE IN-VOLUME SMELT (R-QC10). `BREAK_BLOCK.smelt` is the excavation twin of the MINE-scoped `SMELT`
# read-back, which only ever addresses the one block a MINE event names and so could never reach a block the
# sink breaks itself. The jar's rule is a CO-ENCHANT one — iron/gold ore inside the blast becomes ingots only
# when the tool carries Auto Smelt AND Fuse, at `setAmount(autoSmeltLevel)` — and the param is a number, so
# the whole rule is one authored product: `min(1, %actor.enchlevel.fuse%) * %actor.enchlevel.auto-smelt%`
# reads 0 without Fuse (max 1, hence the `min` is belt-and-braces) and the Auto Smelt level with it. That is
# what finally makes `fuse.yml` mean something on an item. `smelt-materials` holds the gate to the jar's two
# ores, widened to their post-flattening variants under the standing era rule R-QC22b — without it the
# engine's shared smelt table would also turn blasted sand into glass, which the jar never did.
# THE TOOL-CLASS SUBLISTS (R-QC10) are authored here, and ONLY here. The jar gated 15 materials (stone,
# ores, spawners, netherrack…) to a pickaxe and 6 (dirt, sand, gravel, grass, mycelium, clay) to a spade,
# and the EXPLOSIVES EXPERT mastery lifted BOTH so either tool broke either class. Four mutually exclusive
# arms carry it, because a selector body is a literal and the list a rung needs depends on what the miner is
# holding: expert (neither sublist), pickaxe (spade list denied), spade (pickaxe list denied), and anything
# else in the 21-tool set — axe, hoe, fishing rod — which breaks neither class. The gate reads
# `%actor.enchlevel.explosives-expert%` and NOT the matrix's `%mastery.explosives-expert%` var spelling:
# nothing writes that var with the marker effect-less, and an unknown key reads 0 in silence, so a stale
# spelling would compile and gate nothing forever. `_SPADE` is joined by `_SHOVEL` because the material was
# renamed at the flattening and the jar's name test only knew the 1.8 spelling.
# The ORIGIN-BLOCK deny is repeated on every arm: an ability-level `condition:` REPLACES the file-level one
# rather than being ANDed with it, so the top-level line above is the default for a future ability and the
# arms below have to restate it. Plain Detonate keeps ignoring the flag AND the sublists (measured for the
# flag; the sublists are a recorded widening on that grade, see `detonate.yml` — its nine rungs would take
# 36 arms for a rider the deny list already keeps out of grief range).
# The Y floor (`y > 0`) is the world's own; the jar's `y > 200` ceiling clause is unreachable with a 7-block
# span and is not ported. Telepathy's in-volume routing, the Factions and war-zone hooks
# and spawner bookkeeping are all as Detonate records them. D-06-10 (Auto Sell dropping the `x amount`) is
# retired by R9; D-06-11 is the same origin re-process D-06-3 names, which the engine's break path does not
# do; D-06-2's null cached face cannot happen when the face IS the activation.
# strings: none.
# era: as Detonate — the deny list's 1.8 spellings ride the fallback chains, and `EXPLOSION_LARGE` is the
# 1.8-era name of the jar's `LARGE_EXPLODE`, renamed again at 1.20.5 and carried both ways by
# `Aliases.PARTICLE`.
levels:
  # No roll at any rung: the cube is always full size (the counterpart's depth lottery is exactly what the
  # heroic grade buys out). Depth is `min(9, 3 + level)` = 4 / 5 / 6 / 7, and `@Bore`'s `depth` counts the
  # activation block's own layer, so the four rungs are 4 / 5 / 6 / 7 layers deep.
  # One EXPLOSION_LARGE burst and one durability point per explosion, the counterpart's reading verbatim
  # (per-block particles have no spelling; the pickaxe-only and dropless-block gates on the charge are not
  # ported). The four tool-class arms below all carry the SAME cube for their rung — only the deny list
  # differs, so a rung's volume never changes with the tool, exactly as the jar's per-block guard worked.
  1:
    abilities:
      # EXPERT — the mastery lifts BOTH sublists: every tool breaks everything the deny list allows.
      - condition: "%block.type% != \"SPONGE\" && !(%block.type% contains \"COMPARATOR\") && %actor.enchlevel.explosives-expert% > 0"
        effects:
          - { BREAK_BLOCK: { drops: true, void-materials: "COBBLESTONE,STONE,GRAVEL,DIRT,GRASS_BLOCK|GRASS,SANDSTONE,NETHERRACK", smelt: "min(1, %actor.enchlevel.fuse%) * %actor.enchlevel.auto-smelt%", smelt-materials: "IRON_ORE,DEEPSLATE_IRON_ORE|IRON_ORE,GOLD_ORE,DEEPSLATE_GOLD_ORE|GOLD_ORE,NETHER_GOLD_ORE|GOLD_ORE", who: "@Bore{left=1, right=2, up=1, down=2, depth=4, exclude-materials=[LADDER,GLOWSTONE,BEDROCK,WATER,STATIONARY_WATER|WATER,LAVA,STATIONARY_LAVA|LAVA,SIGN_POST|OAK_SIGN,AIR,OBSIDIAN,SPONGE,IRON_DOOR_BLOCK|IRON_DOOR,WOODEN_DOOR|OAK_DOOR,HOPPER,ANVIL,REDSTONE_COMPARATOR_OFF|COMPARATOR,REDSTONE_COMPARATOR_ON|COMPARATOR]}" } }
      # PICKAXE held — spade ground is spared.
      - condition: "%block.type% != \"SPONGE\" && !(%block.type% contains \"COMPARATOR\") && %actor.enchlevel.explosives-expert% == 0 && %actor.helditem% contains \"_PICKAXE\""
        effects:
          - { BREAK_BLOCK: { drops: true, void-materials: "COBBLESTONE,STONE,GRAVEL,DIRT,GRASS_BLOCK|GRASS,SANDSTONE,NETHERRACK", smelt: "min(1, %actor.enchlevel.fuse%) * %actor.enchlevel.auto-smelt%", smelt-materials: "IRON_ORE,DEEPSLATE_IRON_ORE|IRON_ORE,GOLD_ORE,DEEPSLATE_GOLD_ORE|GOLD_ORE,NETHER_GOLD_ORE|GOLD_ORE", who: "@Bore{left=1, right=2, up=1, down=2, depth=4, exclude-materials=[LADDER,GLOWSTONE,BEDROCK,WATER,STATIONARY_WATER|WATER,LAVA,STATIONARY_LAVA|LAVA,SIGN_POST|OAK_SIGN,AIR,OBSIDIAN,SPONGE,IRON_DOOR_BLOCK|IRON_DOOR,WOODEN_DOOR|OAK_DOOR,HOPPER,ANVIL,REDSTONE_COMPARATOR_OFF|COMPARATOR,REDSTONE_COMPARATOR_ON|COMPARATOR,DIRT,SAND,RED_SAND|SAND,GRAVEL,GRASS_BLOCK|GRASS,MYCEL|MYCELIUM,CLAY]}" } }
      # SPADE held — pickaxe ground is spared.
      - condition: "%block.type% != \"SPONGE\" && !(%block.type% contains \"COMPARATOR\") && %actor.enchlevel.explosives-expert% == 0 && (%actor.helditem% contains \"_SPADE\" || %actor.helditem% contains \"_SHOVEL\")"
        effects:
          - { BREAK_BLOCK: { drops: true, void-materials: "COBBLESTONE,STONE,GRAVEL,DIRT,GRASS_BLOCK|GRASS,SANDSTONE,NETHERRACK", smelt: "min(1, %actor.enchlevel.fuse%) * %actor.enchlevel.auto-smelt%", smelt-materials: "IRON_ORE,DEEPSLATE_IRON_ORE|IRON_ORE,GOLD_ORE,DEEPSLATE_GOLD_ORE|GOLD_ORE,NETHER_GOLD_ORE|GOLD_ORE", who: "@Bore{left=1, right=2, up=1, down=2, depth=4, exclude-materials=[LADDER,GLOWSTONE,BEDROCK,WATER,STATIONARY_WATER|WATER,LAVA,STATIONARY_LAVA|LAVA,SIGN_POST|OAK_SIGN,AIR,OBSIDIAN,SPONGE,IRON_DOOR_BLOCK|IRON_DOOR,WOODEN_DOOR|OAK_DOOR,HOPPER,ANVIL,REDSTONE_COMPARATOR_OFF|COMPARATOR,REDSTONE_COMPARATOR_ON|COMPARATOR,SANDSTONE,STONE,COBBLESTONE,MOSSY_COBBLESTONE,SMOOTH_BRICK|STONE_BRICKS,OBSIDIAN,MOB_SPAWNER|SPAWNER,COAL_ORE,DEEPSLATE_COAL_ORE|COAL_ORE,IRON_ORE,DEEPSLATE_IRON_ORE|IRON_ORE,GOLD_ORE,DEEPSLATE_GOLD_ORE|GOLD_ORE,NETHER_GOLD_ORE|GOLD_ORE,DIAMOND_ORE,DEEPSLATE_DIAMOND_ORE|DIAMOND_ORE,LAPIS_ORE,DEEPSLATE_LAPIS_ORE|LAPIS_ORE,REDSTONE_ORE,DEEPSLATE_REDSTONE_ORE|REDSTONE_ORE,EMERALD_ORE,DEEPSLATE_EMERALD_ORE|EMERALD_ORE,NETHERRACK]}" } }
      # AXE / HOE / ROD — neither class breaks; only the ungated middle goes.
      - condition: "%block.type% != \"SPONGE\" && !(%block.type% contains \"COMPARATOR\") && %actor.enchlevel.explosives-expert% == 0 && !(%actor.helditem% contains \"_PICKAXE\") && !(%actor.helditem% contains \"_SPADE\") && !(%actor.helditem% contains \"_SHOVEL\")"
        effects:
          - { BREAK_BLOCK: { drops: true, void-materials: "COBBLESTONE,STONE,GRAVEL,DIRT,GRASS_BLOCK|GRASS,SANDSTONE,NETHERRACK", smelt: "min(1, %actor.enchlevel.fuse%) * %actor.enchlevel.auto-smelt%", smelt-materials: "IRON_ORE,DEEPSLATE_IRON_ORE|IRON_ORE,GOLD_ORE,DEEPSLATE_GOLD_ORE|GOLD_ORE,NETHER_GOLD_ORE|GOLD_ORE", who: "@Bore{left=1, right=2, up=1, down=2, depth=4, exclude-materials=[LADDER,GLOWSTONE,BEDROCK,WATER,STATIONARY_WATER|WATER,LAVA,STATIONARY_LAVA|LAVA,SIGN_POST|OAK_SIGN,AIR,OBSIDIAN,SPONGE,IRON_DOOR_BLOCK|IRON_DOOR,WOODEN_DOOR|OAK_DOOR,HOPPER,ANVIL,REDSTONE_COMPARATOR_OFF|COMPARATOR,REDSTONE_COMPARATOR_ON|COMPARATOR,SANDSTONE,STONE,COBBLESTONE,MOSSY_COBBLESTONE,SMOOTH_BRICK|STONE_BRICKS,OBSIDIAN,MOB_SPAWNER|SPAWNER,COAL_ORE,DEEPSLATE_COAL_ORE|COAL_ORE,IRON_ORE,DEEPSLATE_IRON_ORE|IRON_ORE,GOLD_ORE,DEEPSLATE_GOLD_ORE|GOLD_ORE,NETHER_GOLD_ORE|GOLD_ORE,DIAMOND_ORE,DEEPSLATE_DIAMOND_ORE|DIAMOND_ORE,LAPIS_ORE,DEEPSLATE_LAPIS_ORE|LAPIS_ORE,REDSTONE_ORE,DEEPSLATE_REDSTONE_ORE|REDSTONE_ORE,EMERALD_ORE,DEEPSLATE_EMERALD_ORE|EMERALD_ORE,NETHERRACK,DIRT,SAND,RED_SAND|SAND,GRAVEL,GRASS_BLOCK|GRASS,MYCEL|MYCELIUM,CLAY]}" } }
      # The burst and the durability point are ONCE PER EXPLOSION and tool-blind, so they ride
      # their own ability rather than being copied into all four arms (which would fire the
      # cue four times where the jar fired it once).
      - condition: "%block.type% != \"SPONGE\" && !(%block.type% contains \"COMPARATOR\")"
        effects:
          - { PARTICLE: { particle: "EXPLOSION_LARGE", count: 1 } }
          - { DURABILITY: { amount: 1, mode: "damage", target: "item" } }
  2:
    abilities:
      # EXPERT — the mastery lifts BOTH sublists: every tool breaks everything the deny list allows.
      - condition: "%block.type% != \"SPONGE\" && !(%block.type% contains \"COMPARATOR\") && %actor.enchlevel.explosives-expert% > 0"
