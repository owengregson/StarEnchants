# Imported from EliteEnchantments (id: furious-enrage). Review before shipping.
display: "Furious Enrage"
description:
  - "&eMythic upgrade for Enrage."
  - "&eDeals more bonus damage as your"
  - "&ehealth drops."
  - "&c&l(!)&r &7Requires &eEnrage"
trigger: ATTACK
applies-to: [SWORD]
group: "mythic"
tier: mythic
requires: ["enchants/enrage"]
removes-required: true  # the mythic upgrade supersedes its base counterpart (net-zero enchant slots)
levels:
  1:
    condition: "%actor.health% < 10"
    effects:
      - { SOUND: { sound: "ENTITY_RAVAGER_ROAR", volume: 0.9, pitch: 1.5 } }
      - { PARTICLE: { particle: "VILLAGER_ANGRY", count: 12, who: "@Self" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "(20 - %actor.health%) * 2" } }  # from DAMAGE_INCREASE:playerHealth*2.5 — EE equation → flat bonus per missing HP
  2:
    condition: "%actor.health% < 10"
    effects:
      - { SOUND: { sound: "ENTITY_RAVAGER_ROAR", volume: 0.9, pitch: 1.5 } }
      - { PARTICLE: { particle: "VILLAGER_ANGRY", count: 12, who: "@Self" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "(20 - %actor.health%) * 2.5" } }  # from DAMAGE_INCREASE:playerHealth*2.5 — EE equation → flat bonus per missing HP
  3:
    condition: "%actor.health% < 10"
    effects:
      - { SOUND: { sound: "ENTITY_RAVAGER_ROAR", volume: 0.9, pitch: 1.5 } }
      - { PARTICLE: { particle: "VILLAGER_ANGRY", count: 12, who: "@Self" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "(20 - %actor.health%) * 3" } }  # from DAMAGE_INCREASE:playerHealth*3 — EE equation → flat bonus per missing HP
