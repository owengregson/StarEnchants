    chance: 4.5
    cooldown: 100
    condition: "%actor.health% < 10"
    effects:
      - { SOUND: { sound: "ENTITY_RAVAGER_ROAR", volume: 0.9, pitch: 1.5 } }
      - { PARTICLE: { particle: "VILLAGER_ANGRY", count: 12, who: "@Self" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "(%actor.health%*2.5 - 1) * 100" } }  # from DAMAGE_INCREASE:playerHealth*2.5 — EE DAMAGE_INCREASE equation → expression-valued DAMAGE_MOD percent ((expr - 1) * 100)
