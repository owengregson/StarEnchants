# Imported from EliteEnchantments (id: furious-enrage). Review before shipping.
display: "Furious Enrage"
description:
  - "&eMythic upgrade for Enrage."
  - "&eDeals more bonus damage as your"
  - "&ehealth drops."
  - "&c&l(!)&r &7Requires &eEnrage"
trigger: ATTACK
applies-to: [SWORD]
group: "mythic"
tier: mythic
requires: ["enchants/enrage"]
removes-required: true  # the mythic upgrade supersedes its base counterpart (net-zero enchant slots)
levels:
  1:
    condition: "%actor.healthpercent% < 50"
    effects:
      - { SOUND: { sound: "ENTITY_RAVAGER_ROAR", volume: 0.9, pitch: 1.5 } }
      - { PARTICLE: { particle: "VILLAGER_ANGRY", count: 12, who: "@Self" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "(100 - %actor.healthpercent%) * 0.6" } }  # flat bonus per % of missing health (at 20% health: +48)
  2:
    condition: "%actor.healthpercent% < 50"
    effects:
      - { SOUND: { sound: "ENTITY_RAVAGER_ROAR", volume: 0.9, pitch: 1.5 } }
      - { PARTICLE: { particle: "VILLAGER_ANGRY", count: 12, who: "@Self" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "(100 - %actor.healthpercent%) * 0.75" } }  # flat bonus per % of missing health (at 20% health: +60)
  3:
    condition: "%actor.healthpercent% < 50"
    effects:
      - { SOUND: { sound: "ENTITY_RAVAGER_ROAR", volume: 0.9, pitch: 1.5 } }
      - { PARTICLE: { particle: "VILLAGER_ANGRY", count: 12, who: "@Self" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "(100 - %actor.healthpercent%) * 0.9" } }  # flat bonus per % of missing health (at 20% health: +72)
