# Matrix: 02-enchants-armor-m-z.md § Plague Carrier
display: "Plague Carrier"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA killing blow finishes you off and leaves a plague:"
  - "&epoison for everyone near, and charged creepers to carry it."
trigger: DEFENSE
applies-to: [ARMOR]
group: "uncommon"
tier: uncommon
# The hostile-players-only payload is the filter conjunction smoke-bomb.yml already ships for the same
# FILTER_COMPOSE note: ENEMIES+PLAYERS keeps only what BOTH admit.
# The recorded 200 t re-arm is NOT authored, for two reasons that both hold: the wearer is deliberately
# finished off on every proc (the KILL below is unconditional), so a re-arm window can never be reached; and
# a cooldown here would gate the CREEPER PAYLOAD too — every ability of one enchant shares one cooldown
# bucket (EnchantDefReader: "one cooldown scope"), and a zero-cooldown block still RESPECTS a bucket a
# sibling armed, so the detonations inside those 10 s would all be swallowed.
# THE DEAD-OWNER SEAM IS CLOSED (R-QC57). A summon payload used to run the OWNER's abilities out of their
# LIVE WornState, and this wearer is dead before the first creeper reaches anyone: death drops the armour,
# the armour-change feeder (modern) / gear poll (1.8) refreshes off that drop and respawn refreshes again, so
# by the time a creeper went off its owner carried no Plague Carrier, the payload resolved nothing, and the
# phase had already cancelled the vanilla blast — a dud. The payload's ability ids are now PINNED onto each
# creeper at spawn and run through the engine's cold detached path, so the burst is the one the wearer armed
# with the gear they died in. Same fix serves self-destruct.yml.
# Interactions carried by the OTHER side, nothing authored here: the death burst respects relations
# (truce+ skipped) while the creeper payload hits everyone including allies — the jar's measured asymmetry,
# left for the relation layer to keep or normalise (payload-filter: ALL below is that half). Summons drop no
# loot and give no XP (engine summon rule), and the engine's 50-per-chunk summon cap applies.
# era: a charged creeper is 1.8-safe; CREEPER_HISS is the 1.8 sound id, authored as its modern spelling
# ENTITY_CREEPER_PRIMED — that alias row has LANDED in `Aliases.SOUND`, verified against both era constant
# lists, so the burst plays on the legacy lane. EXPLODE carries its sound row (ENTITY_GENERIC_EXPLODE);
# `EXPLOSION_LARGE` is the 1.8 EnumParticle constant and the table maps it forward to the modern EXPLOSION.
# CLOUD resolves on both eras.
levels:
  # Radius round(1.5 x level) = 2/3/5/6/8/9/11/12 and creepers radius/2 (integer) = 1/1/2/3/4/4/5/6.
  # Death burst: Poison for (2 + level) x 20 t, I until L7 and II from there.
  # Payload: (level x 2) x 20 t at amplifier 0/0/0/1/1/1/1/2 — POTION `level` is 1-based, so those are
  # levels 1/1/1/2/2/2/2/3 — with Blindness from L3, Weakness from L6 and Slowness only at L8.
  1:
    abilities:
      - condition: "%damage% >= %actor.health%"
        effects:
          - { MESSAGE: { text: "§d§l(!) §d{ATTACKER} has died, and was a Plague Carrier! RUN!", who: "@Aoe{r=2, filter=ENEMIES+PLAYERS}" } }
          - { POTION: { effect: "POISON", level: 1, duration: 60, who: "@Aoe{r=2, filter=ENEMIES+PLAYERS}" } }
          # owner: activator is what makes the payload runnable at all — the owner is who runs it. The
          # creepers keep their AI and their own fuse; the phase only replaces what the blast DOES.
          - { SPAWN_ENTITY: { type: "CREEPER", count: 1, powered: true, owner: "activator", name: "§dPlague Carrier", payload-phase: "detonate", payload-radius: 2.5, payload-height: 2, payload-filter: "ALL", who: "@Self" } }
          - { SOUND: { sound: "ENTITY_CREEPER_PRIMED", volume: 2.0, pitch: 0.75 } }  # ADR-0066 plays one sound id at most once per event, so the recorded per-victim copy (volume 1.6) collapses into this one
          - { PARTICLE: { particle: "CLOUD", count: 75, who: "@Self" } }
          - { PARTICLE: { particle: "CLOUD", count: 20, who: "@Self" } }  # the per-spawn burst: every creeper spawns at this one point and the engine has no per-summon cue hook, so one copy stands for all of them
          # Authored LAST: the wearer is deliberately finished off (the incoming hit is NOT cancelled), and a
          # dead actor is a poor host for the lines and bursts above.
          - { KILL: { who: "@Self" } }
      - trigger: SUMMON_PAYLOAD
        # One activation per entity in the box, actor = the wearer, victim = that entity, anchored at the
        # creeper — so @Victim is who the blast caught and the cues below sit at the blast.
        effects:
          - { POTION: { effect: "POISON", level: 1, duration: 40, who: "@Victim" } }
          - { SOUND: { sound: "ENTITY_GENERIC_EXPLODE" } }
          - { PARTICLE: { particle: "EXPLOSION_LARGE", count: 3 } }
