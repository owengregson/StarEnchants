# Matrix: 03-enchants-swords.md § Block
display: "Block"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eWhile you are blocking, a chance to shrug"
  - "&eoff part of an incoming hit."
trigger: DEFENSE
applies-to: [SWORD]
group: "epic"
