condition: "%blocking%"
# D-03-1 (as-intended): the jar's `0.5 * (L / 2)` reduction is INTEGER division, so L1 reduced nothing at all
# and L2/L3 both landed on 50 %; the real-division reading `0.5 * (L / 2.0)` ships instead — 25/50/75 %.
# Defensive double-fire member (00 §3.4): the values below are the SINGLE-PASS intent per D-001, never the
# doubled measurement. The reduction is a defense-side fold contribution, so vanilla's own blocking reduction
# still applies after it, as measured. Chance 10/20/30 % (L3 measured 0.30000000000000004).
# era: right-click sword blocking is a 1.8-era mechanic — on modern Paper %blocking% resolves to a raised
# shield, which is the same fact on the modern lane. ITEM_BREAK (legacy) <-> ENTITY_ITEM_BREAK via the
# boot-time sound resolver.
