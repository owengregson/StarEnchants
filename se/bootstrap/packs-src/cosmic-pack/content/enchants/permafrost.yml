# Imported from EliteEnchantments (id: permafrost). Review before shipping.
display: "PermaFrost"
description:
  - "&eFreezes the ground under attackers;"
  - "&ewhile you stand on the frost you take"
  - "&eless damage."
trigger: DEFENSE
applies-to: [BOOTS]
group: "godly"
tier: godly
# Standing on ice/snow forces the proc (guaranteed reduction on the frost); off it, the normal chance roll applies.
condition: "(%actor.groundblock% contains \"ICE\" || %actor.groundblock% contains \"SNOW\") : %force%"
levels:
  1:
    chance: 1.5
    cooldown: 40
    effects:
      - { SOUND: { sound: "BLOCK_GLASS_BREAK", volume: 0.9, pitch: 1.5 } }
      - { PARTICLE: { particle: "SNOWFLAKE", count: 16 } }
      - { WALKER: { material: "PACKED_ICE", ticks: 400, radius: 3, who: "@Attacker" } }  # from FROST — EE FROST → WALKER:PACKED_ICE + SLOWNESS/MINING_FATIGUE/NAUSEA IV on the foe
      - { POTION: { effect: "SLOWNESS", level: 4, duration: 60, who: "@Attacker" } }  # from FROST — EE FROST → WALKER:PACKED_ICE + SLOWNESS/MINING_FATIGUE/NAUSEA IV on the foe
      - { POTION: { effect: "MINING_FATIGUE", level: 4, duration: 60, who: "@Attacker" } }  # from FROST — EE FROST → WALKER:PACKED_ICE + SLOWNESS/MINING_FATIGUE/NAUSEA IV on the foe
      - { POTION: { effect: "NAUSEA", level: 4, duration: 60, who: "@Attacker" } }  # from FROST — EE FROST → WALKER:PACKED_ICE + SLOWNESS/MINING_FATIGUE/NAUSEA IV on the foe
      - { DAMAGE_MOD: { side: "defense", mode: "add", amount: 15 } }
