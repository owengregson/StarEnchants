# Imported from EliteEnchantments (id: permafrost). Review before shipping.
display: "PermaFrost"
description:
  - "&eFreezes the ground under attackers;"
  - "&ewhile you stand on the frost you take"
  - "&eless damage."
trigger: DEFENSE
applies-to: [BOOTS]
group: "godly"
tier: godly
# Standing on ice/snow forces the proc (guaranteed reduction on the frost); off it, the normal chance roll applies.
condition: "(%actor.groundblock% contains \"ICE\" || %actor.groundblock% contains \"SNOW\") : %force%"
levels:
  1:
    chance: 4
    cooldown: 240
    effects:
      - { SOUND: { sound: "BLOCK_GLASS_BREAK", volume: 0.9, pitch: 1.5 } }
      - { PARTICLE: { particle: "SNOWFLAKE", count: 16, who: "@Attacker" } }
      - { TEMP_BLOCK: { shape: FOOTPRINT, material: "ICE", material2: "BLUE_ICE", material3: "PACKED_ICE", material4: "SNOW_BLOCK", palette-scale: 2, radius: 3, dy: -1, ticks: 400, airOnly: false, who: "@Attacker" } }  # from FROST — EE FROST → mixed-palette frost floor (solid ground only) + SLOWNESS/MINING_FATIGUE/NAUSEA IV on the foe
      - { POTION: { effect: "SLOWNESS", level: 4, duration: 60, who: "@Attacker" } }  # from FROST — EE FROST → mixed-palette frost floor + SLOWNESS/MINING_FATIGUE/NAUSEA IV on the foe
      - { POTION: { effect: "MINING_FATIGUE", level: 4, duration: 60, who: "@Attacker" } }  # from FROST — EE FROST → mixed-palette frost floor + SLOWNESS/MINING_FATIGUE/NAUSEA IV on the foe
      - { POTION: { effect: "NAUSEA", level: 4, duration: 60, who: "@Attacker" } }  # from FROST — EE FROST → mixed-palette frost floor + SLOWNESS/MINING_FATIGUE/NAUSEA IV on the foe
      - { DAMAGE_MOD: { side: "defense", mode: "add", amount: 15 } }
