# Matrix: 04-enchants-axes.md § Anti Gank
display: "Anti Gank"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eThe more people pile onto you, the harder"
  - "&eyour axe swings back."
trigger: ATTACK
applies-to: [AXE]
group: "legendary"
tier: legendary
# %recentattackers% counts distinct attackers on the ACTOR inside the engine's rolling 200 t gank window
# (CombatDispatch feeds the attack side from the same store Aegis reads on defence). The gate is `6 - level`,
# so L1 needs 5 of them and L4 only 2. No roll: 100 % once gated.
# D-04-2 (as-intended): a clean rolling unique-attacker window. The jar carried two lapse bugs — the offence
# expiry branch returned before granting, so the first hit after a lapse paid nothing, and the defence expiry
# wiped the set without refreshing its stamp, starving the count until an offensive hit re-armed it. The
# engine store has neither: one window, evicted lazily on every read.
# The bonus is a function of the SET SIZE, not the level — +10 pp per distinct attacker, capped at +50 %
# (2 → ×1.2, 3 → ×1.3, 4 → ×1.4, 5+ → ×1.5). The matrix's EXPR_FUNCS gap block is a batch-1 snapshot and is
# stale: min() shipped in wave 1e, so the ceiling is authored here rather than deferred (the same idiom
# rage.yml's `min(…, 150)` folds already use).
# D-04-1: the jar composed same-swing multipliers multiplicatively, the engine damage fold is additive.
# Divergence needs two multipliers on one swing, which is rare across the axe pool and accepted.
# The recent-attacker store is shared engine state with the gank armour family (Aegis, %attackerindex%).
# No suppression rules.
# era: BLOCK_CRACK and PUMPKIN both resolve on 1.8.9 — no hazard, no new alias row.
levels:
  1:
    condition: "%recentattackers% >= 5"
    effects:
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "min(50, %recentattackers% * 10)" } }
      # count=8 is port-chosen: the jar played world effect 2001 (block-break, block id 86 = PUMPKIN) at the
      # victim's head, and a world effect carries no particle count to copy.
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "PUMPKIN", count: 8, who: "@Victim" } }
  2:
    condition: "%recentattackers% >= 4"
    effects:
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "min(50, %recentattackers% * 10)" } }
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "PUMPKIN", count: 8, who: "@Victim" } }
  3:
    condition: "%recentattackers% >= 3"
    effects:
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "min(50, %recentattackers% * 10)" } }
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "PUMPKIN", count: 8, who: "@Victim" } }
  4:
    condition: "%recentattackers% >= 2"
    effects:
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "min(50, %recentattackers% * 10)" } }
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "PUMPKIN", count: 8, who: "@Victim" } }
