# Matrix: 01-enchants-armor-a-l.md § Diminish
display: "Diminish"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA chance to cap your next incoming hit at the damage of the hit that armed it."
trigger: DEFENSE
applies-to: [CHESTPLATE]
group: "legendary"
tier: legendary
condition: "%damage% > 0"
# D-01-07: the charge is bounded by the DAMAGE_CAP window (100t default) and caps the next hit at exactly the
# stored value, replacing the measured never-expiring charge and its armour-re-reduced over-delivery.
# The arming line is DAMAGE_CAP's own `feedback`, not a separate MESSAGE: the primitive fills `{damage}` with
# the cap value it just committed, which is the token the matrix string already carries. MESSAGE fills only
# {ATTACKER}/{VICTIM}, so the same string there rendered `{damage}` literally. Heroic Vengeful Diminish rides
# the identical shape.
levels:
  1:
    chance: 1.5
    effects:
      - { DAMAGE_CAP: { factor: 1.0, reflect: false, duration: 100, feedback: "§e§l* DIMINISH [§eDMG: {damage}§l] *" } }
  2:
    chance: 3.0
    effects:
      - { DAMAGE_CAP: { factor: 1.0, reflect: false, duration: 100, feedback: "§e§l* DIMINISH [§eDMG: {damage}§l] *" } }
  3:
    chance: 4.5
    effects:
      - { DAMAGE_CAP: { factor: 1.0, reflect: false, duration: 100, feedback: "§e§l* DIMINISH [§eDMG: {damage}§l] *" } }
  4:
