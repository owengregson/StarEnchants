# Cosmic codex: 01-enchants-armor-a-l.md — armor/EnderWalker.java
display: Ender Walker
description: Converts Wither and Poison damage into a chance to heal, while causing self-Blindness unless Clarity is equipped.
trigger: DEFENSE
applies-to: [BOOTS]
group: ultimate
tier: ultimate
stacking: HIGHEST
