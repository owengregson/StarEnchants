# Imported from EliteEnchantments (id: ender-walker). Review before shipping.
display: "Ender Walker"
description:
  - "&eGrants immunity to negative"
  - "&epotion effects. Higher levels"
  - "&ealso heal you when you take"
  - "&edamage."
trigger: DEFENSE
applies-to: [BOOTS]
group: "epic"
tier: epic
levels:
  1:
    effects:
      - { SOUND: { sound: "ENTITY_ENDERMAN_AMBIENT", volume: 0.5, pitch: 1.0 } }
      - { PARTICLE: { particle: "PORTAL", count: 10 } }
      - { IMMUNE: { type: "potion", duration: 100, who: "@Self" } }  # from IMMUNE:POTION — EE IMMUNE → IMMUNE (self; seconds → ticks, default 100t)
  2:
    effects:
      - { SOUND: { sound: "ENTITY_ENDERMAN_AMBIENT", volume: 0.5, pitch: 1.0 } }
      - { PARTICLE: { particle: "PORTAL", count: 10 } }
      - { IMMUNE: { type: "potion", duration: 100, who: "@Self" } }  # from IMMUNE:POTION — EE IMMUNE → IMMUNE (self; seconds → ticks, default 100t)
  3:
    # The heal only fires on a real hit (>= 1.5 dmg) and at most once per 2s, so a poke/0-dmg snowball spam
    # can't heal-lock the wearer. The level-wide gate also gates the IMMUNE refresh (one ability per level).
    condition: "%damage% >= 1.5"
    cooldown: 40
    effects:
      - { SOUND: { sound: "ENTITY_ENDERMAN_AMBIENT", volume: 0.5, pitch: 1.0 } }
      - { PARTICLE: { particle: "PORTAL", count: 10 } }
      - { MODIFY_HEALTH: { amount: 2, mode: "give", who: "@Self" } }
      - { IMMUNE: { type: "potion", duration: 100, who: "@Self" } }
  4:
    condition: "%damage% >= 2.5"
    cooldown: 40
    effects:
      - { SOUND: { sound: "ENTITY_ENDERMAN_AMBIENT", volume: 0.5, pitch: 1.0 } }
      - { PARTICLE: { particle: "PORTAL", count: 10 } }
      - { MODIFY_HEALTH: { amount: 3, mode: "give", who: "@Self" } }
      - { IMMUNE: { type: "potion", duration: 100, who: "@Self" } }
  5:
    condition: "%damage% >= 3"
    cooldown: 40
    effects:
      - { SOUND: { sound: "ENTITY_ENDERMAN_AMBIENT", volume: 0.5, pitch: 1.0 } }
      - { PARTICLE: { particle: "PORTAL", count: 10 } }
      - { MODIFY_HEALTH: { amount: 4, mode: "give", who: "@Self" } }
      - { IMMUNE: { type: "potion", duration: 100, who: "@Self" } }
