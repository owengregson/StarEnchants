# Matrix: 02-enchants-armor-m-z.md § Rocket Escape
display: "Rocket Escape"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA killing blow is voided and launches you straight up,"
  - "&eregenerating, with the landing on the house."
trigger: DEFENSE
applies-to: [BOOTS]  # boots-only in the source registration; the matrix records no item set, but the proc line's "boots" is literal
group: "rare"
tier: rare
chance: 100
# Two abilities on one enchant (the matrix's MULTI_ABILITY_ENCHANT): the DEFENSE save writes the escape
# window, the FALL block spends it. The window replaces the jar's external, never-cleared fall exemption, so
# it closes with the SET_VAR ttl instead of following the player forever.
# The FALL companion takes `cooldown-scope: none`, and it is load-bearing: every block of one enchant otherwise
# shares ONE bucket, so the launch's own 600 t re-arm would deny the landing it exists to cancel and the escape
# would end in the fall damage it just saved you from. Dropping this block's scope means it neither blocks on
# nor arms that bucket; the save keeps its cooldown, and the window's ttl is what bounds the exemption.
# (`guided-rocket-escape.yml` ships the same pairing.)
# The window-end cloud puff carries the only `wait:` and so is written LAST: a wait tier accumulates down the
# effect list, so anything after it would inherit the delay — the launch lines must land on the launch.
# An attacker's Sabotage window (swords doc) blocks the escape at 10% x its level and the 600t cooldown still
# burns (measured) — attacker-side, authored with Sabotage, whose line is
# `§c§l ** §7Rocket Escape:§c§l SABOTAGED **` (leading space verbatim).
# Cooldown bucket: SHARED with the heroic grade (R-QC57) via the named `cooldown-scope: rocket-escape` on the
# launch ability, which is the matrix's one bucket across the pair. The 600 t here and the heroic's 300 t are
# both kept — a shared bucket paces the two, it does not align their thresholds.
# era: EXPLODE is the 1.8 sound id (ENTITY_GENERIC_EXPLODE here, resolver alias); raw Y velocities 6-10 cross
# the client's velocity-warning threshold identically on both eras (jar-faithful).
levels:
  1:
    abilities:
      - cooldown: 600
        cooldown-scope: rocket-escape
        condition: "%damage% >= %actor.health%"
        effects:
          - { CANCEL: {} }
          - { SOUND: { sound: "ENTITY_GENERIC_EXPLODE", volume: 1.0, pitch: 0.54 } }
          - { VELOCITY: { mode: "add", y: 6, who: "@Self" } }
          - { REMOVE_POTION: { effect: "SLOW", who: "@Self" } }
          - { REMOVE_POTION: { effect: "SLOW_DIGGING", who: "@Self" } }
          - { POTION: { effect: "REGENERATION", level: 2, duration: 60, who: "@Self" } }
          - { SET_VAR: { name: "rocketescaping", value: "1", ttl: 65, who: "@Self" } }
          - { PARTICLE: { particle: "CLOUD", count: 69, who: "@Self" } }
          - { MESSAGE: { text: "", who: "@Self" } }
          - { MESSAGE: { text: "§a§l(!) §aYour Rocket Escape boots have activated, recover while they last!", who: "@Self" } }
          - { MESSAGE: { text: "", who: "@Self" } }
          - { PARTICLE: { particle: "CLOUD", count: 69, who: "@Self", wait: 65 } }  # repeated at the window's end
      # No fall damage from the wearer's own launch, for exactly as long as the window holds.
      - trigger: FALL
        cooldown-scope: none
        condition: "%rocketescaping% == 1"
        effects:
          - { CANCEL: {} }
  2:
