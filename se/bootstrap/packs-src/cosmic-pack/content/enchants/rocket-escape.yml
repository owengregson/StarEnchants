          - { REMOVE_POTION: { effect: "SLOW", who: "@Self" } }
          - { REMOVE_POTION: { effect: "SLOW_DIGGING", who: "@Self" } }
          - { POTION: { effect: "REGENERATION", level: 3, duration: 80, who: "@Self" } }
          - { SET_VAR: { name: "rocketescaping", value: "1", ttl: 85, who: "@Self" } }
          - { PARTICLE: { particle: "CLOUD", count: 69, who: "@Self" } }
          - { MESSAGE: { text: "", who: "@Self" } }
          - { MESSAGE: { text: "§a§l(!) §aYour Rocket Escape boots have activated, recover while they last!", who: "@Self" } }
          - { MESSAGE: { text: "", who: "@Self" } }
          - { PARTICLE: { particle: "CLOUD", count: 69, who: "@Self", wait: 85 } }
      - trigger: FALL
