# Matrix: 01-enchants-armor-a-l.md § Guardians
display: "Guardians"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA melee hit from a player can summon an"
  - "&eiron golem that turns on your attacker."
trigger: DEFENSE
applies-to: [ARMOR]
group: "epic"
tier: epic
# Direct player melee only — a projectile never summons.
condition: "%damagecause% == \"ENTITY_ATTACK\" && %victim.type% == \"PLAYER\""
cooldown: 200
# Summon chance is the as-intended min(1 + 5 × level, 20)% ladder with the 0.2 cap: the measured jar fires a
# flat 2% at every level because its `0.02` cap is evidently a mistyped `0.2` (D-01-09).
# Golem HP is 50 + level × 10 and the buff ladder is FIRE_RESISTANCE always, REGENERATION L4+,
# INCREASE_DAMAGE L6+, SPEED L8+, DAMAGE_RESISTANCE L10 — all level 1, held for the golem's whole life.
# The nameplate's `{OWNER}` is the matrix's `{owner}`, and it now substitutes: GUARD binds the activator as the
# summon's owner, so the token fills with the wearer's name. (Batch 01 authored it as `{player}`, which nothing
# ever replaced; the pack-wide flip landed with the token — `enchants/spirits` and `enchants/undead-ruse` took
# the same edit.)
# era: iron golems on 1.8 carry NoAI/targeting quirks (datawatcher 15) — GUARD must go through the era shim;
# ENTITY_IRON_GOLEM_DEATH → 1.8.9 `mob.irongolem.death`, whose `IRONGOLEM_DEATH` row `Aliases.SOUND` carries,
# so the cue plays on both lanes (spirits.yml authors the same token off the same row).
levels:
  1:
    chance: 6
    effects:
      - { GUARD: { type: "IRON_GOLEM", count: 1, ttl: 600, name: "§b§l{OWNER}'s Guardian", health: 60, effects: "FIRE_RESISTANCE" } }
      - { PARTICLE: { particle: "SPELL", count: 45, spread: 1, who: "@Self" } }
      - { SOUND: { sound: "ENTITY_IRON_GOLEM_DEATH", volume: 1.0, pitch: 0.55 } }
  2:
    chance: 11
    effects:
