# Matrix: 02-enchants-armor-m-z.md § Paradox
display: "Paradox"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA hit taken spends souls to heal every nearby ally for a share of the damage."
trigger: DEFENSE
applies-to: [ARMOR]
group: "soul"
tier: soul
# The ally gate is what keeps souls from burning on an empty ally set. %nearbyallies% counts allied PLAYERS
# (self excluded) at the engine's fixed 8-block scan radius, so at every level the gate is TIGHTER than the
# heal radius below (12-28): an ally standing at 10 blocks would be healed but does not arm the gate. The
# matrix writes the condition in exactly this form; the radius-parameterised fact it sketched does not exist
# on the frozen surface.
condition: "(%damagecause% == \"ENTITY_ATTACK\" || %damagecause% == \"PROJECTILE\") && %nearbyallies% >= 1"
soul-cost: 5  # flat at every level, and no cooldown — sustained fire drains souls (measured)
no-souls-message: "§c§l** OUT OF SOULS **"
# era: HAPPY_VILLAGER carries its own cross-era spelling through the particle alias table; the recorded
# LEVEL_UP and EAT sounds are the 1.8 enum constants, authored here as their modern flattened names
# (ENTITY_PLAYER_LEVELUP was already in the alias table; ENTITY_GENERIC_EAT got its row in wave 2e.2, closing
# the legacy sweep, so both cues land on 1.8).
# Ledger D-02-4 (as-intended): the heal ships as damage x level/10. The measured jar computed
# damage x (level/10) in integer division — always 0.0 HP at every level while still charging souls and
# playing the full feedback. The same truncation collapsed its "ally needs healing" test into "any ally
# nearby", so the %nearbyallies% gate above IS the intended form.
# The jar's ally box was horizontal-only with a vertical reach of radius+128; @Aoe is spherical and does not
# replicate that asymmetry (noted, no ledger row).
# Ally = faction ally/member both ways with neither in a duel, spectators excluded — the engine relation
# layer. Soul discounts (Outposts / faction upgrades, including the top-rank no-discount quirk) are
# environment gates and are not ported.
# The jar printed the two soul lines only when the balance was a multiple of 100 or below 10; that throttle
# is a lang-layer choice, so the lines ship unconditionally with the activation.
# R-QC2 binds the five tokens. `{owner}` is the wearer, and on a DEFENSE pass the wearer IS the activating
# player, so it is MESSAGE's native `{ATTACKER}` — never `{SELF}`, which would render each ally's own name on
# a line addressed to the whole ally set. `{heal}` repeats the expression of the MODIFY_HEALTH beside it and
# `{total}` multiplies that by the ally count; `%nearbyallies%` counts at the engine's fixed 8-block radius
# where the jar counted at the level radius (12-28) — the same approximation the gate above already makes.
# `{cost}` is the flat 5 and `{souls}` subtracts it: facts are populated before the gate-10 debit, so a bare
# `%actor.souls%` under a line that says "left" would print the pre-spend balance.
levels:
  1:
    chance: 10
    effects:
      - { MODIFY_HEALTH: { amount: "%damage% * 0.1", mode: "give", who: "@Aoe{r=12, filter=ALLIES}" } }
      - { PARTICLE: { particle: "HAPPY_VILLAGER", count: 20, who: "@Aoe{r=12, filter=ALLIES}" } }
      # R-QC55: the eat cue was the jar's PER-ALLY one, so it takes the heal's own ally set. Residue: the jar
      # played it to each ally privately; `who` moves where a cue plays, never who hears it, so each copy is
      # world-audible where it lands. The level-up cue below is the wearer's and stays at the activation point.
      - { SOUND: { sound: "ENTITY_GENERIC_EAT", volume: 1.0, pitch: 2.0, who: "@Aoe{r=12, filter=ALLIES}" } }
      - { SOUND: { sound: "ENTITY_PLAYER_LEVELUP", volume: 1.0, pitch: 0.65 } }
      - { MESSAGE: { text: "§a§l** PARADOX [{ATTACKER}] (+{heal}HP) **", who: "@Aoe{r=12, filter=ALLIES}", tokens: { heal: "%damage% * 0.1" } } }
      - { MESSAGE: { text: "§2§l** PARADOX [{total} -> HP]  **", who: "@Self", tokens: { total: "%nearbyallies% * (%damage% * 0.1)" } } }
      - { MESSAGE: { text: "§c§l- {cost} Soul Gems", who: "@Self", tokens: { cost: 5 } } }
      - { MESSAGE: { text: "§7You have §n{souls}§7 souls left.", who: "@Self", tokens: { souls: "%actor.souls% - 5" } } }
