# Matrix: 01-enchants-armor-a-l.md § Creeper Armor
display: "Creeper Armor"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eNegates explosion damage and, from level II, its knockback."
# HURT, not DEFENSE: DEFENSE walks only entity-on-entity damage, and a BLOCK_EXPLOSION arrives as an
# EntityDamageByBlockEvent — so the whole BLOCK_EXPLOSION half of the gate was unreachable there (the
# enlighted.yml / inversion.yml reading of the same seam). HURT is the all-cause defensive walk and carries
# everything this file reads: %damagecause%, the pre-fold %damage%, @Self, and CANCEL through the same
# fold-and-cancel commit DEFENSE uses.
# Residue (D-01-16): the two causes still reach the walk by different routes, so a pack that disables
# `combat.pve` keeps the BLOCK_EXPLOSION half and loses the ENTITY_EXPLOSION one.
trigger: HURT
applies-to: [ARMOR]
group: "epic"
tier: epic
condition: "%damagecause% == \"BLOCK_EXPLOSION\" || %damagecause% == \"ENTITY_EXPLOSION\""
levels:
  1:
    chance: 100
    effects:
      - { CANCEL: {} }
  2:
    chance: 100
    effects:
      - { CANCEL: {} }
      - { KNOCKBACK_CONTROL: { multiplier: 0, duration: 2, who: "@Self" } }
  3:
    chance: 100
    effects:
      - { CANCEL: {} }
      - { KNOCKBACK_CONTROL: { multiplier: 0, duration: 2, who: "@Self" } }
      # The as-intended heal (D-01-04): the measured 0.0 is a read-after-write bug, so ship
      # min(6.0, 0.1 x raw event damage) as an expression param over the pre-fold %damage% fact.
      - { MODIFY_HEALTH: { amount: "clamp(0.1 * %damage%, 0, 6)", mode: "give", who: "@Self" } }
