      - { POTION: { effect: "SPEED", level: 2, duration: 300, who: "@Aoe{r=13,filter=ALLIES}" } }
      - { REMOVE_POTION: { effect: "POISON", who: "@Aoe{r=13,filter=ALLIES}" } }
