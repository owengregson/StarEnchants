# Cosmic codex source: 06-enchants-tools-heroic.md — heroic/HeroicArmored.java
display: Paladin Armored
description: Stackable Heroic Enchantment. Negates 150% more enemy sword damage than normal Armored per level. A chance to be Blessed every time you are struck by an enemy sword. Once applied, this enchantment can only be extracted from items with heroic black scrolls.
trigger: DEFENSE
applies-to: [ARMOR]
group: heroic
tier: heroic
disabled-environments: [THE_END]
stacking: EACH
levels:
  1:
    abilities:
      - trigger: DEFENSE
        condition: '%victim.isplayer% == 1 && %victim.helditem% contains "_SWORD" && %damage% * 0.97 > 1'
        effects: [{ DAMAGE_MOD: { side: defense, mode: multiply, amount: 0.97 } }, { BLOCK_BREAK_EFFECT: { block: DIAMOND_BLOCK } }]
      - trigger: DEFENSE
        chance: 1
        condition: '%victim.isplayer% == 1'
        effects: &paladin-bless
          - CURE_ONE_OF:
              effect-1: BLINDNESS
              effect-2: CONFUSION
              effect-3: HARM
              effect-4: HUNGER
              effect-5: POISON
              effect-6: SLOW
              effect-7: SLOW_DIGGING
              effect-8: WEAKNESS
              effect-9: WITHER
              success-message: '&e&l** BLESSED **'
              message-throttle-set: sets/koth
              message-throttle: 160
              who: '@Self'
  2:
    abilities:
      - { trigger: DEFENSE, condition: '%victim.isplayer% == 1 && %victim.helditem% contains "_SWORD" && %damage% * 0.94 > 1', effects: [{ DAMAGE_MOD: { side: defense, mode: multiply, amount: 0.94 } }, { BLOCK_BREAK_EFFECT: { block: DIAMOND_BLOCK } }] }
      - { trigger: DEFENSE, chance: 2, condition: '%victim.isplayer% == 1', effects: *paladin-bless }
  3:
    abilities:
      - { trigger: DEFENSE, condition: '%victim.isplayer% == 1 && %victim.helditem% contains "_SWORD" && %damage% * 0.91 > 1', effects: [{ DAMAGE_MOD: { side: defense, mode: multiply, amount: 0.91 } }, { BLOCK_BREAK_EFFECT: { block: DIAMOND_BLOCK } }] }
      - { trigger: DEFENSE, chance: 3, condition: '%victim.isplayer% == 1', effects: *paladin-bless }
  4:
    abilities:
      - { trigger: DEFENSE, condition: '%victim.isplayer% == 1 && %victim.helditem% contains "_SWORD" && %damage% * 0.88 > 1', effects: [{ DAMAGE_MOD: { side: defense, mode: multiply, amount: 0.88 } }, { BLOCK_BREAK_EFFECT: { block: DIAMOND_BLOCK } }] }
      - { trigger: DEFENSE, chance: 4, condition: '%victim.isplayer% == 1', effects: *paladin-bless }
requires: [enchants/armored]
removes-required: true
