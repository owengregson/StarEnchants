# Matrix: 03-enchants-swords.md § Assassin
display: "Assassin"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eThe closer you are when the hit lands the harder"
  - "&eit bites — and past two blocks it bites you back."
trigger: ATTACK
applies-to: [SWORD]
group: "epic"
tier: epic
# No chance roll: every qualifying hit takes exactly one band. The jar ran cumulative independent `if`s; the
# eight DISJOINT net bands below reproduce its totals exactly (L5: x1.25 / x1.20 / x1.15 / x1.10 / x1.05 /
# x1.00 / x0.95 / x0.8875 / x0.7625). 1.5-2.0 blocks deliberately carries no row — that gap IS the x1.00 band.
# The past-two-blocks penalty is real and kept. Cross-world hits cannot occur in-engine, so no world guard.
# Composition with every other attack modifier is the engine's additive fold (the jar composed
# multiplicatively in unspecified order — an engine-model difference the fold design owns, not a deviation).
# The heroic upgrade path to Shadow Assassin lives in doc 07.
# era: none (pure damage math).
levels:
