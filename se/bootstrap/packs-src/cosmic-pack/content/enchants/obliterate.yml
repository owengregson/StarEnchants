# Matrix: 03-enchants-swords.md § Obliterate
display: "Obliterate"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA chance to blast your target away,"
  - "&ein melee or with an arrow."
trigger: [ATTACK, BOW]
applies-to: [SWORD, AXE, BOW]
group: "common"
tier: common
# applies-to is the jar's "weapons" item set spelled out (swords + axes + bow) rather than the WEAPON
# composite, which would also cover crossbows, tridents and maces the original never listed (owner ITEM-SET
# ruling). BOTH damage triggers carry the same roll and the same payload — one ability per trigger, the Blind
# and Deathbringer shape — because the jar's hook is `applyEffect`, whose trunk gate takes ENTITY_ATTACK or
# PROJECTILE off the shooter's held item: a bow carrying this DID shove the arrow's victim. The matrix line
# records "trigger ATTACK" and omits the note Blind's carries; ATTACK alone would leave the bow half of the
# item set a paid-for, lore-rendered dead slot that only fires when you melee-bash with the bow.
# VELOCITY mode=away with the default activator anchor is the attacker->victim shove the jar computed by
# hand, normalized vector and all, including its zero-length skip when the two share a position. The anchor is
# the ACTIVATOR's origin snapshot, so the arrow half shoves away from the shooter exactly as the jar's
# `pushAwayEntity(user, target, ...)` did — not away from the arrow.
# The jar's world gates are server policy, not enchant behaviour: the End-world disable is a global tier
# rule, the duel flag and the KOTH knockback suppression belong to the policy layer. KOTH suppresses ONLY
# the shove and still plays the burst, which the recorded order (particle first, then velocity) preserves as
# long as the policy sits between the two rows.
# era: EXPLOSION_LARGE is the cross-era spelling of the jar's LARGE_EXPLODE, mapped by the particle aliases.
levels:
  # chance 10 pp per level; push speed 1.8 + 0.5 x level (2.3/2.8/3.3/3.8/4.3).
  1:
    abilities:
      - trigger: ATTACK
        chance: 10
        effects:
          - { PARTICLE: { particle: "EXPLOSION_LARGE", count: 3, spread: 1.0, who: "@Victim" } }
          - { VELOCITY: { mode: "away", strength: 2.3, who: "@Victim" } }
      - trigger: BOW
        chance: 10
        effects:
          - { PARTICLE: { particle: "EXPLOSION_LARGE", count: 3, spread: 1.0, who: "@Victim" } }
