# Matrix: 03-enchants-swords.md § Inversion
display: "Inversion"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA chance to shrug off any damage you take"
  - "&eand heal 1 to 3 health instead."
trigger: HURT
applies-to: [SWORD]
group: "legendary"
tier: legendary
# HURT, not DEFENSE: the matrix's HURT_TRIGGER gap is what this entry was waiting on. The jar inverts EVERY
# damage cause (fall, fire, drowning, poison ticks), and DEFENSE needs an attacking target, so only the
# all-cause defensive trigger reproduces it. No %damagecause% condition — every cause qualifies.
# The sword is HELD while defending: a non-armour held item stays in WornState, so an equipment-scanning
# defensive trigger reaches it (the entry's "WornState held-item source" note).
# The 1/2/3 draw is an exact chance ladder over 1 t scratch vars, which the frozen surface has no single
# primitive for (the entry's optional RANDOM_PARAM gap would collapse it to one row). `inv.proc` carries the
# 5 x level activation roll to the rows behind it so the whole proc shares ONE roll; `inv.done` makes the
# three heal rungs mutually exclusive. A SET_VAR write lands in the store immediately, so a later row in the
# same pass reads it — the ladder is 33.334% / 50%-of-the-rest / remainder, i.e. 1/3 each.
# Defensive double-fire member: single-pass values per D-001. The jar's guard on the 1-3 draw is dead code
# (always true) and is not ported; its CCE on non-player defenders is a crash bug the engine cannot reach
# (player-scoped). MODIFY_HEALTH already clamps at max health and refuses a dead target, as measured.
# THE CORRUPT PAIRING (`corrupt-inverts-inversion`), authored here because both halves read this file's scope:
# axes/Corrupt writes `corrupt` = its level onto the player it corrupts, and that player is the DEFENDER here,
# so the flag is read from the actor's OWN store as a bare `%corrupt%` — the same actor-side idiom §Blessed
# uses for `%deepwounds%`, not `%victim.var.corrupt%` (in a HURT pass the corrupted party IS the actor).
# `inv.corrupted` carries the `corrupt x 20`% inversion roll to every rung, so the whole proc inverts or none
# of it does; the roll is a `chance:` EXPRESSION over the flag's level value (20/40/60/80 %, the matrix's
# float-measured 0.6000000238418579 / 0.800000011920929 read as exact, the treatment §Rage's per-stack
# 0.15000000000000002 already gets). Each rung is a mutually exclusive PAIR on that var — the two-ability
# idiom §Bleed uses for its player/mob split — so a rung still rolls once and either heals or bites.
# `{AMOUNT}` is INLINED per rung, not bound. MESSAGE's `tokens` expr-map would bind it happily, but the value
# is a per-rung constant with no fact behind it, and a bound token renders through the chat formatter, which
# drops a whole number's decimal point ("1"). The jar prints the double ("1.0"), so each rung carries its own
# line with the exact string the jar would have shown: 1.0 / 2.0 / 3.0.
# The CANCEL row is the ONLY branch-gated cue: a corrupted proc lets the incoming hit land, so it drops out
# while the particle and sound stay shared. The self-DAMAGE cannot re-arm this enchant — SE-issued damage is
# an ADR-0054 engine-damage frame our own walks never proc off — and, aimed at the event entity with no wait,
# it folds into the very hit it declined to cancel.
# era: BLOCK_PISTON_EXTEND is the modern spelling of the 1.8 `PISTON_EXTEND` cue (legacy-sweep alias row);
# SPELL exists on both eras through the particle alias table.
levels:
  # Activation chance 5 x level (float-cast, exact at these values); the heal is a level-independent
  # 1.0/2.0/3.0 uniform draw, and the corrupted branch bites for the same draw.
  1:
    abilities:
      - chance: 5
        effects:
          - { SET_VAR: { name: "inv.proc", value: "1", ttl: 1, who: "@Self" } }
      - condition: "%inv.proc% == 1 && %corrupt% > 0"
        chance: "%corrupt% * 20"
        effects:
          - { SET_VAR: { name: "inv.corrupted", value: "1", ttl: 1, who: "@Self" } }
      - condition: "%inv.proc% == 1 && %inv.corrupted% != 1"
        chance: 33.334
        effects:
          - { SET_VAR: { name: "inv.done", value: "1", ttl: 1, who: "@Self" } }
          - { MODIFY_HEALTH: { amount: 1, mode: "give", who: "@Self" } }
      - condition: "%inv.proc% == 1 && %inv.corrupted% == 1"
        chance: 33.334
        effects:
          - { SET_VAR: { name: "inv.done", value: "1", ttl: 1, who: "@Self" } }
          - { DAMAGE: { amount: 1, who: "@Self" } }
          - { MESSAGE: { text: "§5* CORRUPTED [§c1.0§5 DMG] *" } }
      - condition: "%inv.proc% == 1 && %inv.done% != 1 && %inv.corrupted% != 1"
        chance: 50
        effects:
          - { SET_VAR: { name: "inv.done", value: "1", ttl: 1, who: "@Self" } }
          - { MODIFY_HEALTH: { amount: 2, mode: "give", who: "@Self" } }
      - condition: "%inv.proc% == 1 && %inv.done% != 1 && %inv.corrupted% == 1"
        chance: 50
        effects:
          - { SET_VAR: { name: "inv.done", value: "1", ttl: 1, who: "@Self" } }
          - { DAMAGE: { amount: 2, who: "@Self" } }
          - { MESSAGE: { text: "§5* CORRUPTED [§c2.0§5 DMG] *" } }
      - condition: "%inv.proc% == 1 && %inv.done% != 1 && %inv.corrupted% != 1"
        chance: 100
        effects:
          - { MODIFY_HEALTH: { amount: 3, mode: "give", who: "@Self" } }
      - condition: "%inv.proc% == 1 && %inv.done% != 1 && %inv.corrupted% == 1"
        chance: 100
        effects:
          - { DAMAGE: { amount: 3, who: "@Self" } }
          - { MESSAGE: { text: "§5* CORRUPTED [§c3.0§5 DMG] *" } }
      - condition: "%inv.proc% == 1 && %inv.corrupted% != 1"
        chance: 100
        effects:
          - { CANCEL: {} }
      - condition: "%inv.proc% == 1"
        chance: 100
        effects:
          - { PARTICLE: { particle: "SPELL", count: 20, spread: 0.45, who: "@Self" } }
          - { SOUND: { sound: "BLOCK_PISTON_EXTEND", volume: 0.8, pitch: 2.0 } }
