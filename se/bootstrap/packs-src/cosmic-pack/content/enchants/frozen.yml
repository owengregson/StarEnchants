      - { PARTICLE: { particle: "BLOCK_CRACK", block: "DIAMOND_BLOCK", count: 8, who: "@Self" } }  # verbatim diamond-block cue (not ice) — copy-paste in the original, kept
      - { SOUND: { sound: "BLOCK_STONE_BREAK", volume: 1, pitch: 1 } }
  3:
