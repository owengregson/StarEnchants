# Matrix: 07-enchants-mastery-soul.md § Lava Strider
# The jar's whole measured payload is ONE flag write — `SET_VAR(name=mastery.lava-strider, value=1, ttl=0)` on
# a PASSIVE walk — and its consumer is CODEX-UNRESOLVED, in an external plugin nothing in this corpus reads.
# OWNER RULING R-QC38 resolves that: the entry ships with the behaviour the matrix's own note names, a
# `WALKER` lava-walk, rather than as a marker for a reader that does not exist. The flag itself still
# publishes as worn state (`%actor.enchlevel.lava-strider%`, keyed on the file STEM) because worn state has
# the teardown a ttl-0 SET_VAR does not — the Solitude row's pack-wide reading.
# THE WALK, and every number in it is a port choice, not a measurement — the jar held none:
#  * REPEATING at 10 t rather than a move hook: the surface has no per-step trigger. Radius 2 stamps
#    cx-2..cx+2, so the pad leads by 2-3 blocks depending on where in the block the wearer stands, and a
#    wearer wading a lake carries lava's horizontal drag — well under the 5.6 blocks/s sprint. Margin, not a
#    guarantee.
#  * The ground test is a `contains` on the server's own block name, which spans 1.8's LAVA / STATIONARY_LAVA
#    split and the flattened modern LAVA in one clause — the `detonate.yml` idiom. Without it a radius-2
#    REPLACEABLE stamp would pave AIR under a jumping wearer, which is a flight enchant, not this one.
#  * `replace: REPLACEABLE` (air/liquid only) is what keeps it off terrain: the pad can never eat a floor,
#    and the temp-block ledger restores the lava it took.
#  * OBSIDIAN is the crust a lava strider walks on, exists unrenamed on both eras, and needs no alias row.
#  * radius 2 (a 5x5 pad) and 60 t of life: two blocks of margin ahead of the wearer, and a trail that closes
#    behind them rather than a bridge anyone can follow.
display: "Lava Strider"
# description: not matrix-recorded (factual paraphrase); it names the walk now that the walk is authored.
description:
  - "&eA mastery of the molten. Lava crusts over"
  - "&eunder your boots for as long as you walk it."
trigger: REPEATING
repeat: 10  # the stamp cadence; level-independent
# ONLY over lava. `%actor.groundblock%` is the block one below the feet — the very layer WALKER stamps
# (`origin.getBlockY() - 1`) — so a wearer atop a fresh pad does NOT re-arm; they re-arm on the step that
# carries them past its 2-block margin back onto lava, and that alternation is the walk. Extending the pad
# from atop itself is deliberately unauthored: an `|| == "OBSIDIAN"` clause self-sustains over AIR too
# (`replace: REPLACEABLE` takes air), turning the walk into an endless bridge off the nearest ledge — the
# flight enchant the ground test above refuses. Nor can `%actor.ownedground%` narrow it to this enchant's own
# crust: that flag reads the placer the temp-block ledger recorded and WALKER places UNOWNED
# (`DispatchSinkBase.tempPlatform` passes a null owner), so it is false over every tile this file lays —
# permafrost.yml's gate works only because TEMP_BLOCK carries its placer.
# Residue, recorded: each re-arm costs the wearer up to one 10 t pulse of lava contact between pads.
condition: "%actor.groundblock% contains \"LAVA\""
# BOOTS, not ARMOR: the matrix records this as the only mastery whose natural items are restricted to one
# slot. The rest of the family takes all four pieces. Handing a mastery onto locked kit armour is the Mastery
# Shard flow, an economy/config concern the effect matrix leaves out.
applies-to: [BOOTS]
# Tier 8 = the `mastery` rung (&4, weight 80), so the lore line renders `§4Lava Strider I` — matrix 07
# § Presentation. The jar's group is "Default" (a mastery never conflicts with anything); the pack's `group:`
# mirrors the rung, as every other file here does, and no conflict rule is keyed to it.
group: "mastery"
tier: mastery
# NO `suppress-immune`, and none of the family carries one: the flag exempts an ability from ALL suppression
# (`SuppressionStore.suppressesAny` returns false before it reads a scope), and END-SUPPRESS — the world rule
# that has to reach every tier above 5 — cannot then reach a tier-8 file. Same ruling the heroic contract
# settled in batch 06. It bites now that there is a walk to silence: a silenced Lava Strider stops paving.
# Family rules that do not bite this entry: the offence-dispatch rule (ATTACK-side masteries only, and the
# lowest worn level procing where the engine keeps the highest) has no REPEATING half; the RIFT-mask negation
# and the Dragon Slayer reflect/negate both key on offensive procs; D-07-1's asymmetric scan geometry has no
# shape to correct.
# strings: none. numbers: level-independent, max 1. era: OBSIDIAN and the LAVA name test both cross eras
# unchanged, so `Aliases.MATERIAL` owes this entry nothing.
levels:
  # One rung, because the measured flag is level-independent — max 1 in the jar, so the radius expression has
  # exactly one value to take.
  1:
    effects:
      - { WALKER: { material: "OBSIDIAN", ticks: 60, radius: 2, replace: REPLACEABLE } }
