# Imported from EliteEnchantments (id: enrage). Review before shipping.
display: "Enrage"
description:
  - "&eOn hit at low health, deals"
  - "&ebonus damage that grows as your"
  - "&ehealth falls."
trigger: ATTACK
applies-to: [SWORD]
group: "epic"
tier: epic
levels:
  1:
    condition: "%actor.healthpercent% < 50"
    effects:
      - { SOUND: { sound: "ENTITY_RAVAGER_ROAR", volume: 0.8, pitch: 1.0 } }
      - { PARTICLE: { particle: "VILLAGER_ANGRY", count: 8, who: "@Self" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "(100 - %actor.healthpercent%) * 0.4" } }  # flat bonus per % of missing health (at 20% health: +32)
