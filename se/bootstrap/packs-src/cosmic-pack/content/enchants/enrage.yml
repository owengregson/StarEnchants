# Imported from EliteEnchantments (id: enrage). Review before shipping.
display: "Enrage"
description:
  - "&eOn hit at low health, deals"
  - "&ebonus damage that grows as your"
  - "&ehealth falls."
trigger: ATTACK
applies-to: [SWORD]
group: "epic"
tier: epic
levels:
  1:
    condition: "%actor.health% < 10"
    effects:
      - { SOUND: { sound: "ENTITY_RAVAGER_ROAR", volume: 0.8, pitch: 1.0 } }
      - { PARTICLE: { particle: "VILLAGER_ANGRY", count: 8, who: "@Self" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "20 - %actor.health%" } }  # from DAMAGE_INCREASE:playerHealth*2 — EE equation → flat bonus per missing HP
  2:
    condition: "%actor.health% < 10"
    effects:
      - { SOUND: { sound: "ENTITY_RAVAGER_ROAR", volume: 0.8, pitch: 1.0 } }
      - { PARTICLE: { particle: "VILLAGER_ANGRY", count: 8, who: "@Self" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "(20 - %actor.health%) * 1.5" } }  # from DAMAGE_INCREASE:playerHealth*2 — EE equation → flat bonus per missing HP
  3:
    condition: "%actor.health% < 10"
    effects:
      - { SOUND: { sound: "ENTITY_RAVAGER_ROAR", volume: 0.8, pitch: 1.0 } }
      - { PARTICLE: { particle: "VILLAGER_ANGRY", count: 8, who: "@Self" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "(20 - %actor.health%) * 2" } }  # from DAMAGE_INCREASE:playerHealth*2.5 — EE equation → flat bonus per missing HP
