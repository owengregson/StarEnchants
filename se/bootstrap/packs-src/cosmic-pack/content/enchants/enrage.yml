      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "(100 - %actor.healthpercent%) * 0.5" } }  # flat bonus per % of missing health (at 20% health: +40)
  3:
    condition: "%actor.healthpercent% < 50"
    effects:
      - { SOUND: { sound: "ENTITY_RAVAGER_ROAR", volume: 0.8, pitch: 1.0 } }
      - { PARTICLE: { particle: "VILLAGER_ANGRY", count: 8, who: "@Self" } }
