# Cosmic codex source: 03-enchants-swords.md — swords/Enrage.java
display: Enrage
description: Multiplies outgoing damage by 1.15 below 75% health, 1.30 below 50%, and 1.45 below 25%; all levels are intentionally identical.
trigger: ATTACK
applies-to: [SWORD]
group: ultimate
tier: ultimate
stacking: HIGHEST
levels:
  1:
    abilities: &bands
      - { trigger: ATTACK, condition: '%actor.healthpercent% > 75', effects: [{ DAMAGE_MOD: { side: attack, mode: multiply, amount: 1 } }] }
      - { trigger: ATTACK, condition: '%actor.healthpercent% > 50 && %actor.healthpercent% <= 75', effects: [{ DAMAGE_MOD: { side: attack, mode: multiply, amount: 1.15 } }] }
      - { trigger: ATTACK, condition: '%actor.healthpercent% > 25 && %actor.healthpercent% <= 50', effects: [{ DAMAGE_MOD: { side: attack, mode: multiply, amount: 1.2999999999999998 } }] }
      - { trigger: ATTACK, condition: '%actor.healthpercent% <= 25', effects: [{ DAMAGE_MOD: { side: attack, mode: multiply, amount: 1.4499999999999997 } }] }
  2: { abilities: *bands }
  3: { abilities: *bands }
