# Matrix: 04-enchants-axes.md § Barbarian
display: "Barbarian"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eYou hit harder against anyone who brought"
  - "&ean axe to the fight."
trigger: ATTACK
applies-to: [AXE]
group: "legendary"
tier: legendary
condition: "%victim.helditem% matchesregex \".*_AXE$\""
# D-04-4 is NOT a deviation: the measured gate is `contains("_AXE")`, and no Material name on either era
# carries `_AXE` anywhere but terminally — DIAMOND_PICKAXE's one underscore precedes PICKAXE — so the
# substring never matched a pickaxe and this full-match regex selects exactly the same items.
# No roll and no player gate — the bonus lands on every qualifying hit, mobs holding axes included.
# Structural mirror of Insanity (victim holding a sword).
# era: held material names differ per lane (1.8.9 WOOD_AXE/GOLD_AXE vs modern WOODEN_AXE/GOLDEN_AXE); the
# `_AXE` suffix holds on both, which an exact-name list would not. The regex rather than the `contains` idiom
# armored.yml/rage.yml use is legibility, not era and not correction — `contains` selects the same items on
# either lane, as tank.yml ships.
levels:
  # +5 pp per level; nothing else scales.
  1:
    effects:
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: 5 } }
  2:
    effects:
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: 10 } }
  3:
    effects:
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: 15 } }
  4:
    effects:
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: 20 } }
