# Matrix: 02-enchants-armor-m-z.md § Spirits
display: "Spirits"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA melee hit you take can call a spirit that"
  - "&epulses health into your allies while it lives."
trigger: DEFENSE
applies-to: [ARMOR]
group: "epic"
tier: epic
# The player-damager half of the jar's gate ships as `%victim.type%` — on a DEFENSE pass the "victim" IS the
# attacker, which is how `enchants/guardians` (the same jar condition) already reads it. The matrix records
# this fact as missing and widens to mob melee; the widening is not needed.
# Chance is a flat 2 % at every level: the jar clamps `0.01 + 0.05 x level` down to 0.02 everywhere, and the
# nullifying clamp is the deliberate, measured value.
# Blaze HP is 50 + level x 10, count 1 (2 at L10 — `level / 10` integer division), lifetime 200 t, and the
# buff ladder is FIRE_RESISTANCE always, REGENERATION L4+, INCREASE_DAMAGE L6+, SPEED L8+, DAMAGE_RESISTANCE
# L10 — all level I, held for the blaze's whole life. `targeting: false` is what keeps a spirit off players;
# the L6+ Strength/Speed buffs are decorative on a summon that never acquires a target (measured).
# The heal pulse is the summon payload: a SECOND ability of this enchant on the SUMMON_PAYLOAD trigger, run by
# the OWNER once per ally the blaze's box admits (actor = the wearer, victim = that ally, activation anchored
# at the blaze). The ALLIES filter is the ordinary selector filter, and the payload box never admits the owner
# — the jar's exact-ALLY test, which never heals the summoner either.
# The blaze's name carries `{OWNER}` for the matrix's `{owner}` and fills with the wearer's name: `owner:
# activator` binds the summon, which is what the token reads. (Batch 05 authored it as `{player}`, which nothing
# ever substituted; the flip landed pack-wide with the token.)
# The pulse takes `cooldown-scope: none`, and without it the whole payload is dead: every block of one enchant
# otherwise shares ONE bucket, so the 200 t re-arm the spawn proc takes covers the blaze's entire 200 t life
# and gate 6 denies every pulse it could ever fire. Dropping this block's scope means it neither blocks on nor
# arms that bucket — the spawn keeps its own re-arm, and the heal pulses for as long as the spirit lives.
# era: `IRONGOLEM_DEATH` / `ORB_PICKUP` are the 1.8.9 spellings of ENTITY_IRON_GOLEM_DEATH (`mob.irongolem.death`)
# and ENTITY_EXPERIENCE_ORB_PICKUP (`random.orb`). `Aliases.SOUND` carries both rows, so the spawn cue and
# the ally-heal chime each resolve on 1.8.
# SPELL/FLAME/HEART resolve on both eras (1.8 takes particles by NMS name, not a Bukkit enum).
# A 1.8 blaze carries its own AI quirks, but a non-targeting one never reaches its fireball path.
levels:
  1:
    abilities:
      - chance: 2
        cooldown: 200
        condition: "%damagecause% == \"ENTITY_ATTACK\" && %victim.type% == \"PLAYER\""
        effects:
          - { SPAWN_ENTITY: { type: "BLAZE", count: 1, ttl: 200, health: 60, owner: "activator", targeting: false, name: "§c§l{OWNER}'s Spirit", effects: "FIRE_RESISTANCE", payload-phase: "periodic", payload-period: 84, payload-radius: 9, payload-filter: "ALLIES", payload-max-targets: 1, who: "@Self" } }
          - { PARTICLE: { particle: "SPELL", count: 45, who: "@Self" } }
          - { PARTICLE: { particle: "FLAME", count: 35, who: "@Self" } }
          - { SOUND: { sound: "ENTITY_IRON_GOLEM_DEATH", volume: 1.0, pitch: 0.55 } }  # one cue a proc; L10's second blaze shares it
      # The pulse: one activation an ally, so the heal, its cue and the ally burst are ordinary targeted effects.
      - trigger: SUMMON_PAYLOAD
        chance: 100
        cooldown-scope: none
        effects:
          - { MODIFY_HEALTH: { amount: 1, mode: "give", who: "@Victim" } }
          - { SOUND: { sound: "ENTITY_EXPERIENCE_ORB_PICKUP", volume: 0.3, pitch: 1.4, who: "@Victim" } }
          - { PARTICLE: { particle: "HEART", count: 15, who: "@Victim" } }
          - { PARTICLE: { particle: "HEART", count: 20 } }  # at the blaze — the activation location of a payload
