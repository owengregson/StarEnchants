# Matrix: 04-enchants-axes.md § Corrupt
display: "Corrupt"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA hit can corrupt a player: the rot eats at"
  - "&ethem for a few seconds and leaves them marked."
trigger: ATTACK
applies-to: [AXE]
group: "epic"
tier: epic
# Players only, and never onto someone already corrupted — the re-proc gate reads the victim's own flag
# (`%victim.var.corrupt%`, 0 when unset), which is what the matrix's VICTIM_VAR_FACT gap asked for and wave 1
# shipped. The flag carries the LEVEL as its value, so the gate cannot be written `!= 1`.
condition: "%victim.type% == \"PLAYER\" && %victim.var.corrupt% == 0"
# D-04-9 (major, codex-marked): the jar's roll compares Math.random() to `5.0 + 0.02 * level` — always true, so
# Corrupt procs on 100% of qualifying hits at every level. As intended it is `0.05 + 0.02 * level`, which is
# exactly the activation envelope's `5 + 2 * level` and the package's own pattern; 7/9/11/13% ships.
# The flag ttl (level x 2 s) and the DoT wait-chain (the jar's task, level^2 x 20 t) are deliberately DIFFERENT
# lengths, reproducing the jar's mismatch structurally: at L1 the flag outlives the DoT, at L2-L4 the DoT
# outlives the flag, so a mid-DoT re-proc can re-flag without starting a second DoT. The jar's async
# final-tick cancel race has no analogue here — wait chains are deterministic.
# PENDING WAVE-1F FACT — the Inversion carve-out is NOT authored. A victim HOLDING an Inversion item takes the
# flag and the portal burst but none of the DoT rows, and no fact on the frozen surface reads the victim's
# held-item enchant state (`%victim.helditem%` is a material, not an enchant level). Same blocker as the
# Metaphysical/Sticky consumers; tracked in deferred-content.md under partial entries.
# The other half of that pairing IS authored now, and entirely on the other side: swords/Inversion reads this
# flag and its level to turn its own heal into self-damage (`corrupt-inverts-inversion`, chance 20 x corrupt
# level), and carries the `§5* CORRUPTED [§c{AMOUNT}§5 DMG] *` line. It reads a bare `%corrupt%`, not
# `%victim.var.corrupt%` — Inversion runs on the corrupted player's own HURT, so this write lands in the
# store that file reads from.
# The PORTAL burst is recorded at the victim's eye height with jar speed 0.6F: PARTICLE centres on the body
# and the surface's spread default stands, so both are cosmetic deltas (same reading as §Hex's burst).
# era: PORTAL and the REDSTONE_WIRE crack material both resolve on 1.8.9 — no hazard.
levels:
  # Chance 5 + 2 x level. Flag value = level, ttl = level x 40 t. DoT: first application at t=0, then one every
  # level x 20 t for as long as the jar's task lived (level^2 x 20 t) — 2/3/4/5 applications of 1/1/2/2 damage,
  # totals 2/3/8/10. `wait:` accumulates down the list, so each DAMAGE carries only the GAP since the previous
  # one and the crack burst behind it rides the same tick.
  # The per-tick crack burst is `count: 8` (port-chosen): the jar plays world effect 2001, which carries no
  # count, and 8 is what the same doc's Anti Gank row records for a single-burst 2001 mapping (§Devour ports
  # its own single burst at the same 8; Bleed's 15-a-repeat is the repeat-scaled variant).
  1:
    chance: 7
    effects:
      - { SET_VAR: { name: "corrupt", value: "1", ttl: 40, who: "@Victim" } }
      - { PARTICLE: { particle: "PORTAL", count: 20, who: "@Victim" } }
      - { DAMAGE: { amount: 1, who: "@Victim" } }
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "REDSTONE_WIRE", count: 8, who: "@Victim" } }
      - { DAMAGE: { amount: 1, who: "@Victim", wait: 20 } }
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "REDSTONE_WIRE", count: 8, who: "@Victim" } }
