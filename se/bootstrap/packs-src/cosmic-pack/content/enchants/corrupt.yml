          - { PARTICLE: { particle: "BLOCK_CRACK", block: "REDSTONE_WIRE", count: 8, who: "@Victim" } }
          - { DAMAGE: { amount: 1, who: "@Victim", wait: 40 } }
          - { PARTICLE: { particle: "BLOCK_CRACK", block: "REDSTONE_WIRE", count: 8, who: "@Victim" } }
      - condition: "%victim.type% == \"PLAYER\" && %victim.var.corrupt% == 0 && %victim.enchlevel.inversion% > 0"
        chance: 9
