# Matrix: 01-enchants-armor-a-l.md § Arrow Deflect
display: "Arrow Deflect"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eDeflects an arrow once the previous one has armed the guard."
trigger: DEFENSE
applies-to: [ARMOR]
group: "epic"
tier: epic
# era: ITEM_BREAK is the 1.8.9 spelling (random.break) — resolver alias; SPELL particle is fine.
# The strict arm -> deflect alternation (at best every second arrow, <=50% steady-state) is the measured
# mechanism and is reproduced, not treated as a bug: the arming window is level x 10t.
# Residual: the measured jar deleted the arrow entity; CANCEL negates the damage and leaves the arrow flying
# past — cosmetic only.
# Both blocks share one DEFENSE pass and a SET_VAR write lands in the store immediately, so the arm block's
# condition reads whatever the deflect block just wrote. That is why the deflect stamps a SPENT sentinel (2,
# ttl 1) rather than clearing the flag, and why the arm block excludes both 1 and 2: a cleared flag would read
# as "not armed" and the deflect would re-arm the guard on its way out, giving blanket arrow immunity instead
# of alternation. The sentinel elapses on the next tick, so the following arrow arms normally.
# ORDER IS LOAD-BEARING for the same reason: candidates run in authored order, so the deflect block has to stay
# FIRST at every rung — an arm evaluated first would arm and then deflect the very arrow that armed it.
# THE LETHAL SNIPER BYPASS (matrix 06 § Lethal Sniper, authored on THIS file): a Lethal Sniper arrow beats the
# deflect at `0.1 x its level`, 10-50 %. Shipped as a pre-roll subtraction on the deflect block — the shape
# Trap/Snare use for their Metaphysical rebates, distribution-identical to rolling the bypass separately. The
# read is `%victim.enchlevel.lethal-sniper%` because on a DEFENSE pass the "victim" IS the attacker, and a
# projectile hit resolves that to the SHOOTER, whose worn map spans the held bow. An ordinary archer reads 0,
# so the block stays at 100. A bypassed arrow does NOT consume the arming flag (a failed roll runs no effects),
# so the guard is still up for the next arrow inside its window.
levels:
  1:
    abilities:
      - chance: "100 - 10 * %victim.enchlevel.lethal-sniper%"
        condition: "%damagecause% == \"PROJECTILE\" && %arrowdeflect.armed% == 1"
        effects:
          - { CANCEL: {} }
          - { SET_VAR: { name: "arrowdeflect.armed", value: "2", ttl: 1, who: "@Self" } }
          - { PARTICLE: { particle: "SPELL", count: 20, who: "@Self" } }
          - { SOUND: { sound: "ENTITY_ITEM_BREAK", volume: 0.7, pitch: 0.2 } }
      - condition: "%damagecause% == \"PROJECTILE\" && %arrowdeflect.armed% != 1 && %arrowdeflect.armed% != 2"
        effects:
          - { SET_VAR: { name: "arrowdeflect.armed", value: "1", ttl: 10, who: "@Self" } }
  2:
    abilities:
      - chance: "100 - 10 * %victim.enchlevel.lethal-sniper%"
        condition: "%damagecause% == \"PROJECTILE\" && %arrowdeflect.armed% == 1"
        effects:
          - { CANCEL: {} }
          - { SET_VAR: { name: "arrowdeflect.armed", value: "2", ttl: 1, who: "@Self" } }
          - { PARTICLE: { particle: "SPELL", count: 20, who: "@Self" } }
          - { SOUND: { sound: "ENTITY_ITEM_BREAK", volume: 0.7, pitch: 0.2 } }
      - condition: "%damagecause% == \"PROJECTILE\" && %arrowdeflect.armed% != 1 && %arrowdeflect.armed% != 2"
        effects:
          - { SET_VAR: { name: "arrowdeflect.armed", value: "1", ttl: 20, who: "@Self" } }
  3:
    abilities:
      - chance: "100 - 10 * %victim.enchlevel.lethal-sniper%"
        condition: "%damagecause% == \"PROJECTILE\" && %arrowdeflect.armed% == 1"
        effects:
          - { CANCEL: {} }
          - { SET_VAR: { name: "arrowdeflect.armed", value: "2", ttl: 1, who: "@Self" } }
          - { PARTICLE: { particle: "SPELL", count: 20, who: "@Self" } }
          - { SOUND: { sound: "ENTITY_ITEM_BREAK", volume: 0.7, pitch: 0.2 } }
      - condition: "%damagecause% == \"PROJECTILE\" && %arrowdeflect.armed% != 1 && %arrowdeflect.armed% != 2"
        effects:
          - { SET_VAR: { name: "arrowdeflect.armed", value: "1", ttl: 30, who: "@Self" } }
  4:
    abilities:
      - chance: "100 - 10 * %victim.enchlevel.lethal-sniper%"
        condition: "%damagecause% == \"PROJECTILE\" && %arrowdeflect.armed% == 1"
        effects:
          - { CANCEL: {} }
          - { SET_VAR: { name: "arrowdeflect.armed", value: "2", ttl: 1, who: "@Self" } }
          - { PARTICLE: { particle: "SPELL", count: 20, who: "@Self" } }
          - { SOUND: { sound: "ENTITY_ITEM_BREAK", volume: 0.7, pitch: 0.2 } }
      - condition: "%damagecause% == \"PROJECTILE\" && %arrowdeflect.armed% != 1 && %arrowdeflect.armed% != 2"
        effects:
          - { SET_VAR: { name: "arrowdeflect.armed", value: "1", ttl: 40, who: "@Self" } }
