  3: { condition: *eligible, effects: [{ RESISTED_ROLL: { chance: 0.75, resistance-level: '%victim.sticky%', resist-per-level: 0.25 } }, *unequip] }
  4: { condition: *eligible, effects: [{ RESISTED_ROLL: { chance: 1.0, resistance-level: '%victim.sticky%', resist-per-level: 0.25 } }, *unequip] }
  5: { condition: *eligible, effects: [{ RESISTED_ROLL: { chance: 1.25, resistance-level: '%victim.sticky%', resist-per-level: 0.25 } }, *unequip] }
  6: { condition: *eligible, effects: [{ RESISTED_ROLL: { chance: 1.5, resistance-level: '%victim.sticky%', resist-per-level: 0.25 } }, *unequip] }
  7: { condition: *eligible, effects: [{ RESISTED_ROLL: { chance: 1.75, resistance-level: '%victim.sticky%', resist-per-level: 0.25 } }, *unequip] }
  8: { condition: *eligible, effects: [{ RESISTED_ROLL: { chance: 2.0, resistance-level: '%victim.sticky%', resist-per-level: 0.25 } }, *unequip] }