# Matrix: 03-enchants-swords.md § Disarmor
display: "Disarmor"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA slim chance to rip a piece of armor off a"
  - "&eplayer you have already beaten down to 10 HP."
trigger: ATTACK
applies-to: [SWORD]
group: "legendary"
tier: legendary
condition: "%victim.type% == \"PLAYER\" && %victim.health% <= 10.0"
# Chance is 0.25 pp per level, 0.25-2.0 % (L7 measured 0.017500000000000002), each rung carrying the Sticky
# rebate in its own expression: -0.25 pp per level of Sticky the victim wears, read through
# `%victim.enchlevel.sticky%`. The key is the file STEM, never the `enchants/sticky` stable key — the worn
# map is keyed by stem and an unknown key reads 0 in silence, so a stable-key spelling would rebate nothing
# forever. NO floor is authored, and none is wanted: an expression chance clamps to [0,100], and that 0
# bound IS the matrix's absolute immunity — Sticky at or above this enchant's level cancels the proc
# outright (kept). Sticky itself stays the effect-less roster marker; its whole payload is this clause.
# D-03-3 (as-intended): the jar rolled 0-3 against branches numbered 1-4, so a quarter of its procs stripped
# NOTHING (sound and messages still fired) and boots were unreachable. REMOVE_ARMOR draws uniformly over all
# four worn slots, which is the intent. It always drops the stripped piece; the jar tried the victim's
# inventory first and only dropped on overflow — D-03-17, a placement delta the primitive carries no param
# for.
# The jar's three stacked world-effect 2001 bursts at y+0/+1/+2 collapse into the single body-centred burst
# below, spread-y 1.5 covering the same column.
# {ATTACKER} and {VICTIM} are the engine's bound MESSAGE combat-party tokens, not unfilled placeholders.
# era: ANVIL_BREAK (legacy) <-> BLOCK_ANVIL_DESTROY (modern) — DESTROY, not BREAK, because 1.8's
# `random.anvil_break` is the shatter and modern `block.anvil.break` is the block-mining cue 1.8 answered
# with `dig.stone`. The row is in `Aliases.SOUND`, so the cue resolves on the 1.8 lane. World-effect 2001
# maps to BLOCK_CRACK plus block data, present on 1.8.9.
levels:
  1:
    chance: "0.25 - 0.25 * %victim.enchlevel.sticky%"
    effects:
      - { REMOVE_ARMOR: { who: "@Victim" } }
      - { SOUND: { sound: "BLOCK_ANVIL_DESTROY", volume: 1.0, pitch: 0.6 } }
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "DIAMOND_ORE", count: 24, spread: 0.4, spread-y: 1.5, who: "@Victim" } }
      - { MESSAGE: { text: "", who: "@Victim" } }
      - { MESSAGE: { text: "", who: "@Victim" } }
      - { MESSAGE: { text: "", who: "@Victim" } }
      - { MESSAGE: { text: "§6§l* DISARMORED *§7 (by: {ATTACKER})", who: "@Victim" } }
      - { MESSAGE: { text: "§7A random piece of your armor has been unequipped. Re-equip it quickly before you get KO'd!", who: "@Victim" } }
      - { MESSAGE: { text: "", who: "@Victim" } }
      - { MESSAGE: { text: "", who: "@Victim" } }
      - { MESSAGE: { text: "", who: "@Victim" } }
      - { MESSAGE: { text: "§a§l* DISARMED {VICTIM} *", who: "@Self" } }
