# Cosmic codex source: 03-enchants-swords.md — swords/Disarmor.java
display: Disarmor
description: A slight chance of removing one piece of armor from your enemy when they are at low health.
trigger:
- ATTACK
applies-to:
- SWORD
group: legendary
tier: legendary
stacking: HIGHEST
levels:
  1:
    condition: &eligible '%victim.type% == "PLAYER" && %victim.health% <= 10'
    effects:
      - { RESISTED_ROLL: { chance: 0.25, resistance-level: '%victim.sticky%', resist-per-level: 0.25 } }
      - &unequip
        REMOVE_ARMOR:
          destination: inventory
          victim-message: '&6&l* DISARMORED *&7 (by: {ATTACKER})'
          victim-description: "&7A random piece of your armor has been unequipped. Re-equip it quickly before you get KO'd!"
          attacker-message: '&a&l* DISARMED {VICTIM} *'
          blank-lines: 3
          sound: ANVIL_BREAK
          sound-volume: 1
          sound-pitch: 0.6
          block: DIAMOND_ORE
          block-height: 3
