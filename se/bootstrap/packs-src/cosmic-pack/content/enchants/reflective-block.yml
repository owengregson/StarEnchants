          - { MESSAGE: { text: "§c§l* {ATTACKER} REFLECTIVE BLOCK [§725% DMG§c§l]", who: "@Attacker" } }
          - { PARTICLE: { particle: "CRIT", count: 25, who: "@Self" } }
          - { PARTICLE: { particle: "SPELL_WITCH", count: 25, who: "@Attacker" } }
          - { SOUND: { sound: "ENTITY_ZOMBIE_ATTACK_IRON_DOOR", volume: 10.0, pitch: 2.0 } }
  2:
