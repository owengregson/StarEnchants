# Matrix: 02-enchants-armor-m-z.md § Spirit Link
display: "Spirit Link"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA melee hit you take feeds a share of"
  - "&ethat damage to nearby allies as health."
trigger: DEFENSE
applies-to: [CHESTPLATE]
group: "rare"
tier: rare
# era: ENTITY_EXPERIENCE_ORB_PICKUP is the 1.8.9 `random.orb` cue through the sound resolver; HEART
# resolves on both eras.
# The 4.0 HP ceiling is a two-block condition split (MULTI_ABILITY_ENCHANT), not a cap param: with
# divisor D = 4 x (6 - level) = 20/16/12/8/4 and threshold T = 4 x D = 80/64/48/32/16, block A heals
# %damage% / D below T and block B heals the flat 4.0 at or above it. The conditions are disjoint, so
# exactly one block rolls per event and the shared 10 x level chance stays a single roll.
# The wearer never heals themself — @Aoe excludes the activator, which is the measured behaviour.
# R-QC55: both hearts carry their recorded anchors. An entity-anchored burst centres on the body (feet +
# height/2, 0.9 on a standing player; a flat +1.0 on the 1.8 lane), so the ally heart's eye +0.35 is
# `dy: 1.07` and the wearer's feet +0.5 is `dy: -0.4`. Both sets are players — allies by the relation
# layer, the wearer by construction — so the player-sized arithmetic is exact on the modern lane.
# The heal is PER ALLY, never divided: a faction ball multiplies the total healing (measured).
# Ally = faction ally/member both ways with neither side in a duel (relation layer); chestplate-only and
# non-stacking (no `stacks:`, and the codex whitelist does not name it), so the highest worn level is the
# only one that fires — the R-QC63 default, enforced in WornResolver.
levels:
  1:
    abilities:
      - chance: 10
        condition: "%damagecause% == \"ENTITY_ATTACK\" && %damage% < 80"
        effects:
          - { MODIFY_HEALTH: { amount: "%damage% / 20", mode: "give", who: "@Aoe{r=2, filter=ALLIES}" } }
          - { PARTICLE: { particle: "HEART", count: 1, who: "@Aoe{r=2, filter=ALLIES}", dy: 1.07 } }
          - { PARTICLE: { particle: "HEART", count: 3, who: "@Self", dy: -0.4 } }
          - { SOUND: { sound: "ENTITY_EXPERIENCE_ORB_PICKUP", volume: 1.0, pitch: 0.35 } }
      - chance: 10
        condition: "%damagecause% == \"ENTITY_ATTACK\" && %damage% >= 80"
        effects:
