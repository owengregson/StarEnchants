    chance: 4.5
    effects:
      - { LIGHTNING: { damage: 10, who: "@Attacker" } }
      - { DAMAGE: { amount: 10.0, who: "@Attacker" } }
      - { VELOCITY: { mode: "away", strength: 1.5, who: "@Attacker" } }
