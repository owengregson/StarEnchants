      - { condition: "%distance% >= 0.625 && %distance% < 1.25", effects: [ { DAMAGE_MOD: { side: "attack", mode: "add", amount: 18 } } ] }
      - { condition: "%distance% >= 1.25 && %distance% < 1.875", effects: [ { DAMAGE_MOD: { side: "attack", mode: "add", amount: 13.5 } } ] }
      - { condition: "%distance% >= 1.875 && %distance% < 2.5", effects: [ { DAMAGE_MOD: { side: "attack", mode: "add", amount: 9 } } ] }
      - { condition: "%distance% >= 2.5 && %distance% < 3.75", effects: [ { DAMAGE_MOD: { side: "attack", mode: "add", amount: 4.5 } } ] }
  4:
    abilities:
      - { condition: "%distance% < 0.625", effects: [ { DAMAGE_MOD: { side: "attack", mode: "add", amount: 30 } } ] }
      - { condition: "%distance% >= 0.625 && %distance% < 1.25", effects: [ { DAMAGE_MOD: { side: "attack", mode: "add", amount: 24 } } ] }
      - { condition: "%distance% >= 1.25 && %distance% < 1.875", effects: [ { DAMAGE_MOD: { side: "attack", mode: "add", amount: 18 } } ] }
      - { condition: "%distance% >= 1.875 && %distance% < 2.5", effects: [ { DAMAGE_MOD: { side: "attack", mode: "add", amount: 12 } } ] }
      - { condition: "%distance% >= 2.5 && %distance% < 3.75", effects: [ { DAMAGE_MOD: { side: "attack", mode: "add", amount: 6 } } ] }
