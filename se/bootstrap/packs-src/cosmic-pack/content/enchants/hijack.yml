    condition: "%victim.type% == \"IRON_GOLEM\""
    effects:
      - { PARTICLE: { particle: "SPELL", count: 60, spread: 1.2, dy: 1, who: "@Victim" } }
      - { SOUND: { sound: "ENTITY_IRON_GOLEM_DEATH", volume: 1.0, pitch: 0.55 } }
      - { SUMMON_REBIND: { type: "IRON_GOLEM", ttl: 600, rise: 2, health: 110, name: "§b§l{OWNER}'s Guardian",
                           effects: "FIRE_RESISTANCE,REGENERATION,INCREASE_DAMAGE", steal: true, steal-radius: 24,
                           steal-message: "§5§l*** HIJACK (§7§m{FROM}§5§l -> §f{OWNER}§5§l) ***", who: "@Victim" } }
  4:
    chance: 32
    condition: "%victim.type% == \"IRON_GOLEM\""
    effects:
      - { PARTICLE: { particle: "SPELL", count: 60, spread: 1.2, dy: 1, who: "@Victim" } }
      - { SOUND: { sound: "ENTITY_IRON_GOLEM_DEATH", volume: 1.0, pitch: 0.55 } }
      - { SUMMON_REBIND: { type: "IRON_GOLEM", ttl: 600, rise: 2, health: 130, name: "§b§l{OWNER}'s Guardian",
                           effects: "FIRE_RESISTANCE,REGENERATION,INCREASE_DAMAGE,SPEED", steal: true, steal-radius: 24,
                           steal-message: "§5§l*** HIJACK (§7§m{FROM}§5§l -> §f{OWNER}§5§l) ***", who: "@Victim" } }
