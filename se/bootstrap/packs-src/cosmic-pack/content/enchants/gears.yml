# Matrix: 01-enchants-armor-a-l.md § Gears
display: "Gears"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eGrants Speed while the boots are worn."
trigger: PASSIVE
applies-to: [BOOTS]
group: "legendary"
tier: legendary
# R-QC63: on the codex's 14-name stacking whitelist (`02-enchants-armor-m-z.md` §0.3) — every worn piece
# fires with its OWN level. Everything else in this pack takes the engine default, one contribution per
# wearer at the highest worn level.
stacks: true
# The matrix's shared suppression ruling maps the corpus's noDefenseProcs to SUPPRESS(scope=TYPE, key=DEFENSE),
# which is live since R-QC3 (ADR-0075) and keys the DEFENDER SIDE — so it structurally cannot reach a PASSIVE
# ability, which belongs to no combat direction and is stamped with no type at all. That is the jar's own
# behaviour: cosmic silence never dropped worn passives. The flag stays anyway, because it is the broader
# guarantee — it also holds against the ENCHANT- and GROUP-scoped windows a TYPE stamp says nothing about, so
# this permanent worn buff is unsilenceable outright (the wearer's other enchants still are not).
suppress-immune: true
# Boots-only, so the `stacks: true` it carries can never actually grant more than one copy — the flag records
# the whitelist membership rather than buying anything. The potion registry reconciles against other Speed
# sources (an Ender Shift Speed IV-VI window
# outranks it, then this re-asserts). Equip/removal feedback is the shared potion-registry [+]/[-] pair:
#   §b§l[+] §b{enchant} {level}:§7 applying {effect} {level}
#   §c§l[-] §c{enchant} {level}:§7 removing {effect} {level}
# — one cross-cutting lang pair for every maintained potion, never per-enchant text.
levels:
  1:
    effects:
      # duration = maintained-while-worn: the passive driver re-derives the buff for as long as the boots are
      # worn and tears it down on unequip, so the authored tick count never governs.
      - { POTION: { effect: "SPEED", level: 1, duration: 200, who: "@Self" } }
  2:
    effects:
      - { POTION: { effect: "SPEED", level: 2, duration: 200, who: "@Self" } }
  3:
    effects:
      - { POTION: { effect: "SPEED", level: 3, duration: 200, who: "@Self" } }
