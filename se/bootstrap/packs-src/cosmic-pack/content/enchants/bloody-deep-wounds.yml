# Imported from EliteEnchantments (id: bloody-deep-wounds). Review before shipping.
display: "Bloody Deep Wounds"
description:
  - "&eAn extra chance to open a bleeding"
  - "&ewound, and every strike bites deeper"
  - "&efor heavy bonus damage."
  - "&c&l(!)&r &7Requires &aDeep Wounds"
trigger: ATTACK
applies-to: [WEAPON]
group: "mythic"
tier: mythic
requires: ["enchants/deep-wounds"]
removes-required: true  # the mythic upgrade supersedes its base counterpart (net-zero enchant slots)
levels:
  1:
    chance: 25
    cooldown: 60
    effects:
      - { SOUND: { sound: "ENTITY_PLAYER_ATTACK_STRONG", volume: 0.8, pitch: 0.9 } }
      - { PARTICLE: { particle: "DAMAGE_INDICATOR" } }
      # Before the DoT so it folds into the proc'ing hit (the DoT block's cumulative wait would otherwise delay it).
      - { DAMAGE_MOD: { side: "attack", mode: "flat", amount: 0.25 } } # frequent low-magnitude bite in raw hp (ADR-0050 R3 flat economy)
      # Bleed DoT: 3 iterations 1s apart. Inline wait is cumulative, so the ticks land at 20/40/60t,
      # each dealing 1/6 of the proc'ing hit plus Slowness II.
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "REDSTONE_BLOCK", count: 15, who: "@Victim", wait: 20 } }
      - { DAMAGE: { amount: "%damage% / 6", who: "@Victim" } }
      - { POTION: { effect: "SLOW", level: 2, duration: 20, who: "@Victim" } }
