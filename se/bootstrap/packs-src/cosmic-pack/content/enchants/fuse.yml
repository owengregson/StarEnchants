# Matrix: 06-enchants-tools-heroic.md § Fuse
# Roster marker (metaphysical.yml / sticky.yml precedent): the enchant is rollable, applicable and displayed,
# and the matrix decomposes it as an empty body — its whole meaning is one interaction rule on SOMEONE ELSE'S
# file. In-volume smelting for Detonate and Atomic Detonate requires BOTH Auto Smelt and Fuse on the tool
# (iron/gold ore -> ingot x the tool's Auto Smelt level, inside the blast), so the clause belongs on those two
# excavation entries and nothing is authored here.
# LIVE since R-QC10. The rule now has somewhere to live: `BREAK_BLOCK.smelt` gives an excavation volume the
# drop transform the MINE-scoped `SMELT` read-back could never reach (that flag addresses the ONE block a
# MINE event names, and a blast's blocks are broken by the sink). Both Detonate grades author it as
# `min(1, %actor.enchlevel.fuse%) * %actor.enchlevel.auto-smelt%` — a product that reads 0 without this
# marker and the Auto Smelt level with it, which IS the jar's `flag && flag1` co-enchant test and its
# `setAmount(autoSmeltLevel)` in one number. Nothing is authored here; the marker's whole job is to be worn
# so that product is non-zero, which is why the file still carries an empty body.
display: "Fuse"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eAlone it does nothing. Alongside Auto"
  - "&eSmelt, a detonating tool smelts the ore"
  - "&eit blasts out."
trigger: PASSIVE
# The jar's `pickaxe` item set — 5 pickaxes, deliberately NOT the 21 tools its Detonate partner rolls on, so a
# table-rolled Detonate spade or axe can never receive Fuse. Matrix-06 keeps the quirk; so does this.
applies-to: [PICKAXE]
group: "epic"
tier: epic
# Tier is not recorded in matrix-06 for the tool enchants (only the enchant-table weight, 6 here); the rung is
# the codex tier table's `fuse` 4, the same source doc 05's files used for their unrecorded acquisition rows.
# Detonate shares that rung — the pair sits three rungs above Auto Smelt's.
# interactions: the smelt rule above, carried by the excavation files. strings: none. era: none.
levels:
  # Max 1: the marker carries a level only so the lore line reads like every other enchant.
  1:
    effects: []
