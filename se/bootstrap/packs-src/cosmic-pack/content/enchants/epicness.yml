# Matrix: 03-enchants-swords.md § Epicness
display: "Epicness"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eYour hits land with a little extra flair."
trigger: ATTACK
applies-to: [SWORD]
group: "common"
tier: common
chance: 50  # flat 50 % at every level — level selects the cue pair, never the odds
# Purely cosmetic: no damage, no status, nothing but the sound/particle pair.
# The jar played the sound only to non-truce players within 16 blocks of the victim, and never to the victim
# itself. SOUND is location-scoped and audible to anyone in range — the ally-exclusion audio targeting is a
# cosmetic delta, dropped (noted; not gap-worthy).
# The L1 burst is recorded at the victim's eye height; the engine centres a per-target particle on the body.
# interactions: none of its own. strings: none.
# era: `CHICKEN_HURT` / `MAGMACUBE_WALK2` / `GHAST_SCREAM` (1.8.9) <-> `ENTITY_CHICKEN_HURT` /
# `ENTITY_MAGMA_CUBE_SQUISH` / `ENTITY_GHAST_SCREAM` (modern) — all three legacy-sweep rows have LANDED in
# `Aliases.SOUND`, so every cue resolves on the 1.8 lane. `SPELL_WITCH` is the 1.8 EnumParticle constant and
# `SLIME` <-> `ITEM_SLIME` is in the particle table; CLOUD is era-neutral.
levels:
  1:
    effects:
      - { SOUND: { sound: "ENTITY_CHICKEN_HURT", volume: 1.0, pitch: 0.85 } }
      - { PARTICLE: { particle: "CLOUD", count: 20, spread: 0.25, who: "@Victim" } }
  2:
    effects:
      - { SOUND: { sound: "ENTITY_MAGMA_CUBE_SQUISH", volume: 1.2, pitch: 0.8 } }
      - { PARTICLE: { particle: "SLIME", count: 20, spread: 1.0, who: "@Victim" } }
  3:
    effects:
      - { SOUND: { sound: "ENTITY_GHAST_SCREAM", volume: 1.0, pitch: 1.25 } }
      - { PARTICLE: { particle: "SPELL_WITCH", count: 15, spread: 0.95, who: "@Victim" } }
