    chance: 5
    effects:
      - { DAMAGE_MOD: { side: "defense", mode: "add", amount: 50 } }
      - { DAMAGE_CAP: { factor: 0.5, reflect: true, duration: 100, feedback: "§e§l* DIMINISH [§eMAX DMG: {damage}§l] *" } }
