# Matrix: 01-enchants-armor-a-l.md § Armored
display: "Armored"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eReduces damage taken from enemies holding a sword."
trigger: DEFENSE
applies-to: [ARMOR]
group: "legendary"
tier: legendary
# R-QC63: on the codex's 14-name stacking whitelist (`02-enchants-armor-m-z.md` §0.3) — every worn piece
# fires with its OWN level. Everything else in this pack takes the engine default, one contribution per
# wearer at the highest worn level.
stacks: true
# era: the diamond-block break cue on 1.8.9 is the legacy dig.stone sound family — resolver-mapped;
# BLOCK_CRACK particle is fine.
# The %damage% floor per level is 1 / (1 - reduction): the measured guard skips the reduction whenever it
# would land at or below 1.0 damage. Sword-material gate only — axes, bows and mobs bypass it.
levels:
  1:
    condition: "%victim.helditem% contains \"SWORD\" && %damage% > 1.0191"
    effects:
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "DIAMOND_BLOCK", count: 8, who: "@Self" } }
      - { SOUND: { sound: "BLOCK_STONE_BREAK", volume: 1, pitch: 1 } }
      - { DAMAGE_MOD: { side: "defense", mode: "add", amount: 1.875 } }
  2:
    condition: "%victim.helditem% contains \"SWORD\" && %damage% > 1.039"
    effects:
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "DIAMOND_BLOCK", count: 8, who: "@Self" } }
      - { SOUND: { sound: "BLOCK_STONE_BREAK", volume: 1, pitch: 1 } }
      - { DAMAGE_MOD: { side: "defense", mode: "add", amount: 3.75 } }
  3:
    condition: "%victim.helditem% contains \"SWORD\" && %damage% > 1.0596"
    effects:
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "DIAMOND_BLOCK", count: 8, who: "@Self" } }
      - { SOUND: { sound: "BLOCK_STONE_BREAK", volume: 1, pitch: 1 } }
      - { DAMAGE_MOD: { side: "defense", mode: "add", amount: 5.625 } }
  4:
    condition: "%victim.helditem% contains \"SWORD\" && %damage% > 1.0811"
    effects:
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "DIAMOND_BLOCK", count: 8, who: "@Self" } }
      - { SOUND: { sound: "BLOCK_STONE_BREAK", volume: 1, pitch: 1 } }
      - { DAMAGE_MOD: { side: "defense", mode: "add", amount: 7.5 } }
