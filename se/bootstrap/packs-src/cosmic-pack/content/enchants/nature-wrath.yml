# Matrix: 02-enchants-armor-m-z.md § Nature Wrath
display: "Nature Wrath"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eSpends souls to root, drain and weaken the hostile players"
  - "&earound you, and wipes every mob in range."
trigger: DEFENSE
applies-to: [ARMOR]
group: "soul"
tier: soul
condition: "%damagecause% == \"ENTITY_ATTACK\" || %damagecause% == \"PROJECTILE\""
soul-cost: 75  # flat at every level, charge-or-abort (the KOTH doubled 150 and its short (7+L)x5t windows are environment gates, not shipped)
no-souls-message: "§c§l** OUT OF SOULS **"
# The player payload targets hostile PLAYERS: the entry's FILTER_COMPOSE gap records "player-only hostile
# payloads here", and the wave-1 filter conjunction (ENEMIES+PLAYERS) now expresses exactly that — the mobs
# inside the same radius take the DESPAWN sweep instead of the root.
# The two mob-sweep bursts are authored BEFORE the sweep and carry the sweep's own selector body, so they
# resolve the mob set while it still exists (the per-mob closing cue). R-QC55: both are recorded at the
# mob's feet +1 y and neither takes a `dy` — an entity-anchored burst already centres on the body (feet +
# height/2, a flat +1.0 on the 1.8 lane), which lands within ~0.1 blocks of the record for a humanoid mob.
# `dy` translates by a FLAT distance, so it could not track the mob set's per-entity heights anyway.
# The recorded per-DoT-pulse cues — SOUND(GHAST_SCREAM2, 2.0, 2.0), PARTICLE(SPELL, 35) and the frozen
# victim's "§2§l** NATURE'S WRATH **" line — have no home on the frozen surface: FREEZE carries no per-pulse
# feedback hook, and moving the ROOTED body's DoT to PERIODIC_DAMAGE to get one would trade a refreshed window
# for a stacking burn. Dropped as cosmetics, recorded here. Same for the out-of-souls PARTICLE(LAVA, 20) and
# SOUND(ITEM_BREAK, 0.7, 0.4): a failed soul gate runs no effects, so no-souls-message carries that branch.
# R-QC2 binds both tokens. `{cost}` is the flat 75 on every rung — the KOTH doubling is an environment gate
# this port declines. `{souls}` subtracts it, because facts are populated before the gate-10 debit and the jar
# read the balance AFTER it; one activation charges once.
# Interactions carried by the OTHER side, nothing authored here: a live Soul Trap window (axes doc) blocks
# this proc. Frozen players cannot melee or shoot (engine freeze-lock), FREEZE scopes its root per target (the
# jar's global walk-speed enforcement is not replicated), and the jar's die-while-rooted speed leak is engine
# hygiene.
# ── THE POLTERGEIST FREEZE IMMUNITY IS PER TARGET (ADR-0076) ────────────────────────────────────────────────
# OWNER RULING, closing the ownership question this file used to answer the other way: a rebate belongs to the
# roll it rebates, so the immunity lives on the CONSUMER. `poltergeist.yml` keeps only the wearer's own fall
# cancel and publishes the level. D-07-13 makes the roll ONE uniform 12.5 % per Poltergeist level everywhere —
# 12.5 / 25 / 37.5 / 50 % — replacing the jar's test-vs-roll always-true reading (D-02-2).
# It rolls PER AoE MEMBER now, which is what the jar did and what this file used to record as unreachable.
# One ability per rung carries the whole package at its plain advertised chance; the FREEZE row and the immune
# line are the two arms of ONE draw per bystander (`%target.roll%`, memoised per body per ability), so they
# genuinely partition. The shape this replaces — two mutually exclusive abilities whose chances SUM to the
# advertised figure — could only ever adjudicate the DEFENSE pass's `%victim%`, the attacker who hit the
# wearer, and so spared or rooted the whole scan together. `%target.enchlevel.poltergeist%` keys on the file
# STEM and reads a real 0 for a body wearing none, which makes the immune arm unreachable for them and the
# ordinary case pay nothing for the split.
# THE IMMUNE BODY KEEPS THE DoT, which is the recorded rule: the jar's immunity skipped only its walk-speed
# and potion block, and its per-second damage task ran on an immune player for the full window. This port
# carries the rooted body's DoT on FREEZE (`dot:`), so a body dropped from the root would have lost it; the
# immune arm therefore authors the same burn on PERIODIC_DAMAGE — the same activator-attributed raw
# half-hearts, the same rate, the same window. The bolt, the Weakness, the mob sweep and the wearer's lines
# all land on an immune body too. RESIDUE: PERIODIC_DAMAGE stacks where FREEZE refreshes, so two procs
# landing on one immune body inside a window burn twice, where the jar's task skipped a body already under it.
# ONE DELTA SURVIVES, narrowed from the whole scan to nothing observable: ENDER_DRAGON_GROWL is recorded per
# FROZEN victim and plays at the activation point, so it sounds even on the rare proc where every bystander is
# immune. ADR-0066 already collapses its copies to one play per event, so the residue is one cue, not a count.
# The blocked line is the entry's own verbatim string, to the immune player. `{source}` has no token binding,
# so the consumer's own name is inlined (the batch-1 literal convention), which also makes the rendered line
# byte-identical to the matrix's.
# `sets/dimensional-traveler.yml` (and its crystal twin) carry the same per-target shape one layer up; Mother
# of Yijki cannot, its rebate sitting per STRIKE POINT inside a deferred payload.
# era: FREEZE's powder-snow presentation is 1.17+ and the legacy sink has no stand-in — it no-ops the pin
# and the vignette and lands the authored slow as an NMS movement-speed modifier, so 1.8 keeps DoT + slow;
# LEVEL_UP / ENDERDRAGON_GROWL (and the dropped GHAST_SCREAM2) are 1.8 sound ids the resolver maps, and
# EXPLOSION_LARGE / SPELL are the cross-era spellings of the jar's LARGE_EXPLODE / SPELL particles.
levels:
  # radius 8 + 5xL; window (7+L)x20 t; DoT L HP per 20 t (8/18/30/44 HP total); break-free 30 - 7.5xL %.
  1:
    chance: 0.4
    effects:
      - { LIGHTNING: { damage: 0, who: "@Aoe{r=13, filter=ENEMIES+PLAYERS}" } }  # cosmetic bolt per victim
      - { FREEZE: { duration: 160, dot: 1, dot-period: 20, slow: 100, breakout-chance: 22.5, who: "@Aoe{r=13, filter=ENEMIES+PLAYERS}",
            each-if: "%target.roll% >= 12.5 * %target.enchlevel.poltergeist%" } }
      # The complementary arm of the same draw: exactly the bodies the row above dropped.
      - { MESSAGE: { text: "§4§l* POLTERGEIST [§7Immune: Nature's Wrath§4§l] *", who: "@Aoe{r=13, filter=ENEMIES+PLAYERS}",
            each-if: "%target.roll% < 12.5 * %target.enchlevel.poltergeist%" } }
      # The immune body keeps the DoT the root carried: the jar's task ran on it regardless, and
      # PERIODIC_DAMAGE is the same activator-attributed raw burn at the same rate and window.
      - { PERIODIC_DAMAGE: { amount: 1, period: 20, duration: 160, who: "@Aoe{r=13, filter=ENEMIES+PLAYERS}",
            each-if: "%target.roll% < 12.5 * %target.enchlevel.poltergeist%" } }
      - { POTION: { effect: "WEAKNESS", level: 3, duration: 160, who: "@Aoe{r=13, filter=ENEMIES+PLAYERS}" } }
      - { PARTICLE: { particle: "EXPLOSION_LARGE", count: 10, who: "@Aoe{r=13, filter=MOBS}" } }
      - { PARTICLE: { particle: "SPELL", count: 35, who: "@Aoe{r=13, filter=MOBS}" } }
      - { DESPAWN: { who: "@Aoe{r=13, filter=MOBS}" } }  # D-02-3: silent removal, no drops and no XP (KILL would fire a real death)
      - { SOUND: { sound: "ENTITY_PLAYER_LEVELUP", volume: 1.0, pitch: 0.65 } }
      - { SOUND: { sound: "ENTITY_ENDER_DRAGON_GROWL", volume: 2.0, pitch: 2.0 } }  # recorded per frozen victim; ADR-0066 plays one sound id at most once per event, so the copies collapse into this single play
      - { MESSAGE: { text: "" } }
      - { MESSAGE: { text: "§a§l** NATURE'S WRATH **" } }
      - { MESSAGE: { text: "§c§l- {cost} Soul Gems", tokens: { cost: 75 } } }
      - { MESSAGE: { text: "§7You have §n{souls}§7 souls left.", tokens: { souls: "%actor.souls% - 75" } } }
      - { MESSAGE: { text: "" } }
  2:
    chance: 0.8
    effects:
      - { LIGHTNING: { damage: 0, who: "@Aoe{r=18, filter=ENEMIES+PLAYERS}" } }
      - { FREEZE: { duration: 180, dot: 2, dot-period: 20, slow: 100, breakout-chance: 15, who: "@Aoe{r=18, filter=ENEMIES+PLAYERS}",
            each-if: "%target.roll% >= 12.5 * %target.enchlevel.poltergeist%" } }
      - { MESSAGE: { text: "§4§l* POLTERGEIST [§7Immune: Nature's Wrath§4§l] *", who: "@Aoe{r=18, filter=ENEMIES+PLAYERS}",
            each-if: "%target.roll% < 12.5 * %target.enchlevel.poltergeist%" } }
      # The immune body keeps the DoT the root carried: the jar's task ran on it regardless, and
      # PERIODIC_DAMAGE is the same activator-attributed raw burn at the same rate and window.
      - { PERIODIC_DAMAGE: { amount: 2, period: 20, duration: 180, who: "@Aoe{r=18, filter=ENEMIES+PLAYERS}",
            each-if: "%target.roll% < 12.5 * %target.enchlevel.poltergeist%" } }
      - { POTION: { effect: "WEAKNESS", level: 3, duration: 180, who: "@Aoe{r=18, filter=ENEMIES+PLAYERS}" } }
      - { PARTICLE: { particle: "EXPLOSION_LARGE", count: 10, who: "@Aoe{r=18, filter=MOBS}" } }
      - { PARTICLE: { particle: "SPELL", count: 35, who: "@Aoe{r=18, filter=MOBS}" } }
      - { DESPAWN: { who: "@Aoe{r=18, filter=MOBS}" } }
      - { SOUND: { sound: "ENTITY_PLAYER_LEVELUP", volume: 1.0, pitch: 0.65 } }
      - { SOUND: { sound: "ENTITY_ENDER_DRAGON_GROWL", volume: 2.0, pitch: 2.0 } }
      - { MESSAGE: { text: "" } }
      - { MESSAGE: { text: "§a§l** NATURE'S WRATH **" } }
      - { MESSAGE: { text: "§c§l- {cost} Soul Gems", tokens: { cost: 75 } } }
      - { MESSAGE: { text: "§7You have §n{souls}§7 souls left.", tokens: { souls: "%actor.souls% - 75" } } }
      - { MESSAGE: { text: "" } }
  3:
    chance: 1.2
    effects:
      - { LIGHTNING: { damage: 0, who: "@Aoe{r=23, filter=ENEMIES+PLAYERS}" } }
      - { FREEZE: { duration: 200, dot: 3, dot-period: 20, slow: 100, breakout-chance: 7.5, who: "@Aoe{r=23, filter=ENEMIES+PLAYERS}",
            each-if: "%target.roll% >= 12.5 * %target.enchlevel.poltergeist%" } }
      - { MESSAGE: { text: "§4§l* POLTERGEIST [§7Immune: Nature's Wrath§4§l] *", who: "@Aoe{r=23, filter=ENEMIES+PLAYERS}",
            each-if: "%target.roll% < 12.5 * %target.enchlevel.poltergeist%" } }
      # The immune body keeps the DoT the root carried: the jar's task ran on it regardless, and
      # PERIODIC_DAMAGE is the same activator-attributed raw burn at the same rate and window.
      - { PERIODIC_DAMAGE: { amount: 3, period: 20, duration: 200, who: "@Aoe{r=23, filter=ENEMIES+PLAYERS}",
            each-if: "%target.roll% < 12.5 * %target.enchlevel.poltergeist%" } }
      - { POTION: { effect: "WEAKNESS", level: 3, duration: 200, who: "@Aoe{r=23, filter=ENEMIES+PLAYERS}" } }
      - { PARTICLE: { particle: "EXPLOSION_LARGE", count: 10, who: "@Aoe{r=23, filter=MOBS}" } }
      - { PARTICLE: { particle: "SPELL", count: 35, who: "@Aoe{r=23, filter=MOBS}" } }
      - { DESPAWN: { who: "@Aoe{r=23, filter=MOBS}" } }
      - { SOUND: { sound: "ENTITY_PLAYER_LEVELUP", volume: 1.0, pitch: 0.65 } }
      - { SOUND: { sound: "ENTITY_ENDER_DRAGON_GROWL", volume: 2.0, pitch: 2.0 } }
      - { MESSAGE: { text: "" } }
      - { MESSAGE: { text: "§a§l** NATURE'S WRATH **" } }
      - { MESSAGE: { text: "§c§l- {cost} Soul Gems", tokens: { cost: 75 } } }
      - { MESSAGE: { text: "§7You have §n{souls}§7 souls left.", tokens: { souls: "%actor.souls% - 75" } } }
      - { MESSAGE: { text: "" } }
  4:
    chance: 1.6
    effects:
      - { LIGHTNING: { damage: 0, who: "@Aoe{r=28, filter=ENEMIES+PLAYERS}" } }
      - { FREEZE: { duration: 220, dot: 4, dot-period: 20, slow: 100, breakout-chance: 0, who: "@Aoe{r=28, filter=ENEMIES+PLAYERS}",
            each-if: "%target.roll% >= 12.5 * %target.enchlevel.poltergeist%" } }  # the exact-0 break-free at max level is measured, shipped
      - { MESSAGE: { text: "§4§l* POLTERGEIST [§7Immune: Nature's Wrath§4§l] *", who: "@Aoe{r=28, filter=ENEMIES+PLAYERS}",
            each-if: "%target.roll% < 12.5 * %target.enchlevel.poltergeist%" } }
      # The immune body keeps the DoT the root carried: the jar's task ran on it regardless, and
      # PERIODIC_DAMAGE is the same activator-attributed raw burn at the same rate and window.
      - { PERIODIC_DAMAGE: { amount: 4, period: 20, duration: 220, who: "@Aoe{r=28, filter=ENEMIES+PLAYERS}",
            each-if: "%target.roll% < 12.5 * %target.enchlevel.poltergeist%" } }
      - { POTION: { effect: "WEAKNESS", level: 3, duration: 220, who: "@Aoe{r=28, filter=ENEMIES+PLAYERS}" } }
      - { PARTICLE: { particle: "EXPLOSION_LARGE", count: 10, who: "@Aoe{r=28, filter=MOBS}" } }
      - { PARTICLE: { particle: "SPELL", count: 35, who: "@Aoe{r=28, filter=MOBS}" } }
      - { DESPAWN: { who: "@Aoe{r=28, filter=MOBS}" } }
      - { SOUND: { sound: "ENTITY_PLAYER_LEVELUP", volume: 1.0, pitch: 0.65 } }
      - { SOUND: { sound: "ENTITY_ENDER_DRAGON_GROWL", volume: 2.0, pitch: 2.0 } }
      - { MESSAGE: { text: "" } }
      - { MESSAGE: { text: "§a§l** NATURE'S WRATH **" } }
      - { MESSAGE: { text: "§c§l- {cost} Soul Gems", tokens: { cost: 75 } } }
      - { MESSAGE: { text: "§7You have §n{souls}§7 souls left.", tokens: { souls: "%actor.souls% - 75" } } }
      - { MESSAGE: { text: "" } }
