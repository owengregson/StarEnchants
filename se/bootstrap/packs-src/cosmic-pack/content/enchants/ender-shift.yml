# Cosmic codex: 01-enchants-armor-a-l.md — armor/EnderShift.java
display: Ender Shift
description: Cancels an otherwise lethal hit, grants escape buffs, and prevents attacking during the escape window.
trigger: DEFENSE
applies-to: [HELMET, BOOTS]
group: unique
tier: unique
stacking: HIGHEST
levels:
  1:
    abilities:
      - trigger: DEFENSE
        cooldown: 600
        condition: "%actor.health% - %finaldamage% <= 0"
        effects: &shift1
          - { CANCEL: {} }
          - { SET_VAR: { name: ender-shifted, value: 1, ttl: 170 } }
          - { POTION: { effect: NIGHT_VISION, level: 1, duration: 160 } }
          - { POTION: { effect: SPEED, level: 4, duration: 160, force: true } }
          - { POTION: { effect: JUMP, level: 1, duration: 160, force: true } }
          - { POTION: { effect: ABSORPTION, level: 4, duration: 160 } }
          - { MESSAGE: { text: "" } }
          - { MESSAGE: { text: "&d&l(!) &dYou were about to die, so you have entered the Ender dimension, escape to safety!" } }
          - { MESSAGE: { text: "" } }
          - { SOUND: { sound: ENTITY_ENDER_DRAGON_GROWL, volume: 1, pitch: 0.54 } }
          - { PARTICLE: { particle: SPELL_WITCH, count: 100, speed: 1.25, spread: 2, anchor: feet, who: "@Self" } }
          - { PARTICLE: { particle: SPELL_WITCH, count: 100, speed: 1.25, spread: 2, anchor: feet, who: "@Self", wait: 170 } }
      - trigger: [ATTACK, BOW, BOW_FIRE, TRIDENT]
        condition: "%ender-shifted% > 0"
