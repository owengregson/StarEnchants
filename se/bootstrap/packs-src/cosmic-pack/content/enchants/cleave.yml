# Matrix: 04-enchants-axes.md § Cleave
display: "Cleave"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA landed hit splashes onto everyone else"
  - "&estanding around your target."
trigger: ATTACK
applies-to: [AXE]
group: "epic"
tier: epic
condition: "%damage% > 0"
cooldown: 30  # the jar's 1500 ms attacker throttle
cooldown-per-victim: true  # R-QC8: the recorded pacing is PER TARGET, so the bucket keys on the struck entity (thundering-blow.yml's shape)
# The splash is centred on the VICTIM — AOE resolves around the combat target — and the victim is never in it:
# the jar used the victim as the search origin and skipped it, which `exclude=victim` reproduces exactly.
# Shape delta, values kept: the jar's number is a bounding-box half-extent, AOE's is a sphere radius, so the
# corner reach differs slightly at the same figure.
# D-04-8: the jar's splash was attacker-less generic damage — armour-reduced, NO kill credit, and it re-entered
# the defensive pass only (`00-MECHANICS.md` §3.5 mode B). Engine DAMAGE is activator-attributed, so a splash
# kill now credits the swinger.
# TWO PACINGS, both now the recorded ones. `cooldown-per-victim` (R-QC8) keys the ability's own 30 t attacker
# throttle on the player actually STRUCK, so chasing a second enemy no longer waits on the first. The jar's
# other stamp — 20 t (1000 ms) on each SPLASH member, who is a selector target of one activation and never a
# cooldown key — is `each-cooldown: 20` on the DAMAGE row (ADR-0076): it stamps the resolved body in the
# cooldown store's existing per-victim dimension, under a target bucket gate 6 never produces, so a bystander
# inside their own window is dropped from this splash and neither window can collide with the other.
# The heroic twin shares a mutual 20 t exclusion window with this one, authored from the HEROIC side (batch 06)
# as SUPPRESS(scope=ENCHANT, key=enchants/cleave, duration=20, who=@Self) — nothing is owed here.
# Not ported: the mcMMO Skull Splitter hook (external plugin — with it gone the jar's
# cooldown-consumed-on-a-suppressed-hit quirk has no analogue) and two console log lines. The jar's faction
# and duel sparing rides the ENEMIES filter's single ally model; spectator-flagged entities are exempt natively.
# era: none — no sounds, no particles.
levels:
  # Radius 0.45 x level; splash damage 1 (L1-3) / 2 (L4-6) / 3 (L7). Only those two ladders move.
  1:
    effects:
      - { DAMAGE: { amount: 1, who: "@Aoe{r=0.45, filter=ENEMIES, exclude=victim}", each-cooldown: 20 } }
  2:
    effects:
      - { DAMAGE: { amount: 1, who: "@Aoe{r=0.90, filter=ENEMIES, exclude=victim}", each-cooldown: 20 } }
  3:
    effects:
      - { DAMAGE: { amount: 1, who: "@Aoe{r=1.35, filter=ENEMIES, exclude=victim}", each-cooldown: 20 } }
  4:
    effects:
      - { DAMAGE: { amount: 2, who: "@Aoe{r=1.80, filter=ENEMIES, exclude=victim}", each-cooldown: 20 } }
  5:
    effects:
      - { DAMAGE: { amount: 2, who: "@Aoe{r=2.25, filter=ENEMIES, exclude=victim}", each-cooldown: 20 } }
  6:
    effects:
      - { DAMAGE: { amount: 2, who: "@Aoe{r=2.70, filter=ENEMIES, exclude=victim}", each-cooldown: 20 } }
  7:
    effects:
      - { DAMAGE: { amount: 3, who: "@Aoe{r=3.15, filter=ENEMIES, exclude=victim}", each-cooldown: 20 } }
