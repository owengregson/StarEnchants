# Matrix: 01-enchants-armor-a-l.md § Clarity
display: "Clarity"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eBlindness is scrubbed off you"
  - "&ealmost as fast as it lands."
trigger: REPEATING
applies-to: [ARMOR]
group: "legendary"
tier: legendary
repeat: 3  # scan period, level-independent
# Grace window: the matrix's interactions line is the authority (its activation line's %clarity.grace%
# condition is not an authorable fact) — the grace is a SUPPRESS(scope=ENCHANT, key=enchants/clarity),
# armed here on @Self so gate 5 holds off the 3-tick re-fire for one blindness window. Durations are the
# per-level blindness the enchant is graced against (matrix 03 § Blind, 30/60/90 t).
levels:
  1:
    effects:
      - { REMOVE_POTION: { effect: "BLINDNESS", who: "@Self" } }
      # FIZZ on 1.8.9 is random.fizz; SPELL is fine there — resolver-mapped
      - { SOUND: { sound: "BLOCK_FIRE_EXTINGUISH", volume: 1.0, pitch: 0.6 } }
      - { PARTICLE: { particle: "SPELL", count: 20, who: "@Self" } }
      - { SUPPRESS: { scope: "ENCHANT", key: "enchants/clarity", duration: 30, who: "@Self" } }
  2:
    effects:
      - { REMOVE_POTION: { effect: "BLINDNESS", who: "@Self" } }
      - { SOUND: { sound: "BLOCK_FIRE_EXTINGUISH", volume: 1.0, pitch: 0.6 } }
      - { PARTICLE: { particle: "SPELL", count: 20, who: "@Self" } }
      - { SUPPRESS: { scope: "ENCHANT", key: "enchants/clarity", duration: 60, who: "@Self" } }
  3:
    effects:
      - { REMOVE_POTION: { effect: "BLINDNESS", who: "@Self" } }
      - { SOUND: { sound: "BLOCK_FIRE_EXTINGUISH", volume: 1.0, pitch: 0.6 } }
      - { PARTICLE: { particle: "SPELL", count: 20, who: "@Self" } }
      - { SUPPRESS: { scope: "ENCHANT", key: "enchants/clarity", duration: 90, who: "@Self" } }
