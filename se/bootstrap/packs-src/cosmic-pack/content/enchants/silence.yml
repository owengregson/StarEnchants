# Matrix: 03-enchants-swords.md § Silence
display: "Silence"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA chance to silence a player's defensive enchants;"
  - "&eSolitude on the same weapon widens both the odds and the window."
trigger: [ATTACK, BOW]
applies-to: [SWORD, BOW]
group: "legendary"
tier: legendary
# Solitude is read as `%actor.enchlevel.solitude%` — the wielder's own Solitude level, 0 when they carry
# none. `enchlevel` keys on the file STEM (`solitude`, never the `enchants/solitude` stable key: the worn map
# is stem-keyed and an unknown key reads 0 in silence), and its map is built from the SAME resolved equipment
# the trigger fires off — armour plus the held hands, non-armour held items included — so a Solitude sword in
# the swinging hand is read while it is held, exactly the state the matrix's HELD marker stood in for. That
# retires the marker: solitude.yml needs no SET_VAR, and the un-hold teardown SET_VAR never had is moot,
# because an unheld sword leaves the worn state at the next equipment resolve.
# RECORDED DELTA — the jar required Solitude on the SAME item as Silence. This read is per-WIELDER, not
# per-item, so a Solitude sword in the OFF hand also boosts (nothing else can carry it: `applies-to: [SWORD]`
# keeps it off armour, and a held armour piece is not equipped at all). It also lets a Silence BOW be
# boosted, which under the same-item rule could never happen. Both need the player to give up their off hand
# to a second sword; the surface has no per-item read to narrow it.
# Both the odds and the window ladder on that level — chance (L+S) x 2 %, window (L+S) x 20 t — so the four
# blocks per level ARE the S = 0..3 ladder. A condition takes at most one ':' clause and a clause never
# gates, so the matrix's `+N %chance%` boosts are folded into each block's own chance instead: exactly one
# block is eligible per hit, so it is still a single roll.
# The suppression channel is the shared one: Mastery Tombstone (07) rides it, Phoenix carries a self-scoped
# SUPPRESS_IMMUNE (layer rule `phoenix-immune-to-defense-suppression`), and the Dragon Slayer set's
# immune_silence is SUPPRESS_IMMUNE(chance=75) — the measured 25% leak IS that primitive's per-suppression
# roll. On such a block the ATTACKER sees `§c§l* SILENCE BLOCKED [§7{VICTIM}§c§l] *`; SUPPRESS_IMMUNE carries
# no feedback hook on the frozen surface, so that line is recorded here and authored with the immunity side.
# ENGINE SEAM (report, not a stop): scope=TYPE arms a window keyed on "DEFENSE", but no content ability
# carries a type scope today (`cdScopeType` is null for every enchant/set/crystal — ADR-0016 deferred), so
# gate 5 cannot match it yet. The corpus already commits to this shape: the eight maintained passives that
# shipped in batches 1-2 carry `suppress-immune: true` precisely to survive it.
# Ledger D-03-10: the jar ALSO gave a silenced victim x0.75 incoming damage — a reward for being silenced,
# almost certainly an inverted sign. Suppression only ships; no damage modifier.
# Single-pass per D-001: the jar's pass-2 50% environmental leak through a live Silence is a double-fire
# artifact, so the window here is unconditional. SUPPRESS's timed window also refreshes cleanly, replacing the
# jar's overlapping-proc bug where the first expiry task cut a refreshed silence short.
# The S = 0 test is a plain `== 0`: unlike an unset actor-scoped var (NaN, which the `!=` chains elsewhere in
# the pack exist to dodge), an absent enchant reads a real 0 — the lookup returns the map's default, never a
# missing value.
# {SECONDS} is (L + S), a per-block constant, so it is inlined and the rendered line is byte-identical to the
# matrix string `§5§l* SILENCED §7[{SECONDS}s] §5§l*`.
# era: `WITHER_HURT` (1.8.9) <-> `ENTITY_WITHER_HURT` (flattened 1.13) needs a legacy alias row — Aliases.SOUND
# does not carry it yet, so the cue would warn-skip on the legacy fork (parked on the deferred-content
# legacy-sweep list). ENCHANTMENT_TABLE is the cross-era spelling the particle resolver maps (ENCHANT since the
# 1.20.5 registry rename); PORTAL is fine on 1.8.9.
levels:
  1:
    abilities:
      # Solitude 0: chance 2%, window 20 t.
      - chance: 2
        condition: "%victim.type% == \"PLAYER\" && %actor.enchlevel.solitude% == 0"
        effects:
          - { SUPPRESS: { scope: "TYPE", key: "DEFENSE", duration: 20, mode: "timed", who: "@Victim" } }
          - { SOUND: { sound: "ENTITY_WITHER_HURT", volume: 1.0, pitch: 0.25 } }
          - { PARTICLE: { particle: "ENCHANTMENT_TABLE", count: 80, spread: 0.4, who: "@Victim" } }
          - { PARTICLE: { particle: "PORTAL", count: 60, spread: 0.4, who: "@Victim" } }
          - { MESSAGE: { text: "§5§l* SILENCED §7[1s] §5§l*", who: "@Victim" } }
          # The expiry burst repeats the pair LAST: a wait tier ACCUMULATES down the effect list, so only the
          # first burst line carries the wait and the PORTAL line rides that same tier (a second wait: here
          # would stack to 2x the window).
          - { PARTICLE: { particle: "ENCHANTMENT_TABLE", count: 80, spread: 0.4, who: "@Victim", wait: 20 } }
          - { PARTICLE: { particle: "PORTAL", count: 60, spread: 0.4, who: "@Victim" } }
