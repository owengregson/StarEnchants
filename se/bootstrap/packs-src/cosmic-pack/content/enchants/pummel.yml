# Matrix: 04-enchants-axes.md § Pummel
display: "Pummel"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eA melee hit staggers everyone crowding"
  - "&earound your target — never the target."
trigger: ATTACK
applies-to: [AXE]
group: "rare"
tier: rare
# Bystanders only: the jar searches around the VICTIM and the victim is never in their own result, which
# `exclude=victim` reproduces exactly. No victim-type gate — mobs caught in the splash are slowed too, and
# they get neither the ally test nor the Metaphysical rebate (jar behaviour; ENEMIES admits hostile mobs).
# The jar's ally test is Factions TRUCE-or-better, looser than Bleed/Cleave's mutual-ally test; the engine's
# single ally model under `filter=ENEMIES` absorbs both readings.
# Shape delta, recorded not fixed: the jar's radius is a box half-extent, the engine's `r` a sphere radius.
# THE METAPHYSICAL VETO IS PER TARGET (ADR-0076, R-QC69a). The rebate is a property of the BYSTANDER under
# test, not of the activation, so it rides `each-chance:` on the splash row and the ability's `chance:` is the
# plain 6 pp-per-level ladder again. Each body draws once (`%target.roll%`, memoised per body per ability) and
# survives at `100 - 4 x L` %: -4 pp per level of Metaphysical, plus a SECOND term at the same coefficient for
# the heroic grade, which publishes its own stem (`polymorphic-metaphysical`) rather than feeding this one.
# Owner ruling: additive, not highest-of-the-two — both grades are boots-only and the contract keeps them off
# one item, so the sum is unreachable in play. The key is the file STEM, never the `enchants/metaphysical`
# stable key: the worn map is keyed by stem and an unknown key reads 0 in silence, so a stable-key spelling
# would compile and rebate nothing forever. No floor — the [0,100] clamp is the bound, as on Snare/Disarmor.
# BALANCE DELTA, confirmed by R-QC69a and carried in deviations.md: the shield NARROWS. It used to be one
# whole-splash veto keyed to the struck victim (who is `exclude=victim` and never in their own splash), so one
# Metaphysical wearer spared the entire crowd; now a wearer spares only themselves. That is D-04-13's ruling —
# the jar mutated a shared threshold inside its target loop, and the per-body reading is the as-intended one —
# and it is strictly a nerf to Metaphysical.
# The blocked line is the complementary arm of the SAME draw: a body that survives takes the slow, a body that
# does not is told why. Two rows over one draw genuinely partition, which is what the pre-roll subtraction
# could never do (it yielded one roll and no moment to report).
# era: legacy `SLOW` potion name — the resolver aliases it to the modern `SLOWNESS` in BOTH directions, so
# either spelling loads on either lane; this pack authors both (`SLOW` here, `SLOWNESS` on bleed, deep-bleed
# and plague-carrier). BLOCK_CRACK and STONE are both safe on 1.8.9.
levels:
  # chance 6 pp per level; radius = level; SLOW at engine level = enchant level (the jar's amplifier level-1
  # IS the I/II/III tier). Duration is the AS-INTENDED 1.5 s x level = 30/60/90 t (D-04-12); the jar's
  # `(int)(level * 1.5)` seconds truncated to 20/60/80 t.
  1:
    chance: 6
    effects:
      - { POTION: { effect: "SLOW", level: 1, duration: 30, who: "@Aoe{r=1,filter=ENEMIES,exclude=victim}",
            each-chance: "100 - 4 * %target.enchlevel.metaphysical% - 4 * %target.enchlevel.polymorphic-metaphysical%" } }
      # The exact complement of the row above, over the SAME draw — so a vetoed bystander is told, and a
      # slowed one never is. Verbatim; the wearer sees nothing (the jar told the blocked party only).
      - { MESSAGE: { text: "§8§l** METAPHYSICAL (§8Pummel blocked!§l) **", who: "@Aoe{r=1,filter=ENEMIES,exclude=victim}",
            each-if: "%target.roll% >= 100 - 4 * %target.enchlevel.metaphysical% - 4 * %target.enchlevel.polymorphic-metaphysical%" } }
      # The jar plays the block-break world effect at the VICTIM's feet + 0.5 (block id = whatever they stand
      # in, STONE when that is air) once per affected bystander: `dy: -0.4` is that point off the engine's
      # body-centre anchor (feet + 0.9 standing). RESIDUE — one `who` both picks the targets and anchors the
      # burst, so the per-bystander REPEAT is unspellable: one burst ships, and it plays even when the splash
      # caught nobody. A dynamic block param is not expressible either, so STONE ships flat — cosmetic only.
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "STONE", who: "@Victim", dy: -0.4 } }
  2:
    chance: 12
    effects:
      - { POTION: { effect: "SLOW", level: 2, duration: 60, who: "@Aoe{r=2,filter=ENEMIES,exclude=victim}",
            each-chance: "100 - 4 * %target.enchlevel.metaphysical% - 4 * %target.enchlevel.polymorphic-metaphysical%" } }
      - { MESSAGE: { text: "§8§l** METAPHYSICAL (§8Pummel blocked!§l) **", who: "@Aoe{r=2,filter=ENEMIES,exclude=victim}",
            each-if: "%target.roll% >= 100 - 4 * %target.enchlevel.metaphysical% - 4 * %target.enchlevel.polymorphic-metaphysical%" } }
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "STONE", who: "@Victim", dy: -0.4 } }
  3:
    chance: 18
    effects:
      - { POTION: { effect: "SLOW", level: 3, duration: 90, who: "@Aoe{r=3,filter=ENEMIES,exclude=victim}",
            each-chance: "100 - 4 * %target.enchlevel.metaphysical% - 4 * %target.enchlevel.polymorphic-metaphysical%" } }
      - { MESSAGE: { text: "§8§l** METAPHYSICAL (§8Pummel blocked!§l) **", who: "@Aoe{r=3,filter=ENEMIES,exclude=victim}",
            each-if: "%target.roll% >= 100 - 4 * %target.enchlevel.metaphysical% - 4 * %target.enchlevel.polymorphic-metaphysical%" } }
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "STONE", who: "@Victim", dy: -0.4 } }
