# Matrix: 04-enchants-axes.md § Reforged
display: "Reforged"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eSwinging or mining can grind a point of"
  - "&ewear back out of the tool in your hand."
trigger: [ATTACK, MINE]
# applies-to is the jar's weapons-and-tools item set spelled out (5 swords + 5 axes + bow + 5 pickaxes +
# 5 hoes + 5 SPADES) — wider than the axes folder it lives in. The spades were missing until R-QC37: doc 04's
# own registration line trails off at "(+ further tools)", and the two item-set appendices spell it out —
# `15-shared-library-utilities.md:232` and `09-…:2730` both list `weapons_and_tools` as 31 entries / 26
# distinct, spades at positions 22-26 (the duplicated axe block is a jar artifact with no membership
# consequence; `applies-to` is a set). Neither composite fits: WEAPON would add crossbow, trident and mace,
# which the jar's 1.7/1.8 Material set had none of. `[TOOL, SWORD, BOW]` would be equivalent (TOOL is
# PICKAXE u AXE u SHOVEL u HOE), but the explicit list stays closer to the jar's literal array.
applies-to: [SWORD, AXE, BOW, PICKAXE, HOE, SHOVEL]
group: "rare"
tier: rare
# One ability per level on BOTH triggers: a level's plain `effects:` list inherits the enchant's whole trigger
# list, so melee hits and block breaks share one roll and one cooldown bucket — the jar's single proc path.
# (Its BlockDamageEvent path is discarded dead work and is not ported.)
# No condition: the jar's `getDurability() != 0 && getMaxStackSize() == 1` guards bought nothing the engine
# does not already do — a restore on a pristine or non-damageable held item is a natural no-op.
# The codex flags UNRESOLVED whether the jar's restore even lands (the patched-CraftBukkit `modifyDurability`
# return value is discarded). Shipped as a working 1-point restore; no ledger row is possible without a
# measured baseline to diverge from.
# interactions: none. strings: none.
# era: the durability model (legacy `short` damage vs modern `Damageable`) is absorbed by DURABILITY.
levels:
  # Highest max level and highest proc rate in the package — chance 8 pp per level to 80 %; restore flat 1.
  1:
    chance: 8
    effects:
      - { DURABILITY: { amount: 1, target: "item", mode: "restore", who: "@Self" } }
