# Matrix: 04-enchants-axes.md § Bleed
display: "Bleed"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eYour hits pile bleed stacks on a target —"
  - "&emobs bleed slower, and other enchants feed on them."
trigger: ATTACK
applies-to: [AXE]
group: "epic"
tier: epic
# THE bleedstacks publisher. This file is the only writer that starts the counter every other bleed consumer
# reads: swords/Deep Wounds folds +0.5 pp per stack, §Devour folds +1.5 pp per stack and gates on > 0, the
# heroic Deep Bleed adds to the SAME counter with its own walk-speed coefficient (shared-counter rule — one
# name, whoever adds the stack decides that write's curve), and armor/Blood Lust hangs its ally-heal roll off
# each stack added to a player (its own file, still blocked on tagged PROXIMITY_EVENT). §Blessed is the sole
# remover.
# The matrix's STACK_COUNTER and VICTIM_VAR_FACT gaps are CLOSED — `SET_VAR op=increment` with step/cap is the
# counter, `%victim.var.<name>%` is the read (both wave 1; the gap block is a batch-1 snapshot).
# Ordering is load-bearing: the gate reads the counter BEFORE the hit (`< 20`, pre-increment), while the rows
# under it read it AFTER — SET_VAR writes straight through to the var store and an expression parameter is
# evaluated when its effect runs. So the increment must stay the FIRST row, exactly as the jar increments and
# then derives. Derived step `i = max(1, floor(stacks / 2))`: D-04-5 ships the as-intended `max(1, ...)`, since
# the jar's bare `stacks / 2` made the first stack a no-op (walk speed 0.2, SLOW 0 t) — the one-line divergence
# from heroic Deep Bleed, which has the guard.
# `ttl: 0` is the recorded no-decay lifetime (D-04-6): stacks only ever leave by death or a Blessed proc. The
# engine's death sweep drops a MOB's vars; a PLAYER's survive death today, so the death half of D-04-6 is
# pending (deferred-content.md).
# Player and mob victims take different debuffs, which one ability cannot branch on — so each level carries
# two, gated on mutually exclusive victim types. The level's chance applies to both and only one gate can ever
# pass, so a hit still rolls once: "stack added" and "debuff applied" stay the single outcome they are in the
# jar, instead of the two independent rolls a non-exclusive split would give.
# PENDING DERIVED HOLD — the player-side slow is NOT authored: `MOVEMENT_SPEED(speed = 0.2 - 0.005 * i)` is
# recorded as held for as long as stacks live, and the surface has no unbounded form (`ticks` is a finite span
# and 0 reverts on the spot), so shipping it would mean inventing a window the matrix never records. The mob
# branch below has a finite duration and ships in full. Tracked in deferred-content.md under partial entries.
# The 15-per-burst particle count is port-chosen: the jar plays the countless block-break world effect once per
# repeat, `max(1, i / 2)` repeats, which is folded into the one count expression.
# era: REDSTONE_BLOCK and the BLOCK_CRACK crack burst both resolve on 1.8.9, and `SLOW` -> `SLOWNESS` is
# already in the alias map. Blood Lust's DRIP_LAVA / EAT cues are the armour doc's sweep, not this file's.
levels:
  # Chance 8 x level + 40. Everything downstream is level-INDEPENDENT — level buys frequency only, and the cap
  # is 20 at every level (the jar's per-level cap getter is dead code; measured = intended).
  1:
    chance: 48
    abilities:
      - condition: "%damage% > 0 && %victim.var.bleedstacks% < 20 && %victim.type% == \"PLAYER\""
        effects:
          - { SET_VAR: { name: "bleedstacks", op: "increment", step: 1, cap: 20, ttl: 0, who: "@Victim" } }
          - { PARTICLE: { particle: "BLOCK_CRACK", block: "REDSTONE_BLOCK", count: "15 * max(1, floor(max(1, floor(%victim.var.bleedstacks% / 2)) / 2))", who: "@Victim" } }
      - condition: "%damage% > 0 && %victim.var.bleedstacks% < 20 && %victim.type% != \"PLAYER\""
        effects:
          - { SET_VAR: { name: "bleedstacks", op: "increment", step: 1, cap: 20, ttl: 0, who: "@Victim" } }
          # Jar amplifier `max(1, i / 3)`; the engine's level is that amplifier + 1, so Slowness II at one
          # stack up to IV at the cap;
          # duration `i * 20` t, re-applied by every later stack (how an overlapping application settles is
          # the engine's POTION semantics, not this file's).
          - { POTION: { effect: "SLOWNESS", level: "max(1, floor(max(1, floor(%victim.var.bleedstacks% / 2)) / 3)) + 1", duration: "max(1, floor(%victim.var.bleedstacks% / 2)) * 20", who: "@Victim" } }
          - { PARTICLE: { particle: "BLOCK_CRACK", block: "REDSTONE_BLOCK", count: "15 * max(1, floor(max(1, floor(%victim.var.bleedstacks% / 2)) / 2))", who: "@Victim" } }
