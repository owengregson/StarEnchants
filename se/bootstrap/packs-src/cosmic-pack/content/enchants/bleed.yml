# Imported from EliteEnchantments (id: bleed). Review before shipping.
display: "Bleed"
description:
  - "&eYour strikes can open a bleeding"
  - "&ewound; the victim bleeds and slows"
  - "&eover several seconds."
trigger: ATTACK
applies-to: [AXE]
group: "epic"
tier: epic
levels:
  1:
    chance: 6
    cooldown: 100
    effects:
      - { SOUND: { sound: "ENTITY_PLAYER_ATTACK_SWEEP", volume: 0.8, pitch: 1.0 } }
      - { PARTICLE: { particle: "DAMAGE_INDICATOR" } }
      # Bleed DoT: 3 iterations 1s apart. Inline wait is cumulative, so the ticks land at 20/40/60t,
      # each dealing 1/8 of the proc'ing hit plus Slowness II.
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "REDSTONE_BLOCK", count: 15, who: "@Victim", wait: 20 } }
      - { DAMAGE: { amount: "%damage% / 8", who: "@Victim" } }
