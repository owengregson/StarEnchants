# Matrix: 01-enchants-armor-a-l.md § Implants
display: "Implants"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eWhile the helmet is worn, tops up hunger on a timer and health half as often."
trigger: REPEATING
applies-to: [HELMET]
group: "epic"
tier: epic
chance: 100
levels:
  1:
    abilities:
      - repeat: 120  # as-intended food cadence (D-01-10)
        condition: "%actor.food% < 20"
