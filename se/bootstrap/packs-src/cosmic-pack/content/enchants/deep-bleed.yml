# Imported from EliteEnchantments (id: deep-bleed). Review before shipping.
display: "Deep Bleed"
description:
  - "&eYour strikes tear a deeper"
  - "&ebleeding wound; the victim bleeds"
  - "&eharder and is slowed far more"
  - "&eover several seconds."
  - "&c&l(!)&r &7Requires &eBleed"
trigger: ATTACK
applies-to: [AXE]
group: "mythic"
tier: mythic
requires: ["enchants/bleed"]
removes-required: true  # the mythic upgrade supersedes its base counterpart (net-zero enchant slots)
levels:
  1:
    chance: 2.25
    cooldown: 80
    effects:
      - { SOUND: { sound: "ENTITY_PLAYER_ATTACK_STRONG", volume: 0.8, pitch: 0.85 } }
      - { PARTICLE: { particle: "DAMAGE_INDICATOR" } }
      # Self-contained upgraded Bleed DoT (removes-required drops the base, so this can't lean on it):
      # 3 iterations 1s apart via cumulative wait, each a bigger slice of the proc'ing hit (1/4, 1/3, 1/2)
      # plus Slowness III.
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "REDSTONE_BLOCK", count: 15, who: "@Victim", wait: 20 } }
      - { DAMAGE: { amount: "%damage% / 4", who: "@Victim" } }
      - { POTION: { effect: "SLOW", level: 3, duration: 20, who: "@Victim" } }
      - { PARTICLE: { particle: "BLOCK_CRACK", block: "REDSTONE_BLOCK", count: 15, who: "@Victim", wait: 20 } }
      - { DAMAGE: { amount: "%damage% / 3", who: "@Victim" } }
      - { POTION: { effect: "SLOW", level: 3, duration: 20, who: "@Victim" } }
