# Matrix: 03-enchants-swords.md § Deep Wounds
display: "Deep Wounds"
# description: not matrix-recorded (factual paraphrase)
description:
  - "&eEvery hit lands a little harder and leaves an"
  - "&eopen wound your target cannot bless away."
trigger: ATTACK
applies-to: [SWORD]
group: "uncommon"
tier: uncommon
# No roll and no guards — the only unconditional attack multiplier in the sword pool, so every row runs on
# every qualifying hit. The wound mark is written on the VICTIM for 30xL t (the jar's 1500xL ms window); the
# marked player reads it as %deepwounds% when they next activate, which is exactly what Blessed (doc 04)
# gates its refusal on (`!%deepwounds%`, with its own `§4** DEEP WOUNDS §7(NO BLESS)§4 **` line — that string
# belongs to Blessed's file, not this one).
# The third row folds +0.5 pp per live Bleed stack into the same hit — CLOSED in batch 4, now axes/bleed
# publishes `bleedstacks`. The matrix's VAR_SCALED_DAMAGE gap needed no engine work: an expression-valued
# DAMAGE_MOD amount is the fold (the closure Rage and Devour already use), and `%victim.var.bleedstacks%`
# reads 0 on an unbled victim, so the row is unconditional like the flat one above it. Both DAMAGE_MOD rows
# are additive into one attack fold, so the multiplier is 1 + 0.01xL + 0.005xstacks — at Bleed's cap of 20
# the matrix ceiling x1.11/x1.12/x1.13.
# Deliberately outside axes/Devour's mutual exclusion (that one is Devour-vs-Rage): Devour reads the same
# counter with its own coefficient, and both folds ride one hit.
# era: none.
levels:
  1:
    effects:
      - { SET_VAR: { name: "deepwounds", value: "1", ttl: 30, who: "@Victim" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: 1 } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "%victim.var.bleedstacks% * 0.5" } }
  2:
    effects:
      - { SET_VAR: { name: "deepwounds", value: "1", ttl: 60, who: "@Victim" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: 2 } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "%victim.var.bleedstacks% * 0.5" } }
  3:
    effects:
      - { SET_VAR: { name: "deepwounds", value: "1", ttl: 90, who: "@Victim" } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: 3 } }
      - { DAMAGE_MOD: { side: "attack", mode: "add", amount: "%victim.var.bleedstacks% * 0.5" } }
