# Matrix: 10-armor-sets.md § KOTH (crystal route, family preamble §A.7/§C.1)
# The only crystal split by victim kind, and the only one whose four-piece fold reproduces its set exactly:
# +5% per crystal-bearing piece against players and +12.5% per piece against everything else, so four pieces
# land the set's own x1.20 PvP / x1.50 PvE. No defensive half — KOTH is a glass cannon on both routes.
# THE BANNER IS THE DISPLAY NAME — verbatim, not a paraphrase and not normalised. `ArmorSet.KOTH.displayName`
# is a built expression, resolved in codex §A.2 to exactly this: the `;` bookends are `CC.WhiteB + CC.Magic`
# (`§f§l§k`, so both semicolons render as obfuscated noise), the leading space belongs to `" K"`, and the
# space after `H` survives into the string. The name slot takes `getDisplayName()` (matrix/13 § Armor Crystal),
# so the whole banner lands inside the gold wrapper. Two KOTH banners exist: this `;` one on the enum, and the
# `!`-bookended `getKothName()` on the armour pieces (sets/koth.yml). Different strings, different items.
display: "§f§l§k;§c§l K§6§l.§e§lO§a§l.§b§lT§5§l.§d§lH §f§l§k;"
# The source's own crystalDescription, verbatim (codex §A.2); see phantom.yml for the construction rule.
# TWO KOTH-only traps, both codex-verified:
#  * the colour here is AQUA `§b` — the ArmorSet enum's own colour, which is what the crystal reads. The `§d`
#    this block used to carry is KothArmorSet's private LIGHT_PURPLE, which drives the PIECE lore and the
#    equip message and is never read by a crystal. Both spellings are correct, on different items.
#  * the set line takes the enum's display name, which for KOTH is the `;`-bookended banner (the `!`-bookended
#    variant with its `§r`s belongs to the armour pieces, sets/koth.yml). Its own `§f§l§k` masks the `§b§l`
#    prefix entirely, and its trailing space survives into the line — verbatim, not tidied.
description:
  - " §b§l§f§l§k;§c§l K§6§l.§e§lO§a§l.§b§lT§5§l.§d§lH §f§l§k;"
  - "  §b§l* §b+5% PvP DMG"
  - "  §b§l* §b+12.5% PvE DMG"
tier: legendary  # (port-chosen) see phantom.yml
applies-to: [ARMOR]
stackable: true
# No Infinite Luck check on either branch (KOTH and Dragon Slayer are the only two damage sets without one,
# measured), so both folds are unconditional inside their victim-kind gate. The set's Auto Bless, fall
# immunity and axe strip are set-only; the crystal sells the damage alone.
abilities:
  - condition: "%victim.type% == \"PLAYER\""
    trigger: ATTACK
    effects:
      - { DAMAGE_MOD: { side: attack, mode: add, amount: 5 } }
  - condition: "%victim.type% != \"PLAYER\""
    trigger: ATTACK
    effects:
      - { DAMAGE_MOD: { side: attack, mode: add, amount: 12.5 } }
