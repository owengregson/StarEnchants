# Matrix: 10-armor-sets.md § Supreme (crystal route, family preamble §A.7/§C.1)
# +3% outgoing per crystal-bearing piece, four pieces to x1.12. No defensive half (measured) — and none of
# the set's drawbacks either: the crystal route sells the bonus without the +10% incoming arrow damage the
# full set carries.
display: "Supreme"
# The source's own crystalDescription, verbatim (codex §A.2); see phantom.yml for the construction rule.
# Supreme is the family's colour SPLIT: its enum colour is DARK_GREEN `§2` — which is what the set line's
# prefix and every bullet carry — while its display name is `§4§lSupreme`, so the set line's doubled codes
# disagree and render dark red. The source's quirk, reproduced rather than tidied.
description:
  - " §2§l§4§lSupreme"
  - "  §2§l* §2+3% Outgoing DMG"
tier: legendary  # (port-chosen) see phantom.yml
applies-to: [ARMOR]
stackable: true
# The set's "+200% Clout (Flight Enabled)" is an external economy behaviour and ships as lore only (R9);
# the crystal advertises no clout half, so nothing is owed here. Victim Infinite Luck >= 2 suppresses the
# SET's outgoing bonus, not this path.
abilities:
  - { trigger: ATTACK, effects: [ { DAMAGE_MOD: { side: attack, mode: add, amount: 3 } } ] }
