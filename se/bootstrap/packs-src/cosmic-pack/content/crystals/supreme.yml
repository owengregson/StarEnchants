# Matrix: 10-armor-sets.md § Supreme (crystal route, family preamble §A.7/§C.1)
# +3% outgoing per crystal-bearing piece, four pieces to x1.12. No defensive half (measured) — and none of
# the set's drawbacks either: the crystal route sells the bonus without the +10% incoming arrow damage the
# full set carries.
# DARK RED, NOT DARK GREEN — DO NOT "FIX" THIS. Supreme is the family's colour SPLIT (codex §A.2 quirk):
# `ArmorSet.SUPREME`'s enum `color` is DARK_GREEN `§2`, but its `displayName` is `CC.DarkRedB + "Supreme"` =
# `§4§lSupreme`. The two are read by different call sites — `getColor()` drives the set line's prefix, the
# lore bullets and the multi-crystal letter (`§2§lS`), while `getDisplayName()` drives the item NAME. The name
# slot takes the DISPLAY (matrix/13 § Armor Crystal), so this crystal reads dark red on the item and dark
# green in the bullets below. Both are correct, on different strings.
display: "§4§lSupreme"
# The source's own crystalDescription, verbatim (codex §A.2); see phantom.yml for the construction rule. The
# set line's doubled codes are where the split shows: `§2§l` (colour) then `§4§l` (display), rendering dark
# red. The source's quirk, reproduced rather than tidied.
description:
  - " §2§l§4§lSupreme"
  - "  §2§l* §2+3% Outgoing DMG"
tier: legendary  # (port-chosen) see phantom.yml
applies-to: [ARMOR]
stackable: true
# The set's "+200% Clout (Flight Enabled)" is an external economy behaviour and ships as lore only (R9);
# the crystal advertises no clout half, so nothing is owed here. Victim Infinite Luck >= 2 suppresses the
# SET's outgoing bonus, not this path.
abilities:
  - { trigger: ATTACK, effects: [ { DAMAGE_MOD: { side: attack, mode: add, amount: 3 } } ] }
