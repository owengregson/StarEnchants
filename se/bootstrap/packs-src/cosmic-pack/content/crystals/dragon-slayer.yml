# Matrix: 10-armor-sets.md § Dragon Slayer (crystal route, family preamble §A.7/§C.1)
# The one crystal in the family whose advertised numbers all match measured behaviour at one piece: -5%
# incoming and +3% PvP outgoing per crystal-bearing piece, plus a 10%-per-piece cancel of an incoming Silence
# or Ice Aspect proc (40% at four). The set's own full-set negation flags and this crystal's roll are
# independent mechanisms in the jar and both can be live at once (measured) — nothing here suppresses the
# set half.
display: "§e§lDragon Slayer"  # ArmorSet.DRAGON_SLAYER.getDisplayName (codex §A.2, `CC.YellowB + "Dragon Slayer"`); see phantom.yml
# The source's own crystalDescription, verbatim (codex §A.2); see phantom.yml for the construction rule. Its
# four bullets are the only ones in the family that name TWO immunities as separate lines.
description:
  - " §e§l§e§lDragon Slayer"
  - "  §e§l* §e+3% PvP DMG"
  - "  §e§l* §e-5% Incoming DMG"
  - "  §e§l* §e10% Silence Immunity"
  - "  §e§l* §e10% Freeze Immunity"
tier: legendary  # (port-chosen) see phantom.yml
applies-to: [ARMOR]
stackable: true
# The cancel is defender-keyed: SUPPRESS_INCOMING, not SUPPRESS. A defensive SUPPRESS is keyed on the
# activator and can only be armed from a DEFENSE pass that runs AFTER the attack pass, so it always leaks
# the opening proc — the exact hit this exists to stop. The window is held open by a REPEATING re-arm
# (PASSIVE is a start/stop lifecycle, fired once at equip, so a window armed there would expire mid-wear);
# `repeat: 20` under `duration: 60` bounds the residual cancel after the crystal comes off at 3 s.
# The block lines are the matrix's verbatim crystal strings, sent to the protected wearer at the block.
# PER-PIECE SCALING (R-QC52). The jar's hook is `Math.random() <= multiplier * 0.1` — 10 % per crystal-bearing
# piece, 10/20/30/40 at n = 1..4 (codex §Dragon Slayer, "Crystal hooks"/onEnchantImmuneToProced). Two engine
# facts make that authorable in one file: `%actor.crystals.<stem>%` counts the wearer's crystal-bearing ARMOUR
# pieces, and `SuppressionStore.strongerDefender` resolves two arms of the same (holder, scope, key) to the
# STRONGER chance. So the four rungs below are a ladder, not four competing windows — at n = 3 the >= 1, >= 2
# and >= 3 rungs all arm and 30 governs. `chance` is `int[1..100]`, which is why the ladder exists at all: an
# expression cannot ride an effect param. The rung is one ability per step because a condition gates the whole
# ability, and both keys must move together on every step.
abilities:
  - trigger: DEFENSE
    effects:
      - { DAMAGE_MOD: { side: defense, mode: add, amount: 5 } }
  - condition: "%victim.type% == \"PLAYER\""
    trigger: ATTACK
    effects:
      - { DAMAGE_MOD: { side: attack, mode: add, amount: 3 } }
  # n >= 1 — the base rung; a crystal that is running at all is worn on at least one piece.
  - trigger: REPEATING
    repeat: 20
    effects:
      - { SUPPRESS_INCOMING: { scope: ENCHANT, key: "enchants/silence", chance: 10, duration: 60, who: "@Self",
                               consumed-message-actor: "§e§l* DRAGON SLAYER CRYSTAL [§7Silence blocked§e§l] *" } }
      - { SUPPRESS_INCOMING: { scope: ENCHANT, key: "enchants/ice-aspect", chance: 10, duration: 60, who: "@Self",
                               consumed-message-actor: "§e§l* DRAGON SLAYER CRYSTAL [§7Ice Aspect blocked§e§l] *" } }
  - trigger: REPEATING
    repeat: 20
    condition: "%actor.crystals.dragon-slayer% >= 2"
    effects:
      - { SUPPRESS_INCOMING: { scope: ENCHANT, key: "enchants/silence", chance: 20, duration: 60, who: "@Self",
                               consumed-message-actor: "§e§l* DRAGON SLAYER CRYSTAL [§7Silence blocked§e§l] *" } }
      - { SUPPRESS_INCOMING: { scope: ENCHANT, key: "enchants/ice-aspect", chance: 20, duration: 60, who: "@Self",
                               consumed-message-actor: "§e§l* DRAGON SLAYER CRYSTAL [§7Ice Aspect blocked§e§l] *" } }
  - trigger: REPEATING
    repeat: 20
    condition: "%actor.crystals.dragon-slayer% >= 3"
    effects:
      - { SUPPRESS_INCOMING: { scope: ENCHANT, key: "enchants/silence", chance: 30, duration: 60, who: "@Self",
                               consumed-message-actor: "§e§l* DRAGON SLAYER CRYSTAL [§7Silence blocked§e§l] *" } }
      - { SUPPRESS_INCOMING: { scope: ENCHANT, key: "enchants/ice-aspect", chance: 30, duration: 60, who: "@Self",
                               consumed-message-actor: "§e§l* DRAGON SLAYER CRYSTAL [§7Ice Aspect blocked§e§l] *" } }
  - trigger: REPEATING
    repeat: 20
    condition: "%actor.crystals.dragon-slayer% >= 4"
    effects:
      - { SUPPRESS_INCOMING: { scope: ENCHANT, key: "enchants/silence", chance: 40, duration: 60, who: "@Self",
                               consumed-message-actor: "§e§l* DRAGON SLAYER CRYSTAL [§7Silence blocked§e§l] *" } }
      - { SUPPRESS_INCOMING: { scope: ENCHANT, key: "enchants/ice-aspect", chance: 40, duration: 60, who: "@Self",
                               consumed-message-actor: "§e§l* DRAGON SLAYER CRYSTAL [§7Ice Aspect blocked§e§l] *" } }
