# Matrix: 10-armor-sets.md § Dimensional Traveler (crystal route, family preamble §A.7/§C.1)
# The steepest damage crystal in the family: +7.5% outgoing per crystal-bearing piece, four pieces to x1.30 —
# the full set's own multiplier, reproduced by crystals alone.
display: "§5§lDimensional Traveler"  # ArmorSet.DIMENSIONAL_TRAVELER.getDisplayName (codex §A.2); see phantom.yml
# The source's own crystalDescription, verbatim (codex §A.2); see phantom.yml for the construction rule. The
# "20%" it advertises for the Dimensional Shift roll is the source's own advert against a measured 0.2% per
# piece — its mismatch (recorded on sets/dimensional-traveler.yml) — and it ships because the roll ships.
description:
  - " §5§l§5§lDimensional Traveler"
  - "  §5§l* §5+7.5% Outgoing DMG"
  - "  §5§l* §520% Dimensional Shift Ability"
tier: legendary  # (port-chosen) see phantom.yml
applies-to: [ARMOR]
stackable: true
# The shift rider fires once per crystal-bearing piece, which is how every per-piece crystal number in this
# family scales — so the authored rate is the ONE-piece rate, 0.2 %, the jar's `0.002 x pieces` at n = 1.
# The payload below is sets/dimensional-traveler.yml's, copied in the same sitting from that one reading: the
# freeze, the Clarity-shed blindness, the slow, both cues, the target line and the two-material FALLING_BLOCK
# field with its whole layer/density/re-hit profile. If either copy is retuned, both must move together.
# THE POLTERGEIST REBATE NOW TRAVELS (ADR-0076). It used not to: as an ability-level chance split it would
# have been 0.025 pp of a 0.2 % roll, and its message rung a second ability that double-printed for anyone
# wearing the set AND a crystal. Per-target it is neither — the filter is a property of each resolved body at
# a flat 12.5 % per Poltergeist level whatever the rider's own rate, and the immune line is a row of the same
# ability rather than a rung of its own. A wearer who holds both still sees the pair twice, exactly as they
# already take the whole shift payload twice; that is the set/crystal double-billing this file records below,
# not a new one. Both copies must move together, per this file's own rule.
# ONE CLAUSE OF THE SET'S READING STILL DOES NOT TRAVEL, recorded rather than faked:
#  * the IMPACT LANDING PAYLOAD. A landing block fires the ACTOR's IMPACT abilities, and the set owns the only
#    one — so a wearer who carries crystals WITHOUT completing the set rains blocks that land for nothing.
#    A second IMPACT rung here would fix that case and double-bill every landing for a wearer who has both,
#    which is worse; it closes with the group-scoped IMPACT identity (deferred-content.md).
# The set's damage hook carries NO Infinite Luck check, and the crystal path never had one either, so the fold
# below is unconditional. Worded to match crystals/koth.yml rather than claiming exclusivity: the matrix awards
# that twice and cannot mean both — § Dimensional Traveler calls this hook "unique among damage sets" while
# § Dragon Slayer calls KOTH and Dragon Slayer "the only two damage-modifying sets without one", which is three
# sets for two slots. The uncontested fact is the one stated above; the exclusivity is a matrix-maintenance row
# (deferred-content.md). sets/dimensional-traveler.yml carries the same normalised wording.
abilities:
  - { trigger: ATTACK, effects: [ { DAMAGE_MOD: { side: attack, mode: add, amount: 7.5 } } ] }
  # The set's own "dungeon" world gate rides its defensive rungs; the crystal path carries the same gate, from
  # the same reading — a shift is a shift whichever piece armed it.
  - trigger: DEFENSE
    chance: 0.2
    # The IMPACT scope (ADR-0074 §4), the SAME interned string as the set's arm and payload: a crystal-armed
    # landing fires the set's shift payload — the one ability in the group — and never the wearer's whole
    # IMPACT roster. A wearer carrying this crystal WITHOUT the set has no ability in the group, which is the
    # recorded payload gap above, unchanged.
    group: "dimensional-shift"
    condition: "(%actor.world% contains \"dungeon\") : %stop%"
    effects:
      - { FREEZE: { duration: 80, dot: 0, slow: 100, who: "@Aoe{r=25, filter=ENEMIES}",
            each-if: "%target.roll% >= 12.5 * %target.enchlevel.poltergeist%" } }
      - { MESSAGE: { text: "§4§l* POLTERGEIST [§7Immune: Dimensional Traveler§4§l] *", who: "@Aoe{r=25, filter=ENEMIES}",
            each-if: "%target.roll% < 12.5 * %target.enchlevel.poltergeist%" } }
      - { POTION: { effect: BLINDNESS, level: 1, duration: 60, who: "@Aoe{r=25, filter=ENEMIES}" } }
      - { POTION: { effect: SLOW, level: 1, duration: 80, who: "@Aoe{r=25, filter=ENEMIES}" } }
      # Both cues at dy: 4 and the freeze line on {RELATION_COLOR} — byte-identical to the set's copies after
      # the 2e.3 lift, per this file's own rule that if either copy is retuned both move together.
      - { SOUND: { sound: "ENTITY_ENDERMAN_TELEPORT", volume: 1.0, pitch: 1.1, dy: 4, who: "@Aoe{r=25, filter=ENEMIES}" } }
      - { SOUND: { sound: "BLOCK_ANVIL_LAND", volume: 1.0, pitch: 1.1, dy: 4, who: "@Aoe{r=25, filter=ENEMIES}" } }
      - { MESSAGE: { text: "§5§l** DIMENSIONAL SHIFT (§c{RELATION_COLOR}{ATTACKER} [4s]§5§l) **", who: "@Aoe{r=25, filter=ENEMIES}" } }
      - { FALLING_BLOCK: { material: END_STONE, material2: NETHERRACK, radius: 4, height: 10, ttl: 100,
            layers-min: 3, layers-max: 4, layer-step-min: 12, layer-step-max: 19, density: 50,
            damage-percent: 15, health-cap: 44, rehit-max: 4, rehit-window: 200, kill-material: COBWEB,
            who: "@Aoe{r=25, filter=ENEMIES}" } }
