# interactions: the souls economy (SoulPool) end to end. While the window is open every soul-costed action in
# this pack is free — `enchants/phoenix`'s escalating last-stand charge, `enchants/soul-trap`'s 5, whatever
# `enchants/hero-killer` ships when its gate lands — and their "out of souls" refusal paths simply never run,
# which is exactly what the jar's exemption did. Nothing stacks: a second Tesla use inside the window is
# refused above, and the effect REPLACES rather than extends its window if one ever lands another way.
