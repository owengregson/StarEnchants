# Bat Pet — an ACTIVE pet (ADR-0060, cloud + scatter reworked by ADR-0068): right-click to summon a
# swarm of temporary bats. They spawn on a 0.5-block ring at chest height with their heights scattered
# ±0.6 blocks, each facing directly outward, and keep VANILLA bat AI (they flutter and swirl around
# you — never NoAI statues) at half vanilla bat speed. If someone has attacked you within the last 10
# seconds and is within 16 blocks, the swarm instead CLOUDS THEIR VISION — orbiting the two-block
# pillar directly in front of their face and tracking them as they move and turn; the most recent
# attacker wins, and when none qualifies the bats go back to vanilla fluttering. They live 15 seconds
# or until something kills them (6 hearts, normal damage). Instant (no duration = no armed window);
# only the swarm size and the cooldown scale with level.
