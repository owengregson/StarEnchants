# interactions: this pet is the ONLY teleblock removal in the corpus. The three preventions — the RANGER set's
# immunity, the GLITCH mask's immunity and RANGER's `0.2 x crystals` bonus roll — are recorded with their own
# owners (matrix/10, matrix/11: `sets/ranger.yml` already ships its SUPPRESS_INCOMING grant), and the upstream
# teleblock quirks (ms-vs-seconds duration metadata, the `[-0ep]` line) belong to the bow entry (matrix/05).
# Nothing here stacks with anything: STATUS_CLEAR lifts one window and is a silent no-op when none is held,
# which is why the guard above decides what a wasted use costs.
