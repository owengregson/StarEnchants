# Matrix: 12-pets.md § Blackscroll Pet
# An ACTIVE inventory pet: right-click to arm a one-shot +LEVEL% bonus on the success rate of the NEXT book a
# black scroll (or heroic black scroll) mints off your gear. The whole payload is one shipped primitive —
# BOOK_RATE_MODIFIER at the `generate` site — so this entry translates row for row.
#
# FAMILY FACTS (matrix § Family-level facts, shared by all 17 entries; recorded once per file):
#  - The jar fires on ANY interaction (no action filter, codex §A.2); as intended it is right-click only,
#    which IS the engine's USE trigger (ledger D-12-1). The 1 Hz hotbar ticker is a no-op for every pet, so
#    nothing passive is ported and this pet is `type: ACTIVE` with no worn ability.
#  - COOLDOWN: the jar computes `cooldown − now − last-used`, always a large negative, so no pet cooldown ever
#    blocked and its on-cooldown branch is dead code (codex §A.6 — the plugin's single most consequential bug).
#    The AS-INTENDED value ships: 900 s = 18 000 t (ledger D-12-20). The engine's own gate-6 cooldown replaces
#    the matrix's SET_VAR/`pet-cd-blackscroll` template — same window, one authored number, and the pet-wide
#    cooldown scope survives a level-up that crosses a bracket floor. The jar's inert pre-guard timestamp
#    stamp (rebuild discarded on throw) and its op-while-sneaking bypass are dead code and are not ported.
#  - XP: pets earn ONLY from using their own ability. `ITEM_XP_TRACK` carries the grant, the family's two
#    verbatim lines and the recorded one-level-per-grant/remainder-banked/unbounded-at-cap semantics;
#    `exp-curve` + `max-level` carry this pet's own ladder. `{needed}` is the POST-level-up requirement on the
#    activation that levels you — the jar quirk, kept by the effect. The jar's 50-segment EXP bar renders
#    always-empty below the cap and overflows past 50 at the cap (codex §A.5); the engine's bar is
#    proportional and clamped, which IS the as-intended reading (ledger D-12-2).
#  - LORE SPLIT: `descriptor` is the flavour block and `description` the `§7§f§lAbility` body, both verbatim —
#    and the body carries its own `§7§f§lAbility` / `§7§f§lCooldown` headers and cooldown value line. The
#    pack's ONE pet likeness, `items/pet.yml`, holds the cosmic name template and the family's Level/EXP tail
#    (`§7` / `§f§lLevel` / `§7 {level}` / `§7` / `§f§lEXP` / `{bar}` / `§7 ({exp}/{needed})`), nothing else.
#    `{LEVEL}` is the likeness token for the stored level, and here it doubles as the bonus percent, which IS
#    the level; `{TIME_FORMATTED}` renders the live bracket's cooldown, flat `15m` at every rung.
#  - HEAD: the source's own `skinBlob`, authored verbatim below (R-QC56); the family reading is in
#    `items/pet.yml`.
#  - Pet heads are invalid helmet items (the masks family refuses to wear one) — an interaction-layer rule,
#    engine-owned, not authored here.
# FAMILY-WIDE, AUTHORED ONCE FOR THE FOLDER: items/pet.yml + config.yml — full reading in anti-teleblock.yml.
# THE ALREADY-CHARGED REFUSAL renders, as its own ability on the complement of the payload's guard — the
# `anti-teleblock.yml` shape, and the reason no string is owed here: `%bookrate.generate%` is a readable fact,
# so the branch a USE activation cannot take AFTER selection it can take BEFORE one. `cooldown: 0` scopes it to
# its own key, so a refused click still burns nothing.
# interactions: the book economy, `generate` site — the bonus adds on top of whatever base success the (heroic)
# black scroll rolled, and the generated book's destruction rate stays 100. Independent of the Enchanter
# charge (`apply` is a different site), so BOTH can be armed at once — `pets/enchanter.yml` records the same.
# The jar's charge was session-only player metadata (silently lost on relog); the engine's charge is
# store-backed and survives a relog, which is the roll it waits for possibly being days away. The consumer
# items (black scroll / heroic black scroll) arrive with the pack's items batch; until then the charge simply
# waits, which is exactly what it does between uses anyway.
# era: none beyond the family notes. `LAVA_POP` and `ITEM_PICKUP` are 1.7/1.8 sound names, authored here in
# their modern spellings (`BLOCK_LAVA_POP`, `ENTITY_ITEM_PICKUP`); `Aliases.SOUND` carries both rows
# (`LAVA_POP → BLOCK_LAVA_POP`, `ITEM_PICKUP → ENTITY_ITEM_PICKUP`), so both play on the legacy fork.
# `SKULL_ITEM:3` is the era seam's shape, and this pet authors a `head:`, so the legacy lane mints the
# textured player head — see `pet.yml`.
# FOLDER HARMONISATION (owner ruling): '&' colour form, own Cooldown block, spectator refusal as its own ability.
display: "Blackscroll Pet"
color: "&e"
type: ACTIVE
# HEAD TEXTURE (R-QC56): the source's own `skinBlob` constant, verbatim — the family reading (why the
# blob IS the identity, and the two source data bugs) is in `items/pet.yml`.
head: ""
descriptor:
  - "§7§7A strange organic box"
  # "eminates" is the source's own typo, kept verbatim.
  - "§7§7that eminates dark magical"
  - "§7§7power which can be harnessed"
  - "§7§7to enhance disenchanting."
description:
  - "§7"
  - "§7§f§lAbility"
  - "§7§7Increase the % success rate of"
  - "§7§7enchantment books generated by"
  - "§7§7the next blackscroll or heroic"
  - "§7§7blackscroll you use by §f{LEVEL}%"
  - "§7"
  - "§7§f§lCooldown"
  - "§7§7 {TIME_FORMATTED}"
# The recorded ladder `250 + 1000 × level` (the cost of REACHING level N): 2250 at L2 … 10250 at L10,
# 56 250 to cap — 1125 uses at 50 XP each.
exp-curve: { base: 250, per-level: 1000 }
max-level: 10
levels:
  # One bracket per level: only the bonus percent (= the level) and the success line's number scale. Cooldown
  # is flat 900 s at every rung (lore `15m`), and the XP grant is flat 50.
  1:
    cooldown: 18000
    abilities:
      - condition: '%actor.gamemode% != "SPECTATOR" && !%bookrate.generate%'
        effects:
          - { BOOK_RATE_MODIFIER: { site: generate, percent: 1 } }
          - { SOUND: { sound: "BLOCK_LAVA_POP", volume: 1.1, pitch: 1.0 } }
          - { ITEM_XP_TRACK: { amount: 50, message: "§a§l+ §a{xp} Pet EXP §a§l[§7{exp}/{needed}§a§l]", level-up-message: "§a§l*** {item}§a has increased to level §a§n{level}§a§l ***" } }
          # {level} has no token binding on MESSAGE, so the percent is inlined per rung (the batch-1 convention).
          - { MESSAGE: { text: "§a§lPET: §aThe next blackscroll or heroic blackscroll you use will have a +1% modifier applied to the success rate of the book it generates." } }
          - { SOUND: { sound: "ENTITY_ITEM_PICKUP", volume: 1.0, pitch: 1.1 } }
      - condition: '%actor.gamemode% != "SPECTATOR" && %bookrate.generate%'
        cooldown: 0
        effects:
          - { MESSAGE: { text: "§c§lPET: §cYou already have an active Blackscroll Pet applied. Use a blackscroll before attempting to use another blackscroll pet." } }
      - condition: '%actor.gamemode% == "SPECTATOR"'
        cooldown: 0
        effects:
          - { MESSAGE: { text: "§c§lPET: §cYou cannot use that ability while spectating!" } }
