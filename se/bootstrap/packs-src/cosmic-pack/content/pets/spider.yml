# Spider Pet — an ACTIVE pet (ADR-0052): right-click to bury yourself AND your nearest enemy in 3×4×3
# cobweb boxes (each centred on its player, filling only AIR, gone after 4s — the shared temp-block ledger
# restores whatever raced in). The %nearbyenemies% condition fails the use BEFORE the cooldown arms when no
# one is around; only the cooldown scales with level.
display: "Spider"
color: "&4"
type: ACTIVE
head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzg3YTk2YThjMjNiODNiMzJhNzNkZjA1MWY2Yjg0YzJlZjI0ZDI1YmE0MTkwZGJlNzRmMTExMzg2MjliNWFlZiJ9fX0="
description:
  - "&4&l* Temporarily traps you and your enemy in cobwebs"
levels:
  # 4m → 3m30s → 3m → 2m30s.
  1:
    cooldown: 4800
    condition: "%nearbyenemies% >= 1"
    effects:
      - { SOUND: { sound: "ENTITY_SPIDER_AMBIENT", volume: 1.0, pitch: 0.8 } }
      - { TEMP_BLOCK: { shape: BOX, material: COBWEB, width: 3, height: 4, depth: 3, ticks: 80, airOnly: true, who: "@Self" } }
      - { TEMP_BLOCK: { shape: BOX, material: COBWEB, width: 3, height: 4, depth: 3, ticks: 80, airOnly: true, who: "@NearestPlayer{r=10}" } }
  25:
    cooldown: 4200
    condition: "%nearbyenemies% >= 1"
    effects:
      - { SOUND: { sound: "ENTITY_SPIDER_AMBIENT", volume: 1.0, pitch: 0.8 } }
      - { TEMP_BLOCK: { shape: BOX, material: COBWEB, width: 3, height: 4, depth: 3, ticks: 80, airOnly: true, who: "@Self" } }
      - { TEMP_BLOCK: { shape: BOX, material: COBWEB, width: 3, height: 4, depth: 3, ticks: 80, airOnly: true, who: "@NearestPlayer{r=10}" } }
  50:
    cooldown: 3600
    condition: "%nearbyenemies% >= 1"
    effects:
      - { SOUND: { sound: "ENTITY_SPIDER_AMBIENT", volume: 1.0, pitch: 0.8 } }
      - { TEMP_BLOCK: { shape: BOX, material: COBWEB, width: 3, height: 4, depth: 3, ticks: 80, airOnly: true, who: "@Self" } }
      - { TEMP_BLOCK: { shape: BOX, material: COBWEB, width: 3, height: 4, depth: 3, ticks: 80, airOnly: true, who: "@NearestPlayer{r=10}" } }
  100:
    cooldown: 3000
    condition: "%nearbyenemies% >= 1"
    effects:
      - { SOUND: { sound: "ENTITY_SPIDER_AMBIENT", volume: 1.0, pitch: 0.8 } }
      - { TEMP_BLOCK: { shape: BOX, material: COBWEB, width: 3, height: 4, depth: 3, ticks: 80, airOnly: true, who: "@Self" } }
      - { TEMP_BLOCK: { shape: BOX, material: COBWEB, width: 3, height: 4, depth: 3, ticks: 80, airOnly: true, who: "@NearestPlayer{r=10}" } }
