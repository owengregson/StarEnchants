# Eagle Pet — an ACTIVE pet (ADR-0052): right-click for a 10s window of bonus damage while you fight from
# BELOW — the armed ATTACK rider is gated on %actor.belowvictim% (how many blocks your feet sit below the
# victim's) exceeding 1.5. Only the bonus scales with level; the cooldown holds at 2m30s.
display: "Eagle"
color: "&e"
type: ACTIVE
head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNGMyN2UzY2I1MmE2NDk2OGU2MGM4NjFlZjFhYjg0ZTBhMGNiNWYwN2JlMTAzYWM3OGRhNjc3NjE3MzFmMDBjOCJ9fX0="
descriptor: "&eA sky hunter that strikes hardest from beneath its prey. Keep your quarry above you."
description:
  - "&e* Temporarily deal more damage while below your opponent"
levels:
  # +20% → +25% → +30% → +35%, each in a 10s window.
