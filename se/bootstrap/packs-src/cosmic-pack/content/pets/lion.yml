# Lion Pet — an ACTIVE pet (ADR-0052): right-click to hurl EVERYTHING living nearby away from you (a
# radial shove + an upward pop). Instant (no armed window); the %nearbyenemies% condition fails the use
# BEFORE the cooldown arms when no one is around. Only the cooldown scales with level.
