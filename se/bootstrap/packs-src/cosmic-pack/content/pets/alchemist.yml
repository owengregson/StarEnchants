# Matrix: 12-pets.md § Alchemist Pet
# An ACTIVE inventory pet: right-click, once every 12 hours, to pull a handful of items out of the ALCHEMIST
# Evolution-Kit loot table. THE PAYLOAD IS OUT OF SCOPE (ruling R3) and is NOT authored — the file ships its
# identity, its cues, its XP economy and its recorded 12 h price, with the roll recorded below for whoever
# lands the kits flow. This is the `enchants/auto-sell.yml` treatment (obtainable, the behaviour recorded and
# not implemented), with the cooldown deliberately KEPT: it is the only thing standing between an unauthored
# ability and a right-click that levels the head for free (the universal use-XP roll credits every activation).
#
# WHAT THE JAR DID, recorded and not shipped:
#   1. guard: fewer than 3 empty inventory slots → `§c§lPET: §cNot enough space (3 slots) in inventory!`
#      (no inventory-space fact exists on the surface; the guard belongs to the payload and travels with it)
#   2. payload: roll `delivered(level)` items from the ALCHEMIST Evolution-Kit loot table at kit level
#      `max(3, petLevel)` — an external CosmicEvolutionKits flow, OUT OF SCOPE (R3), and its table contents are
#      codex-UNRESOLVED besides. Per-item feedback, verbatim: `§7+ {amount}x {item}`
#      Counts: advertised 3 (L1–4) / 4 (L5–10), with a dead `level == 10 → 5` arm short-circuited by `>= 5`;
#      delivered = advertised − 1 (off-by-one), measured 2/2/2/2/3/3/3/3/3/3. As intended: 3 (L1–4),
#      4 (L5–9), 5 (L10) (ledger D-12-21). Kit level `max(3, level)` makes L1–3 identical in quality and count.
#   3. the two cues, the XP grant and the 12 h stamp — the rows this file DOES author.
# The verbatim ability lore, likewise recorded rather than rendered:
#      `§7§7Spawns up to §6{items}x items§7 from the` / `§7§6Alchemist /vkit (LVL: {level})§7 loot table`
# `{items}` has no token binding and a pet carries ONE `description` for every bracket, so the per-level count
# could not render even if the roll shipped; and a lore line promising items this pack cannot deliver is worse
# than an honest one. `description` below is authored (the auto-sell.yml convention); the flavour block above
# it is the source's own, verbatim.
#
# FAMILY FACTS (matrix § Family-level facts, shared by all 17 entries; recorded once per file):
#  - The jar fires on ANY interaction (no action filter, codex §A.2); as intended it is right-click only,
#    which IS the engine's USE trigger (ledger D-12-1). The 1 Hz hotbar ticker is a no-op for every pet, so
#    nothing passive is ported and this pet is `type: ACTIVE` with no worn ability.
#  - COOLDOWN: the jar computes `cooldown − now − last-used`, always a large negative, so no pet cooldown ever
#    blocked and its on-cooldown branch is dead code (codex §A.6). The AS-INTENDED value ships: 43 200 s / 12 h
#    = 864 000 t (ledger D-12-22), on the engine's own gate-6 cooldown in place of the matrix's
#    SET_VAR/`pet-cd-alchemist` template.
#  - XP: pets earn ONLY from using their own ability. `ITEM_XP_TRACK` carries the recorded flat 100 a use, the
#    family's two verbatim lines and the one-level-per-grant/remainder-banked/unbounded-at-cap semantics;
#    `exp-curve` + `max-level` carry this pet's ladder. This half of the entry is fully in scope and ships
#    whole. The jar's always-empty/overflowing 50-segment bar (codex §A.5) is replaced by the engine's
#    proportional clamped bar, the as-intended reading (ledger D-12-2).
#  - LORE SPLIT: `descriptor` is the flavour block and `description` the `§7§f§lAbility` body — which carries
#    the `§7§f§lAbility` / `§7§f§lCooldown` headers and the cooldown value line (`§7§7 12h`) with it, per pet.
#    The pack's ONE pet likeness, `items/pet.yml`, holds the cosmic name template and the family's Level/EXP
#    tail, and nothing else.
#  - HEAD: the per-type skull texture is codex-side and not matrix-recorded, so no base64 is authored and the
#    head mints untextured — PLAYER_HEAD on modern, its SKULL_ITEM degradation on 1.8.9 (`items/pet.yml`).
#    Family-wide across all 17 entries.
#  - Pet heads are invalid helmet items (the masks family refuses to wear one) — an interaction-layer rule.
#  - The family's spectator refusal is its OWN ability at `cooldown: 0` — nothing fires and no cooldown burns,
#    and the verbatim `§c§lPET: §cYou cannot use that ability while spectating!` renders. A USE ability has no
#    per-condition feedback hook, so a bare condition-fail would send `pets.message-on-fail` instead.
# interactions: CosmicEvolutionKits (external, out of scope R3). The enchant economy is touched only
# indirectly, through whatever the kit table drops.
# era: none beyond the family notes. `LAVA_POP` and `ITEM_PICKUP` are 1.7/1.8 sound names, authored in their
# modern spellings (`BLOCK_LAVA_POP`, `ENTITY_ITEM_PICKUP`); `Aliases.SOUND` carries both rows
# (`LAVA_POP → BLOCK_LAVA_POP`, `ITEM_PICKUP → ENTITY_ITEM_PICKUP`), so both play on the legacy fork.
# FOLDER HARMONISATION (owner ruling): '&' colour form, own Cooldown block, spectator refusal as its own ability.
display: "Alchemist Pet"
color: "&e"
type: ACTIVE
descriptor:
  - "§7§7A mystical little imp creature"
  - "§7§7that pulls random items out of"
  - "§7§7other dimensions and gives them"
  - "§7§7to its owner!"
# AUTHORED, not matrix-recorded: the verbatim ability lines advertise the /vkit roll this pack does not carry
# (see the header). They go back verbatim the day the kits flow lands.
description:
  - "§7"
  - "§7§f§lAbility"
  - "§7§7Its loot comes from the Alchemist"
  - "§7§7/vkit table, which this pack does"
  - "§7§7not carry — so nothing is spawned."
  - "§7"
  - "§7§f§lCooldown"
  - "§7§7 12h"
# The recorded ladder `1000 + level × 250` (the cost of REACHING level N): 1500 at L2 … 3500 at L10, 22 500 to
# cap — 225 uses at 100 XP each.
exp-curve: { base: 1000, per-level: 250 }
max-level: 10
levels:
  # ONE bracket: nothing in the authored half scales. The recorded per-level ladder is the delivered item
  # count and the `max(3, level)` kit level, both of which live in the unauthored payload; the cooldown is
  # flat 12 h and the XP grant flat 100 at every rung.
  1:
    cooldown: 864000
    abilities:
      - condition: '%actor.gamemode% != "SPECTATOR"'
        effects:
          - { SOUND: { sound: "BLOCK_LAVA_POP", volume: 1.1, pitch: 1.0 } }
          - { ITEM_XP_TRACK: { amount: 100, message: "§a§l+ §a{xp} Pet EXP §a§l[§7{exp}/{needed}§a§l]", level-up-message: "§a§l*** {item} §a has increased to level §a§n{level}§a§l ***" } }
          # The jar's delivery cue, kept: it closes the activation the same way for a player who now knows the
          # table is not carried.
          - { SOUND: { sound: "ENTITY_ITEM_PICKUP", volume: 1.0, pitch: 1.1 } }
      - condition: '%actor.gamemode% == "SPECTATOR"'
        cooldown: 0
        effects:
          - { MESSAGE: { text: "§c§lPET: §cYou cannot use that ability while spectating!" } }
