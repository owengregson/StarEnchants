# Anubis Pet — an ACTIVE pet (ADR-0052): right-click for a short window in which EVERY hit has a chance to
# strip a Holy White Scroll off one of the victim's protected pieces (worn armour or held item — the armed
# ATTACK rider's own chance gate is the per-hit percent). Both the chance and the window scale with level;
# the cooldown holds at 5m.
display: "Anubis"
color: "&4"
type: ACTIVE
head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYWNiMzNkOTY1NDM5YzM4YTg3NWU4NTllNGVlZTc3ODVhOWE2ZGFkOTc5YmYxMWJiNmZiOTU4NDllZGUyODQxIn19fQ=="
descriptor: "&eA jackal god that collects what death is owed. Holy wards mean little to it."
description:
  - "&4* Temporarily grants a chance to remove Holy White Scrolls from equipment"
levels:
  # 0.5% / 5s → 1% / 6s → 2% / 7s → 3% / 8s (chance is PER HIT while the window is open).
  1:
    cooldown: 6000
    duration: 100
    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_WITHER_AMBIENT", volume: 0.7, pitch: 1.2 } } ] }
      - { trigger: ATTACK, chance: 0.5, effects: [ { STRIP_SCROLL: { scroll: HOLY, who: "@Victim" } } ] }
  25:
    cooldown: 6000
    duration: 120
    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_WITHER_AMBIENT", volume: 0.7, pitch: 1.2 } } ] }
      - { trigger: ATTACK, chance: 1, effects: [ { STRIP_SCROLL: { scroll: HOLY, who: "@Victim" } } ] }
  50:
    cooldown: 6000
    duration: 140
    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_WITHER_AMBIENT", volume: 0.7, pitch: 1.2 } } ] }
      - { trigger: ATTACK, chance: 2, effects: [ { STRIP_SCROLL: { scroll: HOLY, who: "@Victim" } } ] }
  100:
    cooldown: 6000
    duration: 160
    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_WITHER_AMBIENT", volume: 0.7, pitch: 1.2 } } ] }
      - { trigger: ATTACK, chance: 3, effects: [ { STRIP_SCROLL: { scroll: HOLY, who: "@Victim" } } ] }
