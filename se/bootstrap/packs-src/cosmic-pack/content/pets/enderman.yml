# Enderman Pet — an ACTIVE pet (ADR-0052): right-click for a 10s window of heavily boosted damage against
# MOBS (the armed ATTACK rider is gated on the victim not being a player). Both the bonus and the cooldown
# scale with level.
display: "Enderman"
color: "{#b620b1}"
type: ACTIVE
head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNTlkMjJhY2M1YWE4MGNkOTZiOTdiYTY4YjFkNjc2NDAzMGQ4NzAzNmU2MDVkMGIyMTUzOGVlNjIzOWYxZjQxNCJ9fX0="
descriptor: "&eA warper of space with a grudge against monsters. Best not to make eye contact."
description:
  - "{#b620b1}* Temporarily deal much more damage to mobs"
levels:
  # Mob damage DOUBLED (buff) at every bracket; base cooldown ×1.5 (2m → 3m), scaling steepened to compensate
  # so the max-level cooldown still lands at 30s: +50% / 3m → +100% / 2m10s → +150% / 1m20s → +200% / 30s.
  # The boost window is 10s (200 ticks) at every bracket.
  # CALIBRATION: amounts are EFFECTIVE under combat.attack-scale 5.0 (10/20/30/40 land as +50/100/150/200%
  # final, ADR-0050 R2); retune if you change the knob.
  1:
    cooldown: 3600
    duration: 200
    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_ENDERMAN_TELEPORT", volume: 1.0, pitch: 0.7 } } ] }
      - { trigger: ATTACK, condition: "%victim.type% != \"PLAYER\"", effects: [ { DAMAGE_MOD: { side: attack, mode: add, amount: 10 } } ] }
  25:
    cooldown: 2600
    duration: 200
    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_ENDERMAN_TELEPORT", volume: 1.0, pitch: 0.7 } } ] }
      - { trigger: ATTACK, condition: "%victim.type% != \"PLAYER\"", effects: [ { DAMAGE_MOD: { side: attack, mode: add, amount: 20 } } ] }
  50:
    cooldown: 1600
    duration: 200
    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_ENDERMAN_TELEPORT", volume: 1.0, pitch: 0.7 } } ] }
      - { trigger: ATTACK, condition: "%victim.type% != \"PLAYER\"", effects: [ { DAMAGE_MOD: { side: attack, mode: add, amount: 30 } } ] }
  100:
    cooldown: 600
    duration: 200
    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_ENDERMAN_TELEPORT", volume: 1.0, pitch: 0.7 } } ] }
      - { trigger: ATTACK, condition: "%victim.type% != \"PLAYER\"", effects: [ { DAMAGE_MOD: { side: attack, mode: add, amount: 40 } } ] }
