# Cage Pet — an ACTIVE pet (ADR-0052): right-click to trap your nearest enemy (and yourself) in a temporary
# iron-bars cage — stone-brick roof/floor, a 3×4×3 air interior, built 2 blocks above the midpoint between
# you, both parties teleported to opposite interior cells facing each other, gone after 7.5s (150 ticks).
# The CAGE effect safety-checks the FULL structure volume (every cell must be air) before placing anything.
# The %nearbyenemies% condition fails the use BEFORE the cooldown arms when no one is around; only the
# cooldown scales with level.
