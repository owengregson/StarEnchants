# Fish Pet — a PASSIVE pet (ADR-0052): passive income while the head sits in the hotbar. Every hour it
# deposits a percent of YOUR OWN balance back to you (interest, minted new — never taken from anyone); one
# deposit is ceilinged by the universal pets.max-percent-money-cap (config.yml — the cosmic $1,000,000).
# Inert without an economy provider (and on the 1.8 lane, a recorded §6 degrade). The REPEATING timer rides
# the hotbar presence: pocketing the pet stops the clock.
display: "Fish"
color: "&9"
type: PASSIVE
head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYTYyZWNiMWMzZmFmYjc2NmIyMzQ1OTFhZDU5NWJhMTk2YTU3ODc4Nzg0NGQyN2FlNmE0YzEyYmMxOTA3MzI5NyJ9fX0="
description:
  - "&9&l* Generates passive income for you"
levels:
  # 0.7% → 0.8% → 0.9% → 1.0% of your balance, every hour (72000 ticks).
  1:   { trigger: REPEATING, repeat: 72000, effects: [ { MODIFY_MONEY: { mode: interest_percent, amount: 0.7, who: "@Self" } } ] }
  25:  { trigger: REPEATING, repeat: 72000, effects: [ { MODIFY_MONEY: { mode: interest_percent, amount: 0.8, who: "@Self" } } ] }
  50:  { trigger: REPEATING, repeat: 72000, effects: [ { MODIFY_MONEY: { mode: interest_percent, amount: 0.9, who: "@Self" } } ] }
  100: { trigger: REPEATING, repeat: 72000, effects: [ { MODIFY_MONEY: { mode: interest_percent, amount: 1.0, who: "@Self" } } ] }
