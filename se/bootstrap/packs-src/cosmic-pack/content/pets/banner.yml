# Matrix: 12-pets.md § Banner Pet
# THE PAYLOAD IS EXTERNAL AND IS NOT AUTHORED. The whole ability is "give the player their faction's banner
# item, built with no soul cost and attributed to the Banner Pet" — a factions plugin plus a custom-items
# build that are absent from the tree, with the banner's own material/name/lore codex-UNRESOLVED besides. SE
# ships no factions of its own, and inventing a banner item would be inventing an identity the codex never
# recorded, so this file takes the `enchants/auto-sell.yml` treatment the sibling `alchemist.yml` also takes:
# obtainable, identity and economy real, the behaviour recorded here and not implemented. A port ruling on the
# factions bridge (the same one `enchants/target-tracking` waits on) turns it back on.
#
# WHAT THE JAR DID, recorded and not shipped:
#   1. guard: not in a faction → `§c§l(!) §cYou must be in a faction to use this pet!`
#   2. payload: build the faction-banner custom item (no soul cost, attributed "Banner Pet") and put it in the
#      inventory; a missing banner definition printed `§cNo banner found!`. Both strings travel with the
#      payload — neither is a family line, and neither is authored below.
#   3. success: `§a§lPET (§aBanner Pet§a§l)§a:§f Banner added to inventory!` — DELIBERATELY NOT AUTHORED. A
#      line announcing an item the pack cannot deliver is worse than silence; it goes back verbatim with the
#      payload. (Its own lore oversells the jar anyway: "Spawn, Place" while the jar only ever GAVE the item.)
#   4. the two cues and the gated XP grant — the rows this file DOES author.
# The verbatim ability lore, likewise recorded rather than rendered:
#      `§7§f§lAbility` / `§7§7Spawn, Place /f banner` / `§7§7at current location.` / `§7§7(no soul cost)`
# `description` below is authored honestly instead (the auto-sell.yml convention); the flavour block is the
# source's own, verbatim, and the cooldown block is real.
#
# THE COOLDOWN IS KEPT, and that is a deliberate choice rather than leftovers: it is the only thing between an
# unauthored ability and a right-click that levels the head for free. Measured 0 s (§A.6's inverted
# arithmetic — no pet cooldown ever blocked); the AS-INTENDED ladder ships,
# `max(120, 720 - 60 x (level - 1))` s = 720/660/600/540/480/420/360/300/240/180 (the 120 s floor is
# unreachable) = 14400…3600 t (ledger D-12-14).
# THE XP HALF IS FULLY IN SCOPE and ships whole: 500 a use behind a 24 h gate (`window: 1440` minutes — the
# jar's 86 400 000 ms), curve flat 1000, cap 10. The gate stamp rides the ITEM, so it follows the pet through
# a trade and a freshly minted pet earns immediately, which is exactly the recorded behaviour.
# The rest of the family shape (USE = right-click per ledger D-12-1, the no-op hotbar ticker, the verbatim
# XP/level-up lines, the spectator guard, and the family-wide `items/pet.yml` + `config.yml` likeness
# authored once for the folder) is written out in `anti-teleblock.yml` and not repeated.
# era: `LAVA_POP` / `ITEM_PICKUP` are the 1.7/1.8 spellings, authored modern per the pack convention;
# `Aliases.SOUND` carries NEITHER row yet (`LAVA_POP`->`BLOCK_LAVA_POP`, `ITEM_PICKUP`->`ENTITY_ITEM_PICKUP`),
# so both cues are silent on the legacy lane until the sweep lands them.
display: "Banner Pet"
color: "&e"
type: ACTIVE
# head: the per-pet skull texture is not matrix-recorded, so the mint falls back to a plain PLAYER_HEAD.
descriptor:
  - "§7§7A rallying entity that"
  - "§7§7has the magical power to"
  - "§7§7summon /f banners at its"
  - "§7§7owner's location at will."
# AUTHORED, not matrix-recorded: the verbatim ability lines advertise a /f banner this pack cannot mint (see
# the header). They go back verbatim the day the factions bridge lands. The cooldown block IS the source's,
# and `{cooldown}` binds to `{TIME_FORMATTED}` — the live bracket's value in the recorded TimeUtils shape,
# L1 `12m` through L10 `3m`.
description:
  - "§7"
  - "§7§f§lAbility"
  - "§7§7Its banner comes from a factions"
  - "§7§7plugin this pack does not carry —"
  - "§7§7so nothing is summoned."
  - "§7"
  - "§7§f§lCooldown"
  - "§7§7 {TIME_FORMATTED}"
max-level: 10
exp-curve: { base: 1000, per-level: 0 }   # flat 1000/level, 9000 to cap 10; 500 a use, once per 24 h
levels:
  # Ten brackets because the cooldown is the one thing that scales — the XP grant is flat 500 at every rung
  # and the unauthored payload never scaled at all. The cue ability is index 0, so it carries the pet-wide
  # cooldown scope; the spectator refusal authors `cooldown: 0` and scopes to its own key.
  1:
    cooldown: 14400
    abilities:
      - condition: '%actor.gamemode% != "SPECTATOR"'
        effects:
          - { SOUND: { sound: "BLOCK_LAVA_POP", volume: 1.1, pitch: 1.0 } }
          - { ITEM_XP_TRACK: { amount: 500, window: 1440, message: "§a§l+ §a{xp} Pet EXP §a§l[§7{exp}/{needed}§a§l]", level-up-message: "§a§l*** {item} §a has increased to level §a§n{level}§a§l ***" } }
          - { SOUND: { sound: "ENTITY_ITEM_PICKUP", volume: 1.0, pitch: 1.1 } }
      - condition: '%actor.gamemode% == "SPECTATOR"'
        cooldown: 0
        effects:
          - { MESSAGE: { text: "§c§lPET: §cYou cannot use that ability while spectating!" } }
