# Kraken Pet — a PASSIVE pet (ADR-0060): permanent Water Breathing while the head sits in the hotbar
# (drowning can never begin — the maintained-potion driver keeps it truly permanent, every era) plus an
# underwater speed boost via the worn WATER_SPEED channel (the vanilla water_movement_efficiency
# attribute, reconciled like worn max-health).
#
# CALIBRATION: efficiency values are solved from the vanilla water-travel formula for the swimming
# (off-ground, non-sprint) case — 0.09/0.14/0.20/0.26 land as ≈ +10/15/20/25% steady-state swim speed.
# Sprint-swimming realizes roughly half the boost; walking on the bottom somewhat more. The attribute
# exists on 1.21+ only: older modern servers (1.17.1–1.20.6) and the 1.8.9 lane keep the drowning
# immunity but get no speed boost (a recorded degrade — nothing in those versions can raise swim speed
# by an exact percent).
