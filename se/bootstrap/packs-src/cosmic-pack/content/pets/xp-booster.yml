# interactions: nothing in the corpus stacks with this — no enchant, set, mask or crystal multiplies vanilla
# XP. The one cross-family read is `enchants/experience` (matrix/06, still deferred), which rides MINE and
# scales the broken block's own yield; the two would compose on mined XP if both ever ran, and that is the
# jar's behaviour too (separate systems, separate sites).
