    abilities:
      - { effects: [ { SOUND: { sound: "ENTITY_WITHER_HURT", volume: 0.7, pitch: 0.6 } }, { POTION_LOCK: { effect: "HEALTH_BOOST", ticks: 40, who: "@Self" } }, { MAX_HEALTH_DRAIN: { fraction: 1.0, baseline: 20, duration: 40, who: "@Self" } } ] }
