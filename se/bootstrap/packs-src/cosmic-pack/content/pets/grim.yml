color: "&f"
type: ACTIVE
head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjUzOTBmNzJjN2YyMWQ5YTQ2ZTYxMDE4M2E2NTI1YzllNWU2MmE1YzI3ZDUyNTRmNjE2YzY0NzI2OTBjMzc4ZSJ9fX0="
descriptor: "&eA reaper that trades borrowed life for borrowed power. The scythe cuts both ways."
description:
  - "&f* Removes your overhealth in exchange for double damage"
