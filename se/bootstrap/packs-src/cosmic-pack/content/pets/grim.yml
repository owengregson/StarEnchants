# Grim Pet — an ACTIVE pet (ADR-0052): right-click to TRADE — your overhealth vanishes for the window while
# every hit you land in it counts DOUBLE. Overhealth in this pack is two-layered, so both are taken:
# POTION_LOCK strips the maintained Overload HEALTH_BOOST pool and keeps re-stripping through the window
# (the passive driver cannot re-assert it), and MAX_HEALTH_DRAIN takes any attribute-base overhealth above
# the vanilla 20; both restore on their own as the window closes. Both the window and the cooldown scale.
#
# CALIBRATION: the damage rider is an EFFECTIVE value under this pack's combat.attack-scale 5.0 — the fold
# multiplies the summed attack fraction by the scale (ADR-0050 R2), so add: 20 lands as ×2.0 final (true
# double); authoring 100 here would land as the capped 0.70 × 5 = ×4.5. Retune the riders if you change
# the attack-scale knob.
