# Matrix: 11-masks.md § Purge Mask
# One flat outgoing percent while the masked helmet is worn: measured `setDamage(damage * 1.025)` = +2.5 %.
# The family's damage multipliers live in ONE EntityDamageByEntityEvent handler with no EntityDamageEvent twin,
# so the defensive double-fire (00-MECHANICS §3, deviation D-001) does not touch masks — +2.5 % is already the
# single-pass, final number. The source multiplies a separate damage channel; this contributes the same
# percent to the ONE additive outgoing fold (ADR-0012).
#
# CALIBRATION: attack-side percents are divided by this pack's `combat.attack-scale` at authoring time
# (ADR-0050 R2). cosmic-pack runs attack-scale 1.0, so the authored 2.5 IS the advertised +2.5 % final.
# Retune if that knob moves.
#
# MULTI-MASK: the source routes this through its per-player mask lookup, which makes it silently dead inside a
# folded Multi-Mask (the family bug). The port keeps every folded child active — deviation D-11-1 — and needs
# nothing here: a composite helmet resolves each child's abilities as if that child alone were worn (ADR-0074).
display: "Purge Mask"
color: "§c"
