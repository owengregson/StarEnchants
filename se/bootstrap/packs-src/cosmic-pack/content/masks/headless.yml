# Matrix: 11-masks.md § Headless Mask
# Cosmetic only — no listener in the source references this mask, so it has no ability of any kind. Authored as
# a ROSTER MARKER (the enchants/metaphysical + enchants/sticky precedent): a mask file must declare at least one
# ability with a trigger, so the identity ships on an empty PASSIVE and the loader's "declares no effects"
# warning is the accurate statement of what this mask does. The mask is real, mintable, attachable and
# repaints a helmet; it just does nothing else.
#
# DISPLAY: `display` is the BARE name and carries the whole verbatim string "Headless Mask" — it is NOT
# "Headless" plus a template suffix. SIX of the family's 27 verbatim NAMES carry no " Mask" at all — Pumpkin
# Monster, Santa, Reindeer, Party Hat, Death Knight and Multi-Mask, five of them mask defs (Multi-Mask is the
# composite likeness, ADR-0074, not a def) — so this pack's items/mask.yml must template `{COLOR}&l{NAME}` and
# never the shipped default `{COLOR}&l{NAME} Mask`.
display: "Headless Mask"
color: "§6"
# Head texture re-encoded from the codex's recorded texture hash
# 9abd608e7dace2e6992e47fbb2dcf6648d975cae8d32615c6cf03edc7db32868 (skin model `slim`, profile `Bandiito`)
# into the standard SKIN-url value the worn repaint reads. The slim/classic distinction is arm geometry and
# never shows on a head, so it is dropped rather than encoded.
# Source quirk (matrix § numbers): this is the ONLY mask whose `base64` field is populated, with a 62-hex-char
# value that is not its own 64-char texture hash and that nothing ever reads. Not ported — it has no effect.
head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvOWFiZDYwOGU3ZGFjZTJlNjk5MmU0N2ZiYjJkY2Y2NjQ4ZDk3NWNhZThkMzI2MTVjNmNmMDNlZGM3ZGIzMjg2OCJ9fX0="
# Lore VERBATIM. There is no `ability` field on a mask def — the source's `specialAbility` line (the text its
# ATTACHED stamp echoes) is null here, and the lore below is the whole authored block.
description:
  - "§7A terrifying Mask from the"
  - "§7grave of the Headless Horseman."
  - "§6§l * §6October 2018"
# ACQUISITION: help-menu visible (`active: true`); NEVER in the random-mask generator pool (matrix preamble
# § Generator pools — Headless is one of the seven ungenerated masks). Neither the menu flag nor a pool weight
# has a mask-def surface; both are recorded in deferred-content.md, batch 11.
# ERA: nothing beyond the family head seam (a loose mask is SKULL_ITEM:3 on 1.8.9 vs PLAYER_HEAD modern) — the
# masks repaint era seam (ADR-0053) already owns it.
trigger: PASSIVE
effects: []
