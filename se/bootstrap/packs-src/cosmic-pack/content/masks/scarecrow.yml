# Matrix: 11-masks.md § Scarecrow Mask
# "Infinite Food", ported as the advertised effect rather than the measured one. The source cancels only food
# LEVEL LOSSES (gains pass through), which freezes hunger wherever it stood at equip time; the port tops the
# wearer to a full 20 every second, so the mask reads as its own lore does — deviation D-11-2.
#
# The 60 t rescan heartbeat that maintains a worn mask in the source becomes a REPEATING re-arm here; PASSIVE
# is a start/stop lifecycle fired once at equip, so a per-second top-up has to be a repeat. `repeat: 20` (1.0 s)
# is the family's maintained cadence, and it simply stops when the mask leaves the helmet.
#
# MODIFY_FOOD's `cancel-drain` mode would reproduce the source's freeze exactly. It is deliberately not used:
# the matrix ruled the advertised behaviour as intended and logged the difference as D-11-2.
#
# INTERACTION: a SUPPRESS window scoped KIND on MODIFY_FOOD (the Chef-mask idiom, ADR-0053 §7) silences this
# top-up at gate 5 — an interaction the source could not have had. Nothing to author here; the suppressing
# side owns it. In the source this ability routes through the equipped-mask lookup, so it already worked
# inside a folded Multi-Mask; under ADR-0074 every folded child works, so the routing split costs nothing.
display: "Scarecrow Mask"
color: "§e"
# Head texture re-encoded from the codex's recorded hash
# f1eec8757ba82ff916793ffe35de22548c1faf5bbe05cc388b32a094814f5983 (profile `Merchant`) into the standard
# SKIN-url value the worn repaint reads.
head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZjFlZWM4NzU3YmE4MmZmOTE2NzkzZmZlMzVkZTIyNTQ4YzFmYWY1YmJlMDVjYzM4OGIzMmEwOTQ4MTRmNTk4MyJ9fX0="
# Lore VERBATIM. A mask def has no `ability` field, so the source's `specialAbility` string — "§cInfinite Food",
# the text its ATTACHED stamp echoes — is line 1 below, exactly where its own lore repeats it.
description:
  - "§cInfinite Food"
  - "§7An empty husk of a"
  - "§7once tortured soul left to rot."
  - "§6§l * §6November 2018 CC"
# ACQUISITION: help-menu visible; common generator pool, 90 %/11 = 8.1818 % per roll (matrix preamble
# § Generator pools). No pool or weight surface on a mask def — see deferred-content.md, batch 11.
# ERA: nothing beyond the family head seam (ADR-0053).
trigger: REPEATING
repeat: 20
# `give` is clamped to 20 by the effect, so "top up to full" needs no ceiling of its own.
effects:
  - { MODIFY_FOOD: { amount: 20, mode: give, who: "@Self" } }
