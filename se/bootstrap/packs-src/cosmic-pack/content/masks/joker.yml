  - "§c+4s Combat Tag on enemy players"
  - "§c-3s Combat Tag on you"
  - "§7Everyone takes everything so"
  - "§7very seriously, you're just trying"
  - "§7to.. haHahaHahaHahaHahaHahaHa!"
  - "§6§l * §6Summer Savage Lootbox Release"
# THE STAMP/LORE DIVERGENCE HAS NO HOME, and needs none. The jar's ATTACHED stamp read this mask's separate
# ability string, `§cIncrease Combat Tag on players by 4s`, which does not match lore line 1 above — the
# matrix records both and says transcribe both as-is. A mask def carries display / colour / description and no
# ability field, and the port's masked-helmet line renders the mask's NAME alone
# (items/mask.yml `lore-while-on-item`), so there is no second string slot to diverge in. The lore, which is
# what a player reads on the item, is verbatim; the stamp text is dropped rather than invented somewhere else.
# DELIBERATELY EFFECT-LESS, the metaphysical.yml / sticky.yml form: a mask must declare at least one ability
# (an ability-less mask is a load error), so the cosmetic form is one PASSIVE ability with an empty effect
# list. It arms nothing, costs nothing at runtime, and keeps the mask rollable, mintable, wearable and
# displayed — which is the entire entry.
# ACQUISITION: RARE generator pool, 10 %/9 = 1.1111 % per roll; active in the mask help menu. A mask def
# carries no tier/weight/pool field and this pack has no mask-generator surface, so the percentage is ledgered
# here rather than authored (family preamble).
# era: head seam only — ADR-0053 owns it (`SKULL_ITEM:3` + a reflective authlib profile on 1.8.9,
# `PLAYER_HEAD` on modern). Nothing else on this entry touches a versioned handle.
trigger: PASSIVE
effects: []
