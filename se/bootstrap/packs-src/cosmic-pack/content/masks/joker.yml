# Matrix: 11-masks.md § Joker Mask
# A COSMETIC mask: verbatim identity, no behaviour. The advertised combat-tag deltas (+4 s on enemies, -3 s on
# yourself) are advertised-only — no combat-tag code exists in the mask jar and no external call site was ever
# found (matrix-UNRESOLVED: an absent combat-tag plugin, or never implemented). The matrix explicitly does NOT
# record this as a surface gap, and neither does this file: StarEnchants has no combat-tag subsystem, so a gap
# would be a demand for a whole engine rather than a primitive, and the R9 note-only rule (README § rulings)
# is the shape for a behaviour that depends on a server subsystem the port does not carry. Revisit only if a
# combat-tag system ever lands.
display: "Joker Mask"
color: "§5"
# `display` carries the FULL matrix name and the likeness renders `{COLOR}&l{NAME}` (the cosmic family's names
# are irregular — Party Hat, Death Knight, Santa, Reindeer, Pumpkin Monster and Multi-Mask carry no " Mask"
# suffix — so the whole name lives in the def), reproducing `§5§lJoker Mask`. The shared trailing lore block
# is likeness-level (family preamble).
# HEAD TEXTURE: not carried by the matrix decomposition; the codex records the texture hash
# `843d7430...382c84a4` (profile MysteryMerchant, model `slim`, timestamp 1557846185613), re-encoded here into
# the pack's standard profile blob (the Rift entry's "valid re-encoded texture" rule, applied family-wide).
# The slim model flag is not carried — the blob holds the skin URL alone, which is what head minting reads on
# both eras.
head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODQzZDc0MzA1ZGZlNWY2OTExZjA2MmQ4NjJiYjg5ZTVhNjFiNGNmNzQ0YzJiMDgxNmU1YzI1NGQzODJjODRhNCJ9fX0="
