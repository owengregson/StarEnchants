# Spooky — eerie diamond set: defensive bonus plus the Gravedigger weapon.
display: "{#e4911b}&lSpooky"
description: "{#e4911b}Don the Spooky set and embrace the eerie whispers of the night, cloaked in mystery and shadow."
complete: 4
# Announce on a completion transition (Cosmic Pack default; set name + colour authored verbatim).
announce: true
equip-message: "\n{#e4911b}&l** Spooky SET EQUIPPED {#e4911b}&l**\n"
remove-message: "\n&7&l** Spooky SET REMOVED **\n"
armor:
  enchants:
    PROTECTION: 4
    UNBREAKING: 3
  lore:
    - "{#e4911b}Don the Spooky set and embrace the eerie whispers of the night, cloaked in mystery and shadow."
    - ""
    - "{#e4911b}&lSPOOKY SET BONUS"
    - "{#e4911b}* Deal 20% more damage to all enemies."
    - "{#e4911b}* Enemies deal 12% less damage to you."
    - "{#e4911b}* Scarecrow Ability"
    - ""
    - "{#e4911b}&lSCARECROW"
    - "{#e4911b}* Chance to replace your enemy's helmet with a pumpkin for 3 seconds"
    - "&7&o(Requires all four Spooky set items.)"
  pieces:
    helmet:     { material: DIAMOND_HELMET,     name: "{#e4911b}&lHaunted Headgear&r" }
    chestplate: { material: DIAMOND_CHESTPLATE, name: "{#e4911b}&lMysterious Platemail&r" }
    leggings:   { material: DIAMOND_LEGGINGS,   name: "{#e4911b}&lOminous Leggings&r" }
    boots:      { material: DIAMOND_BOOTS,      name: "{#e4911b}&lSpooky Boots&r" }
weapon:
  enchants:
    SHARPNESS: 5
    UNBREAKING: 3
  material: DIAMOND_SWORD
  name: "{#e4911b}&lGravedigger&r"
  lore:
    - "{#e4911b}Unearth the power of the dead with the Gravedigger, a weapon that delves into the shadows and stirs the restless spirits."
    - ""
    - "{#e4911b}&lSPOOKY WEAPON BONUS"
    - "{#e4911b}* Deal 5% more damage to all enemies"
    - "&7&o(Requires all four Spooky set items.)"
# Behaviours: on:armor fires while the set is complete; on:weapon also requires the set weapon held.
bonuses:
  - on: armor
    trigger: DEFENSE
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: defense, mode: add, amount: 12 } }
  # Scarecrow — 15% on hit (30s cd; mob and player targets cool down separately): pumpkin-head the victim for 3s.
  # Removing the helmet drops their set
  # below complete, so their helmet's set bonus deactivates for the window. Death/quit stay normal — the real
  # helmet drops / is kept (a holy white scroll still applies), never the pumpkin.
  - on: armor
    trigger: ATTACK
    chance: 15
    cooldown: 600
    effects:
      - { SOUND: { sound: "ENTITY_WITHER_DEATH", volume: 1.0, pitch: 1.4 } }
      - { EQUIP_SWAP: { slot: helmet, material: CARVED_PUMPKIN, duration: 60, who: "@Victim" } }
      - { PARTICLE: { particle: SMOKE_LARGE, count: 12 } }
      - { MESSAGE: { channel: title, text: "{#e4911b}&l** SCARECROW **", subtitle: "&7from &c{ATTACKER}", who: "@Victim" } }
      - { MESSAGE: { text: "{#e4911b}&l** SCARECROW &r&7[&f{VICTIM}&7] &r{#e4911b}&l**" } }
  - on: weapon
    trigger: ATTACK
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: attack, mode: add, amount: 25 } }
      - { POTION: { effect: BLINDNESS, level: 1, duration: 40, who: "@Victim" } }
      - { POTION: { effect: SLOWNESS, level: 1, duration: 40, who: "@Victim" } }
