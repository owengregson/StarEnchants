# Clarity — radiant diamond set: damage up, reduction, and a Bless passive.
display: "{#ffa8f8}&lClarity"
description: "{#ffa8f8}Shine with the pure light of the Clarity set, crystal clear and serene, a beacon of prosperity and truth."
complete: 4
# Announce on a completion transition (Cosmic Pack default; set name + colour authored verbatim).
announce: true
equip-message: "\n{#ffa8f8}&l** Clarity SET EQUIPPED {#ffa8f8}&l**\n"
remove-message: "\n&7&l** Clarity SET REMOVED **\n"
armor:
  enchants:
    PROTECTION: 4
    UNBREAKING: 3
  lore:
    - "{#ffa8f8}Shine with the pure light of the Clarity set, crystal clear and serene, a beacon of prosperity and truth."
    - ""
    - "{#ffa8f8}&lCLARITY SET BONUS"
    - "{#ffa8f8}* Deal 15% more damage to all enemies"
    - "{#ffa8f8}* Enemies deal 5% less damage to you"
    - "{#ffa8f8}* Bless Passive Ability"
    - ""
    - "{#ffa8f8}&lBLESS"
    - "{#ffa8f8}* You are immune to negative potion effects."
    - "&7&o(Requires all four Clarity set items.)"
  pieces:
    helmet:     { material: DIAMOND_HELMET,     name: "{#ffa8f8}&lShimmering Helm&r" }
    chestplate: { material: DIAMOND_CHESTPLATE, name: "{#ffa8f8}&lGlistening Armor&r" }
    leggings:   { material: DIAMOND_LEGGINGS,   name: "{#ffa8f8}&lRadiant Leggings&r" }
    boots:      { material: DIAMOND_BOOTS,      name: "{#ffa8f8}&lLuminous Boots&r" }
weapon:
  enchants:
    SHARPNESS: 5
    UNBREAKING: 3
  material: DIAMOND_SWORD
  name: "{#ffa8f8}&lRadiant Blade&r"
  lore:
    - "{#ffa8f8}A blade forged in the light of clarity, pure and unyielding, cutting through the darkness with ease."
    - ""
    - "{#ffa8f8}&lCLARITY WEAPON BONUS"
    - "{#ffa8f8}* Deal 10% more damage to all enemies"
    - "&7&o(Requires all four Clarity set items.)"
# Behaviours: on:armor fires while the set is complete; on:weapon also requires the set weapon held.
bonuses:
  - on: armor
    trigger: DEFENSE
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: defense, mode: add, amount: 5 } }
  - on: weapon
    trigger: ATTACK
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: attack, mode: add, amount: 25 } }
  # Bless — strip HARMFUL effects continuously while the full set is worn (~4x/sec), so the wearer can never
  # HOLD a debuff (their own or an enemy's). Positives are untouched. The "Bless Passive Ability" lore line.
  - on: armor
    trigger: REPEATING
    repeat: 5
    chance: 100
    effects:
      - { CURE: { category: HARMFUL, who: "@Self" } }
      - { PARTICLE: { particle: SPELL_INSTANT, count: 6 } }
