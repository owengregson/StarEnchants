# Matrix: 10-armor-sets.md § Necromancer — ability set ("M-Kit"), frame per § Ghost and §A.10-A.15, §C.3-C.5.
# Family (§A): completion is all-or-nothing at 4/4 (no 2/3-piece tiers), identity is engine PDC + WornState
# (the jar's forgeable lore matching and its 30 s stale-cache window are infrastructure-class bugs, not ported),
# and there are NO cooldowns anywhere.
#
# An ability set has no set proc: every "Necromancer ability" is a mastery enchant rolled onto the pieces at
# mint, decomposed in matrix/07. What the SET carries is the heroic M-Kit tier's flat incoming reduction, the
# halved armour values, and the guaranteed boots roll.
display: "§2§lNecromancer"
# display colour is the set's own piece branding (§2); a set display name is matrix-recorded only for
# Architect, where it deliberately disagrees with its items.
# description: not matrix-recorded (factual paraphrase)
description: "§2A Mastery Kit — the power is in the mastery enchants rolled onto the pieces, not in a set proc."
complete: 4
# Equipping is silent: the ability sets carry an empty equip description (measured), so no announce and no
# equip/remove line.
announce: false
armor:
  # Matrix (§ Ghost, the frame this set is identical to): Unbreaking III + Protection IV on every piece.
  enchants:
    UNBREAKING: 3
    PROTECTION: 4
  # The per-piece flavour (verbatim, incl. `magick` and the chestplate's missing full stop), the dye and the
  # named roster rolls are authored on the `pieces:` members below. What STILL has no home is recorded here:
  #   per-piece heroic append — a member's `lore:` prints ABOVE the shared block, and this pair belongs
  #     between its blank and its last line:
  #     helmet "§7+2 Armor Value" / "§7810 Durability"    chestplate "§7+4 Armor Value" / "§71000 Durability"
  #     leggings "§7+3 Armor Value" / "§7935 Durability"  boots "§7+2 Armor Value" / "§7686 Durability"
  #   armour values halved by the M-Kit rule: 2/4/3/2 (11 across the set, against 20 for non-M-Kit gear)
  #   the per-slot durabilities 810/1000/935/686
  #   per-piece M-Kit incoming reduction: chest 16 %, legs 13 %, boots 8 %, helm 8 % — folded into the single
  #     completion bonus below, at the measured full-set total
  #   the `N base` roster each piece draws from at the family's nearly-maxed draw min(M, max(1, M-2) + rand(3)):
  #     the codex gives only its SIZE (8/9/8/8; the leggings' eighth entry is `Spirits`, against Ghost's seven)
  #     and never enumerates an entry, so there is nothing for the roll form to name
  #   the HALF-POINT probabilities: a roster entry's `chance` is an integer percent, so 17.5 % Alien Implants
  #     (helmet), 17.5 % Godly Overload / 22.5 % Planetary Deathbringer / 22.5 % Divine Enlighted (chest) and
  #     22.5 % Ethereal Dodge / 12.5 % Guided Rocket Escape (boots) have no spelling
  #   the boots' 35 % Phoenix RE-ROLL, which OVERWRITES the base roll it lands on (measured) — a re-roll over
  #     an unenumerated roster is not a mint entry however chances are spelled
  lore:
    - ""
    - "§4This armor is stronger than diamond."
  # Every piece is #00FF00 leather (Bukkit GREEN — brighter than the Necromancer shard's own dye, a measured
  # mismatch, kept). `heroic: true` is DELIBERATELY NOT set, though the pieces do mint heroic: the stamp
  # routes items/heroic.yml's per-piece reduction into the same additive channel `DamageFold` gives the 45 %
  # completion row below, and that row already IS this set's heroic wall folded — stamping the members would
  # bill it twice (45 + 27). Blocked on the M-Kit's own steeper heroic tier, which is a second grade of
  # items/heroic.yml and not a gap in this surface (ADR-0073).
  # `Gears` at MAX is guaranteed on the boots and boots only — armor.enchants above is set-wide and would
  # stamp all four.
  pieces:
    helmet:
      material: LEATHER_HELMET
      name: "§2§lSkull of Souls"
      color: "#00FF00"
      lore:
        - "§7§oA floating skull imbued with"
        - "§7§oevil enchantments and demonic energy."
      enchants:
        enchants/valor: { chance: 60, nearly-maxed: 5 }
        enchants/angelic: { chance: 60, nearly-maxed: 5 }
        enchants/tank: { chance: 60, nearly-maxed: 4 }
        enchants/paladin-armored: { chance: 20, nearly-maxed: 4 }
    chestplate:
      material: LEATHER_CHESTPLATE
      name: "§2§lRobe of the Necromancer"
      color: "#00FF00"
      lore:
        - "§7§oSpider Silk woven robes that camouflage"
        - "§7§ointo the darkness of the night"   # verbatim, missing full stop and all
      enchants:
        enchants/valor: { chance: 60, nearly-maxed: 5 }
        enchants/angelic: { chance: 60, nearly-maxed: 5 }
        enchants/tank: { chance: 60, nearly-maxed: 4 }
        enchants/paladin-armored: { chance: 20, nearly-maxed: 4 }
        enchants/vengeful-diminish: { chance: 15, nearly-maxed: 6 }
    leggings:
      material: LEATHER_LEGGINGS
      name: "§2§lTattered Wrappings of Death"
      color: "#00FF00"
      lore:
        - "§7§oOnce tormented by death, it now"
        - "§7§oloyally serves and protects you."
      enchants:
        enchants/valor: { chance: 60, nearly-maxed: 5 }
        enchants/angelic: { chance: 60, nearly-maxed: 5 }
        enchants/tank: { chance: 60, nearly-maxed: 4 }
        enchants/paladin-armored: { chance: 20, nearly-maxed: 4 }
        enchants/immortal: { chance: 30, nearly-maxed: 4 }
    boots:
      material: LEATHER_BOOTS
      name: "§2§lDemon Foot"
      color: "#00FF00"
      lore:
        - "§7§oA good luck charm for those who are"
        - "§7§omasters of the dark magick of necromancy."
      enchants:
        enchants/gears: 3   # guaranteed, at Gears' own max
        enchants/valor: { chance: 60, nearly-maxed: 5 }
        enchants/angelic: { chance: 60, nearly-maxed: 5 }
        enchants/tank: { chance: 60, nearly-maxed: 4 }
        enchants/paladin-armored: { chance: 20, nearly-maxed: 4 }
# Behaviours. The jar grants the M-Kit reduction PER WORN PIECE (§C.3-C.5); the engine gates a set bonus on
# completion, so the four component stats fold into this one 4/4 bonus at their measured full-set 45 %.
# Additive here, multiplicative in the jar (project-wide damage model, a global ADR — not a per-item deviation).
# The only delta is partial wear: two worn pieces pay 16+13 in the jar and nothing here until the fourth lands.
# `items/heroic.yml` carries ONE flat percent for every heroic piece, not a per-slot ladder — the day such a
# ladder lands this row must go, or the two channels double-count.
bonuses:
  - on: armor
    trigger: DEFENSE
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: defense, mode: add, amount: 45 } }
# Mastery pool (matrix/07; 2 drawn without replacement, 50 % each): Mortal Coil, Soul Siphon, Rot and Decay,
# Demonic Gateway. Recorded, not referenced: a set file has no root key for a pool, the draw belongs to the
# minter, and three of the four are still unauthored in this pack.
#
# Interaction-layer rules the set decomposition does NOT own, recorded but not authored here:
#  * piece identity is data (a per-set NBT tag in the jar -> engine PDC component); pieces refuse normal enchant
#    books unless the book carries a matching Mastery Shard (§C.9: 100 % apply, one of each set per book).
#    Armor Crystals CAN be applied to M-Kit gear that carries no blocked mastery enchant (§A.15).
#  * an Anti-M-Kit Crystal (Necromancer) on ANY single worn piece of a victim cancels this set's mastery-pool
#    procs outright — 100 %, no roll (the crystal's percent is only its apply chance). Owned by the crystals family.
#  * Rot and Decay (this pool) is the enchant Mother of Yijki's World Ender claims immunity to; that suppression
#    rule is recorded on the Mother of Yijki entry.
#  * heroic pieces negate an enemy's Infinite Luck at 12.5 % per piece — ledger D-10-1 (the jar counts them from
#    the Infinite Luck holder's own armour, a self-negation; the port counts the attacker's). Only Ghost's legs
#    can roll Infinite Luck, so this set meets the rule from the other side.
#  * outpost world gates (TRAINEE/VANILLA/HERO, §A.8) block set bonuses; off by default in the port — a server
#    that wants them adds `disabled-worlds:` to the bonus above.
# era: leather dye is era-safe on both lanes; the extra armour value needs defence mods on 1.8.9 (no armour
# attribute); the nearly-maxed roll distribution is reproduced by the pack minter, not by item data.
