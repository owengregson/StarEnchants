# Fantasy — diamond set of mythical heroes; arcane weapon and a trap passive.
display: "{#83cb7b}&lFantasy"
description: "{#83cb7b}Embark on epic adventures with the Fantasy set, armaments of mythical heroes and timeless tales."
complete: 4
# Announce on a completion transition (Cosmic Pack default; set name + colour authored verbatim).
announce: true
equip-message: "\n{#83cb7b}&l** Fantasy SET EQUIPPED {#83cb7b}&l**\n"
remove-message: "\n&7&l** Fantasy SET REMOVED **\n"
armor:
  enchants:
    PROTECTION: 4
    UNBREAKING: 3
  lore:
    - "{#83cb7b}Embark on epic adventures with the Fantasy set, armaments of mythical heroes and timeless tales."
    - ""
    - "{#83cb7b}&lFANTASY SET BONUS"
    - "{#83cb7b}* Deal 20% more damage to all enemies"
    - "{#83cb7b}* Fantasy Trap Ability"
    - ""
    - "{#83cb7b}&lFANTASY TRAP"
    - "{#83cb7b}* Chance to trap your enemy in an unbreakable cobweb for 2 seconds"
    - "&7&o(Requires all four Fantasy set items.)"
  pieces:
    helmet:     { material: DIAMOND_HELMET,     name: "{#83cb7b}&lEnchanted Helmet&r" }
    chestplate: { material: DIAMOND_CHESTPLATE, name: "{#83cb7b}&lMythic Platemail&r" }
    leggings:   { material: DIAMOND_LEGGINGS,   name: "{#83cb7b}&lLost Legwear&r" }
    boots:      { material: DIAMOND_BOOTS,      name: "{#83cb7b}&lAdventurer's Boots&r" }
weapon:
  enchants:
    SHARPNESS: 5
    UNBREAKING: 3
  material: DIAMOND_SWORD
  name: "{#83cb7b}&lArcane Blade&r"
  lore:
    - "{#83cb7b}Wield the mysteries of magic with the Arcane Blade, a sword infused with ancient and powerful spells."
    - ""
    - "{#83cb7b}&lFANTASY WEAPON BONUS"
    - "{#83cb7b}* Deal 5% more damage to all enemies"
    - "&7&o(Requires all four Fantasy set items.)"
# Behaviours: on:armor fires while the set is complete; on:weapon also requires the set weapon held.
bonuses:
  # Fantasy Trap — 25% on hit (30s cd; mobs and players are separate cooldown routes): an unbreakable cobweb
  # for 2s — vanilla physics halts them — and lock their SPEED away for those same 2s (continuously
  # re-stripped, so it stays denied the whole time they're webbed). The cobweb reverts to air after.
  - on: armor
    trigger: ATTACK
    chance: 25
    cooldown: 600
    effects:
      - { TEMP_BLOCK: { shape: POINT, material: COBWEB, ticks: 40, airOnly: true, who: "@Victim" } }
      - { POTION_LOCK: { effect: SPEED, ticks: 40, who: "@Victim" } }
      - { MESSAGE: { channel: title, text: "{#83cb7b}&l** FANTASY TRAP **", subtitle: "&7from &c{ATTACKER}", who: "@Victim" } }
      - { MESSAGE: { text: "{#83cb7b}&l** FANTASY TRAP &r&7[&f{VICTIM}&7] &r{#83cb7b}&l**" } }
  - on: weapon
    trigger: ATTACK
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: attack, mode: add, amount: 25 } }
