# Matrix: 10-armor-sets.md § Dimensional Traveler — plain diamond set, weaponless; the family's highest
# unconditional multiplier and its heaviest area-denial proc, Dimensional Shift.
# Family (§A): 4/4 completion, PDC identity, no cooldowns — the shift is an independent 1 % roll on EVERY
# incoming hit.
display: "§5§lDimensional Traveler"
# description: not matrix-recorded (factual paraphrase)
description: "§5The regalia of a dimension-walker — you hit harder than anyone in the family, and a rare blow against you tears the sky open on everyone near."
complete: 4
announce: true
# Equip line verbatim, RED (§c) rather than the set's purple — as recorded. No remove line is matrix-recorded.
equip-message: "§c§lDIMENSIONAL TRAVELER SET BONUS: §c+30% DMG"
armor:
  # This entry records neither a material nor a vanilla loadout, so it takes the plain-set family norm:
  # diamond pieces, Durability III + Protection IV. (Leather is the ability-set tier; this is a plain set —
  # the only weaponless one besides Dragon Slayer and KOTH.)
  enchants:
    UNBREAKING: 3
    PROTECTION: 4
  # The shared bonus block, verbatim. Per-piece flavour is authored on the `pieces:` members below — the
  # source's own `barer` typo included, which ships as written. So are the per-piece rosters (14 entries a
  # piece), entry-for-entry in codex order through §A.16's `applyCustomEnchantments`, which has no heroic
  # gate — every entry lands. A plain entry takes the family's nearly-maxed draw
  # min(M, max(1, M-2) + rand(3)) over that enchant's own max M, which `{ nearly-maxed: M }` reproduces
  # literally (the outer min() skew and all); `enchants/obsidianshield` tops out at 1, where the draw is
  # degenerate, so it takes the bare level instead and consumes no draw. A HEROIC entry is TWO stamps in the
  # jar — the heroic at uniform 1..M and its non-heroic partner at that partner's max — and this set carries
  # more of them than any other in the family (seven across the four pieces).
  # WHERE A PARTNER STAMP HAS NO ENTRY OF ITS OWN it authors as a bare max level; where the roster ALSO lists
  # that partner further down (helmet Implants, chest/legs Armored, boots Dodge), the later plain roll
  # overwrites the max stamp in the jar, so the entry sits at its codex position carrying the draw. A map is
  # keyed by ref, so one entry is exactly what "the later roll wins" means.
  # ONE ENTRY IS NOT AUTHORED: the chestplate's `Blood Lust`, not in this pack yet — a set's `enchants:` ref
  # is validated library-wide, so naming it would be a compile error rather than an inert key. It lands with
  # the enchant. There is still no set weapon, so nothing else is owed on the item side.
  lore:
    - "§5§lTRAVELER SET BONUS"
    - "§5§l* §5You deal 30% more damage."
    - "§5§l* §5Dimensional Shift Passive Ability"
    - "§7(§oRequires all 4 dimensional traveler items.§7)"
  pieces:
    helmet:
      material: DIAMOND_HELMET
      name: "§5§lInterdimensional Hood"
      lore:
        - "§7A hood that fades in and out of"
        - "§7existence inside the dimension of the owner."
      enchants:
        enchants/alien-implants: { min: 1, max: 3 }          # its Implants partner is the roster entry below
        enchants/deathbringer: 3                             # the heroic's partner stamp — at max, no draw
        enchants/planetary-deathbringer: { min: 1, max: 3 }
        enchants/drunk: { nearly-maxed: 4 }
        enchants/enlighted: { nearly-maxed: 3 }
        enchants/armored: { nearly-maxed: 4 }
        enchants/tank: { nearly-maxed: 4 }
        enchants/angelic: { nearly-maxed: 5 }
        enchants/hardened: { nearly-maxed: 3 }
        enchants/valor: { nearly-maxed: 5 }
        enchants/dodge: { nearly-maxed: 5 }
        enchants/guardians: { nearly-maxed: 10 }
        enchants/sticky: { nearly-maxed: 8 }
        enchants/implants: { nearly-maxed: 3 }
        enchants/repair-guard: { nearly-maxed: 3 }
    chestplate:
      material: DIAMOND_CHESTPLATE
      name: "§5§lChestplate of Ad Infinitum"
      lore:
        - "§7A cross-dimensional chestplate"
        - "§7with impossibly infinite density"
        - "§7and defensive properties."
      enchants:
        enchants/overload: 3                           # the heroic's partner stamp — at max, no draw
        enchants/godly-overload: { min: 1, max: 3 }
        enchants/paladin-armored: { min: 1, max: 4 }   # its Armored partner is the roster entry below
        # `Blood Lust` sits here in the codex order — not in this pack yet, see the header.
        enchants/enlighted: { nearly-maxed: 3 }
        enchants/deathbringer: { nearly-maxed: 3 }
        enchants/armored: { nearly-maxed: 4 }
        enchants/tank: { nearly-maxed: 4 }
        enchants/angelic: { nearly-maxed: 5 }
        enchants/arrow-deflect: { nearly-maxed: 4 }
        enchants/dodge: { nearly-maxed: 5 }
        enchants/valor: { nearly-maxed: 5 }
        enchants/aegis: { nearly-maxed: 6 }
        enchants/spirit-link: { nearly-maxed: 5 }
        enchants/leadership: { nearly-maxed: 5 }
    leggings:
      material: DIAMOND_LEGGINGS
      name: "§5§lTimeless Robes"
      lore:
        - "§7Robes that evade the 4th dimension and"
        - "§7are in a state of constant existence"
        - "§7across all planets of reality."
      enchants:
        enchants/paladin-armored: { min: 1, max: 4 }   # its Armored partner is the roster entry below
        enchants/enlighted: { nearly-maxed: 3 }
        enchants/clarity: { nearly-maxed: 3 }
        enchants/deathbringer: { nearly-maxed: 3 }
        enchants/nature-wrath: { nearly-maxed: 4 }
        enchants/lucky: { nearly-maxed: 10 }
        enchants/armored: { nearly-maxed: 4 }
        enchants/angelic: { nearly-maxed: 5 }
        enchants/obsidianshield: 1   # max 1 — a nearly-maxed draw here can only ever return 1
        enchants/cactus: { nearly-maxed: 2 }
        enchants/valor: { nearly-maxed: 5 }
        enchants/metaphysical: { nearly-maxed: 4 }
        enchants/death-god: { nearly-maxed: 3 }
        enchants/dodge: { nearly-maxed: 5 }
    boots:
      material: DIAMOND_BOOTS
      name: "§5§lWarp Speed Sandals"
      lore:
        - "§7Sandals capable of breaking through"
        - "§7dimensional barriers to allow the barer"   # verbatim, `barer` and all
        - "§7to perform impossible feats."
      enchants:
        enchants/ethereal-dodge: { min: 1, max: 5 }    # its Dodge partner is the roster entry below
        enchants/enlighted: 3                          # the heroic's partner stamp — at max, no draw
        enchants/divine-enlighted: { min: 1, max: 3 }
        enchants/gears: { nearly-maxed: 3 }
        enchants/deathbringer: { nearly-maxed: 3 }
        enchants/tank: { nearly-maxed: 4 }
        enchants/angelic: { nearly-maxed: 5 }
        enchants/ender-walker: { nearly-maxed: 5 }
        enchants/hardened: { nearly-maxed: 3 }
        enchants/rocket-escape: { nearly-maxed: 3 }
        enchants/springs: { nearly-maxed: 3 }
        enchants/valor: { nearly-maxed: 5 }
        enchants/dodge: { nearly-maxed: 5 }
        enchants/sticky: { nearly-maxed: 8 }
        enchants/diminish: { nearly-maxed: 6 }
# Behaviours: on:armor fires while the set is complete. There is no set weapon, so no on:weapon rung exists.
# The set's OWN world gate (a substring test on the wearer's world, part of the decomposition) rides every
# defensive rung; the family's outpost world gates are a different, interaction-layer rule and stay off.
bonuses:
  # +30 % outgoing, unconditional, with no Infinite Luck check (measured). No exclusivity claimed: the matrix
  # awards that exemption twice, to three sets, and the contradiction is a matrix-maintenance row
  # (deferred-content.md). crystals/dimensional-traveler.yml carries the same normalised wording.
  - on: armor
    trigger: ATTACK
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: attack, mode: add, amount: 30 } }
  # The defensive frame: inside a "dungeon" world the whole defensive side stops before anything runs, and
  # otherwise the wearer's own Resistance is stripped so the set's own maths is the only one pricing the hit.
  # DELTA: the engine's `contains` is case-INSENSITIVE (regionMatches(true, …)) where the jar's test was
  # case-sensitive — a world named "Dungeon" is gated here and was not there.
  - on: armor
    trigger: DEFENSE
    chance: 100
    condition: "(%actor.world% contains \"dungeon\") : %stop%"
    effects:
      - { REMOVE_POTION: { effect: DAMAGE_RESISTANCE, who: "@Self" } }
  # DIMENSIONAL SHIFT — 1 % per incoming hit: a 4 s full root on everyone within 25 blocks, blinded and
  # slowed, under a two-material block storm.
  # THE POLTERGEIST REBATE is authored here, as the deferred-content row owes this entry and on the idiom
  # enchants/nature-wrath established by owner ruling: a rebate belongs to the roll it rebates, so
  # poltergeist.yml publishes the level and the consumer rolls it — two mutually exclusive abilities whose
  # chances sum to the recorded 1 %. D-07-13 makes the share a uniform 12.5 % per Poltergeist level, so it is
  # 0.125 pp per level here. A victim wearing none reads a real 0 and the immune rung collapses to chance 0,
  # so the ordinary case pays nothing for the split. (Mother of Yijki, the family's other Poltergeist
  # consumer, cannot use this shape — its rebate sits per-strike INSIDE DELAYED_STRIKE_FIELD — so that file
  # records the rule instead of authoring it.)
  # THREE DELTAS, recorded rather than faked (the three nature-wrath.yml carries):
  #  * SUBJECT — the roll reads ONE body, the DEFENSE pass's %victim% (the attacker who hit the wearer), where
  #    the jar rolled per AoE member. Nothing on the surface filters a selector by a per-target fact.
  #  * SCOPE — an immune roll therefore spares the WHOLE scan, not just the immune attacker.
  #  * WINDOW — the jar's 8 000 ms immunity, which the falling blocks also honoured, has no expression; an
  #    immune roll here simply means this activation never happens.
  # The Clarity gate the matrix records on the BLINDNESS rung needs nothing authored: enchants/clarity is an
  # autonomous 3-tick scrubber in this port, so a victim wearing it sheds the blindness on its own while the
  # SLOW — never Clarity-gated, measured — stays.
  # The recorded +4 Y on the two cues is AUTHORED, on `dy` (wave 2e.2): it translates the anchor a cue plays
  # at, which is the knob this entry always needed — `who` reads only the entity channel, so a location
  # selector would have moved the cue off the victim to the activation point (the reflective-block.yml
  # reading), and `spread-y` only widens a scatter.
  # `group:` is the IMPACT scope (ADR-0074 §4): the field's blocks carry it to their landings and fire ONLY
  # the payload below, instead of every IMPACT ability the wearer happens to own. The arm and the payload are
  # two separate bonuses with two different def ids, so the authored group is the only identity they share —
  # and it must be spelled the SAME on both or the field fires nothing. The name is this set's own proc, not
  # a family word, so the coarse-identity collision the ADR records cannot reach it. Nothing suppresses on
  # this key (no `SUPPRESS{scope: GROUP, key: dimensional-shift}` exists anywhere in the pack), so declaring
  # it changes gate 5 for neither rung.
  - on: armor
    trigger: DEFENSE
    group: "dimensional-shift"
    chance: "1 - 0.125 * %victim.enchlevel.poltergeist%"
    condition: "(%actor.world% contains \"dungeon\") : %stop%"
    effects:
      - { FREEZE: { duration: 80, dot: 0, slow: 100, who: "@Aoe{r=25, filter=ENEMIES}" } }
      - { POTION: { effect: BLINDNESS, level: 1, duration: 60, who: "@Aoe{r=25, filter=ENEMIES}" } }
      - { POTION: { effect: SLOW, level: 1, duration: 80, who: "@Aoe{r=25, filter=ENEMIES}" } }
      - { SOUND: { sound: "ENTITY_ENDERMAN_TELEPORT", volume: 1.0, pitch: 1.1, dy: 4, who: "@Aoe{r=25, filter=ENEMIES}" } }
      - { SOUND: { sound: "BLOCK_ANVIL_LAND", volume: 1.0, pitch: 1.1, dy: 4, who: "@Aoe{r=25, filter=ENEMIES}" } }
      # {ATTACKER} on a DEFENSE activation is the WEARER — the caster this line names. {RELATION_COLOR} (wave
      # 2e.2) restores the jar's per-reader colour, so the string is verbatim again — the jar's own §c
      # included, which was always overridden by the colour that follows it. Every recipient of THIS line is
      # an enemy of the wearer (the selector filters ENEMIES), so the token can only ever pick `enemy-color`,
      # left at its `&c` default — the same code point the jar wrote — and `ally-color` is unreachable here,
      # so no value is invented for it.
      - { MESSAGE: { text: "§5§l** DIMENSIONAL SHIFT (§c{RELATION_COLOR}{ATTACKER} [4s]§5§l) **", who: "@Aoe{r=25, filter=ENEMIES}" } }
      # The block field in full: a 9×9 grid 10 above each victim, 3–4 layers each rising 12–19 per index, at
      # 50 % density over a uniform END_STONE/NETHERRACK palette (≈142 blocks a target). damage-percent 15
      # under health-cap 44 is the recorded 0.15 × min(maxhealth, 44) — 3.0 at 20 HP, 6.6 flat from 44 up —
      # and rehit-max 4 per rehit-window 200 t is the ability's lethality ceiling (26.4 health per 10 s),
      # shared across every wearer raining on one victim. COBWEB kills a block mid-flight: the counterplay.
      # ttl: 100 is a port choice (the codex records none); blocks never place, by engine design.
      - { FALLING_BLOCK: { material: END_STONE, material2: NETHERRACK, radius: 4, height: 10, ttl: 100,
            layers-min: 3, layers-max: 4, layer-step-min: 12, layer-step-max: 19, density: 50,
            damage-percent: 15, health-cap: 44, rehit-max: 4, rehit-window: 200, kill-material: COBWEB,
            who: "@Aoe{r=25, filter=ENEMIES}" } }
  # Poltergeist immune — the same roll spent on the blocked line instead of the shift. The consumer's own name
  # is inlined ({source} has no token binding), which also makes the rendered line byte-identical.
  - on: armor
    trigger: DEFENSE
    chance: "0.125 * %victim.enchlevel.poltergeist%"
    condition: "(%actor.world% contains \"dungeon\") : %stop%"
    effects:
      - { MESSAGE: { text: "§4§l* POLTERGEIST [§7Immune: Dimensional Traveler§4§l] *", who: "@Victim" } }
  # The field's landing payload. A landing block fires the actor's IMPACT abilities on what it hit and
  # forwards the field's computed bite as %damage%; the engine spends the re-hit ceiling at the landing, so
  # this rung is already capped at 4 hits per victim per 10 s. MODIFY_HEALTH take is the recorded RAW health
  # subtraction — armour and protection never price it, and unlike Revenge of Yijki it CAN kill.
  # The profile's on-hit UNFREEZE rides `STATUS_CLEAR: FREEZE` (wave 2e): a landing block shakes its victim
  # loose of the 80 t root the same activation armed, which is the jar's own re-hit behaviour. Clearing a
  # window nobody holds is a silent no-op, so the rung costs the ordinary landing nothing.
  - on: armor
    trigger: IMPACT
    group: "dimensional-shift"   # the arm's group, verbatim — the pair is matched on this string alone
    chance: 100
    condition: "%victim.type% == \"PLAYER\""
    effects:
      - { MODIFY_HEALTH: { amount: "%damage%", mode: take, who: "@Victim" } }
      - { STATUS_CLEAR: { status: FREEZE, who: "@Victim" } }
      - { SOUND: { sound: "ENTITY_ZOMBIE_BREAK_WOODEN_DOOR", volume: 1.0, pitch: 1.0, who: "@Victim" } }  # volume/pitch not recorded
# D-10-6: the jar ALSO procs the shift unconditionally when the attacker is a sneaking player with one
# hard-coded name — a developer backdoor on the combat hot path. Removed; nothing above answers a name.
# era: ENDER_STONE → END_STONE has an alias row (added with the wave-2d.2 phantom-block work), so the palette
# resolves on both lanes, and ANVIL_LAND carries one. ENDERMAN_TELEPORT → ENTITY_ENDERMAN_TELEPORT and
# ZOMBIE_WOODBREAK → ENTITY_ZOMBIE_BREAK_WOODEN_DOOR landed in wave 2e (javap-verified on 1.8.8 and on
# 1.21.11 / 26.1.2), so the shift's teleport cue and the impact cue both resolve on the legacy fork too.
# Falling-block entities and their block-state data differ per era — the engine's FALLING_BLOCK owns that
# seam — and a walk-speed-0 freeze is era-safe.
# Interaction-layer rules the set decomposition does NOT own, recorded but not authored here:
#  * target filters beyond filter=ENEMIES: faction TRUCE-or-better, god-mode, spectator/NPC, PvP-deny regions,
#    and victim Infinite Luck >= 5 (the highest threshold in the plugin).
#  * Phoenix on a victim can absorb a block hit — the block dies without damaging.
#  * Armor Crystal route (§A.7/§C.1): DAMAGE_MOD(side=attack, amount=7.5) per crystal-bearing non-set piece
#    (4 → ×1.30), plus a shift roll of 0.002 × pieces per incoming hit. Owned by the crystals family;
#    crystals/dimensional-traveler.yml ships both halves, its rider copied from the payload below in the same
#    sitting (the crystal's lore advertises "20%" against that measured 0.2 %/piece — measured wins, the
#    mismatch is recorded).
#  * the wearer is never a target (AOE excludes the activator), and frozen players surviving a teleport was
#    dead code in the jar — the engine's FREEZE lifecycle handles teleports correctly.
