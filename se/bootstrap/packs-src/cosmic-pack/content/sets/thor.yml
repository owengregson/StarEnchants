# Thor — diamond storm set; thunderous damage, reduction, and Mjolnir.
display: "{#4482f4}&lThor"
description: "{#4482f4}Wield the thunderous might of Thor with the Thor set, forged in the heart of storms and imbued with the power of lightning."
complete: 4
# Announce on a completion transition (Cosmic Pack default; set name + colour authored verbatim).
announce: true
equip-message: "\n{#4482f4}&l** Thor SET EQUIPPED {#4482f4}&l**\n"
remove-message: "\n&7&l** Thor SET REMOVED **\n"
armor:
  enchants:
    PROTECTION: 4
    UNBREAKING: 3
  lore:
    - "{#4482f4}Wield the thunderous might of Thor with the Thor set, forged in the heart of storms and imbued with the power of lightning."
    - ""
    - "{#4482f4}&lTHOR SET BONUS"
    - "{#4482f4}* Deal 20% more damage to all enemies"
    - "{#4482f4}* Enemies deal 10% less damage to you"
    - "{#4482f4}* Stormcaller Passive Ability"
    - ""
    - "{#4482f4}&lSTORMCALLER"
    - "{#4482f4}* Chance to strike all nearby enemies with supercharged lightning that deals high damage"
    - "&7&o(Requires all four Thor set items.)"
  pieces:
    helmet:     { material: DIAMOND_HELMET,     name: "{#4482f4}&lElectric Helmet&r" }
    chestplate: { material: DIAMOND_CHESTPLATE, name: "{#4482f4}&lShocking Plate&r" }
    leggings:   { material: DIAMOND_LEGGINGS,   name: "{#4482f4}&lProtective Garments&r" }
    boots:      { material: DIAMOND_BOOTS,      name: "{#4482f4}&lCharged Sandals&r" }
weapon:
  enchants:
    SHARPNESS: 5
    UNBREAKING: 3
  material: DIAMOND_AXE
  name: "{#4482f4}&lMjolnir&r"
  lore:
    - "{#4482f4}Wield the legendary Mjolnir, the hammer of Thor, imbued with the thunderous power of storms and lightning."
    - ""
    - "{#4482f4}&lTHOR WEAPON BONUS"
    - "{#4482f4}* Deal 5% more damage to all enemies"
    - "&7&o(Requires all four Thor set items.)"
# Behaviours: on:armor fires while the set is complete; on:weapon also requires the set weapon held.
bonuses:
  - on: armor
    trigger: DEFENSE
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: defense, mode: add, amount: 10 } }
  - on: weapon
    trigger: ATTACK
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: attack, mode: add, amount: 25 } }
  # Stormcaller — 15% on hit (30s cd): smite every ENEMY within 7 blocks (never the wearer, allied players, or
  # passive mobs) with lightning dealing 40% of this hit's pre-fold damage.
  - on: armor
    trigger: ATTACK
    chance: 15
    cooldown: 600
    effects:
      - { LIGHTNING: { damage: "%damage% * 0.4", who: "@Aoe{r=7, filter=ENEMIES}" } }
      - { PARTICLE: { particle: ELECTRIC_SPARK, count: 20, who: "@Aoe{r=7,filter=ENEMIES}" } }
      - { MESSAGE: { channel: title, text: "{#4482f4}&l** STORMCALLER **", subtitle: "&7from &c{ATTACKER}", who: "@Victim" } }
      - { MESSAGE: { text: "{#4482f4}&l** STORMCALLER &r&7[&f{VICTIM}&7] &r{#4482f4}&l**" } }
