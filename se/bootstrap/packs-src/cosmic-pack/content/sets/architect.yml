# Matrix: 10-armor-sets.md § Architect — ability set ("M-Kit"), frame per § Ghost and §A.10-A.15, §C.3-C.5.
# Family (§A): completion is all-or-nothing at 4/4 (no 2/3-piece tiers), identity is engine PDC + WornState
# (the jar's forgeable lore matching and its 30 s stale-cache window are infrastructure-class bugs, not ported),
# and there are NO cooldowns anywhere.
#
# Byte-identical to Death Knight in every particular the matrix records — piece names, empty flavour, dye,
# armour values, durability, rosters, probabilities, the 45 % reduction and the mastery pool. Set IDENTITY is
# the only runtime distinction (the class is a line-for-line copy, measured), so this file repeating
# sets/death-knight.yml IS the likeness, not a duplication to collapse.
display: "§b§lArchitect"
# The set display is AQUA while its ITEMS keep blue Death Knight branding — measured, reproduced.
# description: not matrix-recorded (factual paraphrase)
description: "§bA Mastery Kit — the power is in the mastery enchants rolled onto the pieces, not in a set proc."
complete: 4
# Equipping is silent: the ability sets carry an empty equip description (measured), so no announce and no
# equip/remove line.
announce: false
armor:
  # Matrix (§ Ghost, the frame this set is identical to): Unbreaking III + Protection IV on every piece.
  enchants:
    UNBREAKING: 3
    PROTECTION: 4
  # The dye, the guaranteed base rosters (9/9/8/8) and the named probability rolls are all authored on the
  # `pieces:` members below, byte-for-byte as sets/death-knight.yml authors them. NO member carries `lore:`,
  # and that absence is the measured fact (as Death Knight): these pieces were built with no flavour at all,
  # so the whole lore block is the heroic append and `lore:` here carries only its piece-independent tail.
  # `chance` is a double (R-QC51), so the half-point rungs — 17.5 % Alien Implants (helmet), 17.5 % Godly
  # Overload / 22.5 % Planetary Deathbringer / 22.5 % Divine Enlighted (chest), 22.5 % Ethereal Dodge /
  # 12.5 % Guided Rocket Escape (boots) — author as written. `ability-set: M` is the SECOND roller shape
  # (R-QC64): the ability sets' own helper, codex §A.11 — `M - rand(min(4, M))`, a rung wider at the bottom
  # than `nearly-maxed`, plus a 25 % chance to shave one level off a natural max above 1. The plain sets keep
  # `nearly-maxed: M` (§A.16).
  # What STILL has no home is recorded here:
  #   per-piece heroic append — a member's `lore:` prints ABOVE the shared block, and this pair belongs
  #     between its blank and its last line:
  #     helmet "§7+2 Armor Value" / "§7810 Durability"    chestplate "§7+4 Armor Value" / "§71000 Durability"
  #     leggings "§7+3 Armor Value" / "§7935 Durability"  boots "§7+2 Armor Value" / "§7686 Durability"
  #   armour values halved by the M-Kit rule: 2/4/3/2 (11 across the set, against 20 for non-M-Kit gear)
  #   the per-slot durabilities 810/1000/935/686
  #   per-piece M-Kit incoming reduction: chest 16 %, legs 13 %, boots 8 %, helm 8 % — folded into the single
  #     completion bonus below, at the measured full-set total
  # The copy carries Death Knight's quirks whole: the boots roll Valor and Angelic at 60 % but NOT Tank, take
  # no Phoenix re-roll, and Immortal rolls on two pieces (35 % helm, 30 % legs).
  lore:
    - ""
    - "§4This armor is stronger than diamond."
  # Every piece is #2239B9 leather (decimal 2243001, deep royal blue) — Death Knight's dye, shared; the
  # Architect Mastery Shard is visually identical to Death Knight's apart from its name.
  # `heroic: true` is DELIBERATELY NOT set, though the jar's pieces carry the heroic stamp: it would route
  # items/heroic.yml's per-piece reduction into the same additive channel `DamageFold` gives the 45 %
  # completion row below, and that row already IS this set's heroic wall folded — stamping the members would
  # bill it twice (45 + 27). R-QC50 rejected the M-Kit's own steeper heroic tier PERMANENTLY, so this is the
  # final shape rather than a wait for a second grade of items/heroic.yml (ADR-0073).
  # `Gears` at MAX is guaranteed on the boots and boots only — armor.enchants above is set-wide and would
  # stamp all four.
  pieces:
    helmet:
      material: LEATHER_HELMET
      name: "§9§lCrown of the Lich King"
      color: "#2239B9"
      enchants:
        # The 9-entry base roster: no chance gate, so every minted helmet carries all nine. It drops
        # Ghost/Necromancer's `Resilience` and adds `Ender Shift`, `Aquatic` and `Repair Guard`.
        enchants/armored: { ability-set: 4 }
        enchants/implants: { ability-set: 3 }
        enchants/drunk: { ability-set: 4 }
        enchants/arrow-deflect: { ability-set: 4 }
        enchants/death-god: { ability-set: 3 }
        enchants/protection: { ability-set: 5 }   # the pack's CUSTOM Protection, not the vanilla PROTECTION 4 above
        enchants/ender-shift: { ability-set: 3 }
        enchants/aquatic: { ability-set: 1 }
        enchants/repair-guard: { ability-set: 3 }
        enchants/valor: { chance: 60, ability-set: 5 }
        enchants/angelic: { chance: 60, ability-set: 5 }
        enchants/tank: { chance: 60, ability-set: 4 }
        enchants/paladin-armored: { chance: 20, ability-set: 4 }
        enchants/alien-implants: { chance: 17.5, ability-set: 3 }
        enchants/immortal: { chance: 35, ability-set: 4 }
    chestplate:
      material: LEATHER_CHESTPLATE
      name: "§9§lDeath Knight Platebody"
      color: "#2239B9"
      enchants:
        # The 9-entry base roster: Ghost/Necromancer's chest list with `Blood Link` for `Shockwave`. Its 8th,
        # `Blood Lust`, is the one member absent from this pack — it lands with R-QC46 (wave 3b-3), and a set's
        # `enchants:` ref is validated library-wide, so naming it early is a compile ERROR, not an inert key.
        enchants/armored: { ability-set: 4 }
        enchants/overload: { ability-set: 3 }
        enchants/deathbringer: { ability-set: 3 }
        enchants/enlighted: { ability-set: 3 }
        enchants/diminish: { ability-set: 6 }
        enchants/aegis: { ability-set: 6 }
        enchants/leadership: { ability-set: 5 }
        # enchants/blood-lust: { ability-set: M }   # 8th base entry — blocked on R-QC46
        enchants/blood-link: { ability-set: 5 }
        enchants/valor: { chance: 60, ability-set: 5 }
        enchants/angelic: { chance: 60, ability-set: 5 }
        enchants/tank: { chance: 60, ability-set: 4 }
        enchants/paladin-armored: { chance: 20, ability-set: 4 }
        enchants/godly-overload: { chance: 17.5, ability-set: 3 }
        enchants/planetary-deathbringer: { chance: 22.5, ability-set: 3 }
        enchants/divine-enlighted: { chance: 22.5, ability-set: 3 }
        enchants/vengeful-diminish: { chance: 15, ability-set: 6 }
    leggings:
      material: LEATHER_LEGGINGS
      name: "§9§lDeath Knight Leggings"
      color: "#2239B9"
      enchants:
        # The 8-entry base roster: Necromancer's legs list with `Dodge` where that set takes `Clarity` —
        # the two swap slots here, `Clarity` moving to the boots.
        enchants/armored: { ability-set: 4 }
        enchants/nature-wrath: { ability-set: 4 }
        enchants/dodge: { ability-set: 5 }
        enchants/obsidianshield: { ability-set: 1 }
        enchants/cactus: { ability-set: 2 }
        enchants/lucky: { ability-set: 10 }
        enchants/voodoo: { ability-set: 6 }
        enchants/spirits: { ability-set: 10 }
        enchants/valor: { chance: 60, ability-set: 5 }
        enchants/angelic: { chance: 60, ability-set: 5 }
        enchants/tank: { chance: 60, ability-set: 4 }
        enchants/paladin-armored: { chance: 20, ability-set: 4 }
        enchants/immortal: { chance: 30, ability-set: 4 }
    boots:
      material: LEATHER_BOOTS
      name: "§9§lBoots of the Scourge"
      color: "#2239B9"
      enchants:
        # The 8-entry base roster: no `Dodge` (it moved to the legs) and `Clarity` in its place. `Phoenix` is
        # certain here and takes NO second draw on this set, unlike Ghost's 45 % and Necromancer's 35 %.
        enchants/armored: { ability-set: 4 }
        enchants/metaphysical: { ability-set: 4 }
        enchants/ender-walker: { ability-set: 5 }
        enchants/springs: { ability-set: 3 }
        enchants/rocket-escape: { ability-set: 3 }
        enchants/phoenix: { ability-set: 3 }
        enchants/guardians: { ability-set: 10 }
        enchants/clarity: { ability-set: 3 }
        enchants/gears: 3   # guaranteed, at Gears' own max
        enchants/valor: { chance: 60, ability-set: 5 }
        enchants/angelic: { chance: 60, ability-set: 5 }   # no Tank roll here — measured, reproduced
        enchants/paladin-armored: { chance: 20, ability-set: 4 }
        enchants/ethereal-dodge: { chance: 22.5, ability-set: 5 }
        enchants/guided-rocket-escape: { chance: 12.5, ability-set: 3 }
# Behaviours. The jar grants the M-Kit reduction PER WORN PIECE (§C.3-C.5); the engine gates a set bonus on
# completion, so the four component stats fold into this one 4/4 bonus at their measured full-set 45 %.
# Additive here, multiplicative in the jar (project-wide damage model, a global ADR — not a per-item deviation).
# The only delta is partial wear: two worn pieces pay 16+13 in the jar and nothing here until the fourth lands.
# `items/heroic.yml` carries ONE flat percent for every heroic piece; R-QC50 rejected a per-slot ladder and the
# M-Kit's own heroic tier PERMANENTLY, so this row is final and nothing will arrive to double-count against it.
bonuses:
  - on: armor
    trigger: DEFENSE
    chance: 100
    effects:
      - { DAMAGE_MOD: { side: defense, mode: add, amount: 45 } }
# Mastery pool (matrix/07; 2 drawn without replacement, 50 % each): Chain Lifesteal, Death Pact, Tombstone,
# Permafrost — identical to Death Knight's, and that sharing is what leaves the Anti-M-Kit question open below.
#
# Interaction-layer rules the set decomposition does NOT own, recorded but not authored here:
#  * piece identity is data (a per-set NBT tag in the jar -> engine PDC component); pieces refuse normal enchant
#    books unless the book carries a matching Mastery Shard (§C.9: 100 % apply, one of each set per book).
#    Armor Crystals CAN be applied to M-Kit gear that carries no blocked mastery enchant (§A.15).
#  * Anti-M-Kit interplay is codex-UNRESOLVED and needs an owner ruling: the shared pool's enchants almost
#    certainly tag as DEATH KNIGHT's, which would leave an Architect Anti-M-Kit Crystal inert against them. The
#    port either tags the shared pool per-set (both crystals live) or replicates the likely-inert measured
#    wiring. Nothing is authored either way — the crystals family owns the cancel.
#  * heroic pieces negate an enemy's Infinite Luck at 12.5 % per piece — ledger D-10-1 (the jar counts them from
#    the Infinite Luck holder's own armour, a self-negation; the port counts the attacker's). Only Ghost's legs
#    can roll Infinite Luck, so this set meets the rule from the other side.
#  * Death Knight and Architect pieces never combine into one set: matching is by set identity, not by the
#    (identical) piece names.
#  * outpost world gates (TRAINEE/VANILLA/HERO, §A.8) block set bonuses; off by default in the port — a server
#    that wants them adds `disabled-worlds:` to the bonus above.
# era: leather dye is era-safe on both lanes; the extra armour value needs defence mods on 1.8.9 (no armour
# attribute); the ability-set roll distribution is reproduced by the pack minter, not by item data.
