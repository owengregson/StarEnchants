# Heroic Black Scroll — extracts one configured normal/soul/Heroic-tier enchant into the existing book pipeline.
type: heroic-black-scroll

# The generic plugin-item guard prevents the stamped scroll from being eaten. On 1.8.9 this degrades to INK_SACK.
material: DRIED_KELP
name: "&d&lHeroic Black Scroll"
lore:
  - ""
  - "&d{MIN}%-{MAX}% Success Rate"
  - ""
  - "&eRemoves a random enchantment from your"
  - "&eitem and returns it to your inventory"
  - "&ewith the specified success rate."
  - ""
  - "&d&l(!) &dChance to extract Heroic enchantments"
  - ""
  - "&eApplies to: &f&nArmor, Weapon, & Tool"
  - "&7Drag n' Drop on an item to apply."
applies-to: [ARMOR, WEAPON, TOOL]
# Exact, case-sensitive keys from content/tiers.yml. Enchant group: tags do not affect scroll eligibility.
eligible-tiers: [common, uncommon, rare, epic, legendary, soul, mythic]
min-convert: 10
max-convert: 35
sound: "entity.player.levelup"
particles: [WITCH, ENCHANTED_HIT]
