# Holy White Scroll (docs/v3-directives.md §I) — drag it onto a piece of gear to APPLY a one-shot keep-on-
# death marker to THAT item. When you die, the marked item is kept (the rest of your inventory drops as
# normal) and the marker is consumed. Applied items are not exclusive — a holy white scroll may sit alongside
# a white scroll and any trak gems. This is distinct from the always-on KEEP_ON_DEATH enchant
# (whole inventory) and from the White Scroll (enchant-destruction guard). One physical item per file;
# reload with /se reload. Messages live in lang.yml (scroll.holy.*).
type: holy-white-scroll

# The TOTEM_OF_UNDYING likeness is DISPLAY ONLY: the vanilla totem pop is suppressed (HolyTotemGuard), so the
# scroll keeps one marked item through death — it does NOT prevent the death like a real totem. On 1.8.9 there
# is no totem item or pop to suppress. The shipped signature pack overrides this to MAP.
material: TOTEM_OF_UNDYING
name: "&fHoly White Scroll"
# {KINDS} expands to the grammatically-joined applies-to label.
lore:
  - "&7Drag onto an item to keep"
  - "&7it when you die (one use)."
  - ""
  - "&eApplies to: &r&f&n{KINDS}"
# Item-group kinds this scroll may protect: ALL (any item) by default; e.g. ARMOR, WEAPON, TOOL.
applies-to: [ALL]
# Each apply rolls a success in [min-success, max-success] (each 0–100). On a failed roll the scroll is spent
# without protecting (it never destroys gear). 100/100 = always succeeds (the default — no behaviour change).
min-success: 100
max-success: 100

# The lore line stamped onto a holy-protected item — rendered from state while the keep marker is present (at
# the bottom of the lore, above any trak lines) and removed when the marker is consumed on death.
protected-line: "&e&l*&f&lHOLY&e&l* &f&lPROTECTED"

# ── Corruption ────────────────────────────────────────────────────────────────────────────────────────
# An item may only ever SPEND this many holy white scrolls in its lifetime. The count rises when a scroll
# actually does its job — the keep marker consumed by a death — not when one is applied, so an apply the
# owner never cashes in costs the item nothing. At the maximum the item is CORRUPTED and refuses further
# holy white scrolls (the scroll is not consumed). 0 = unlimited, and no corruption line ever renders.
max-protections: 7

# The corruption line, rendered from the spent count directly BELOW the protected-line above. Which one
# shows is a percentage of max-protections, so these read the same at any maximum: 1–49% semi, 50–99% very,
# 100% full. {AMOUNT} = protections spent, {MAX} = max-protections. Blank a line to hide that stage.
corrupt-lines:
  semi: "&c&lSEMI CORRUPT (&r&f&n{AMOUNT}&r&7 / {MAX} Holy Protections&r&c&l)"
  very: "&c&lVERY CORRUPT (&r&f&n{AMOUNT}&r&7 / {MAX} Holy Protections&r&c&l)"
  full: "&c&lCORRUPTED (&r&f&n{AMOUNT}&r&7 / {MAX} Holy Protections&r&c&l)"
